    function referenceLineChart(expanded = false, monthly = [], showMonths = true, selectedYear = IBC_YEAR_START, selectedMonth = null, selectedDay = null, transactions = []) {
      const width = expanded ? 1525 : 1164;
      const height = expanded ? 320 : 320;
      const chartAspect = window.matchMedia && window.matchMedia('(max-width: 700px)').matches ? 'xMinYMid meet' : 'xMidYMid meet';
      const labels = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
      const axisLeft = expanded ? 62 : 58;
      const axisRight = width - 8;
      const plotTop = expanded ? 19 : 22;
      const labelY = expanded ? height - 19 : height - 24;
      const plotBottom = labelY - (expanded ? 38 : 50);
      const periodAxis = (count, labelPadding) => {
        const edgeMargin = Math.max(labelPadding + 24, expanded ? 70 : 58);
        const usableWidth = Math.max(1, width - edgeMargin * 2);
        const step = count > 1 ? usableWidth / (count - 1) : 0;
        const centerLabels = Array.from({ length: count }, (_, index) => Math.round(edgeMargin + step * index));
        const boundaries = [0, ...centerLabels, width];
        return {
          boundaries,
          points: centerLabels,
          labels: centerLabels,
          end: width
        };
      };
      const monthAxis = periodAxis(labels.length, 34);
      const pointX = monthAxis.points;
      const labelX = monthAxis.labels;
      const grid = monthAxis.boundaries;
      const chartValueText = amount => {
        const number = Number(amount || 0);
        const sign = number < 0 ? '-' : '';
        const abs = Math.abs(number);
        const compact = value => value.toLocaleString('pt-BR', { maximumFractionDigits: value < 10 && !Number.isInteger(value) ? 2 : 1 });
        if (abs >= 1000000) return `${sign}${compact(abs / 1000000)} mi`;
        if (abs >= 100000) return `${sign}${compact(abs / 1000)} mil`;
        return `${sign}${abs.toLocaleString('pt-BR', { maximumFractionDigits: abs % 1 ? 2 : 0 })}`;
      };
      const axisValueText = amount => {
        const abs = Math.abs(Number(amount || 0));
        if (abs >= 1000000) return `${(abs / 1000000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mi`;
        if (abs >= 100000) return `${(abs / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 0 })} mil`;
        return abs.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
      };
      const niceAxis = value => {
        const max = Math.max(Number(value || 0), 1);
        if (max >= 100000) {
          const step = 100000;
          const tickCount = Math.max(1, Math.ceil(max / step));
          return { max: step * tickCount, step, tickCount };
        }
        const tickCount = 8;
        const roughStep = max / tickCount;
        const magnitude = 10 ** Math.floor(Math.log10(roughStep));
        const unit = [1, 2, 2.5, 5, 10].find(item => roughStep <= item * magnitude) || 10;
        const step = unit * magnitude;
        return { max: step * tickCount, step, tickCount };
      };
      const smoothPath = (xPositions, yPositions, endX) => {
        const points = yPositions.map((y, index) => ({ x: xPositions[index], y }));
        if (!points.length) return '';
        const clampY = value => Math.max(plotTop, Math.min(plotBottom, Math.round(value)));
        if (points.length === 1) return `M0 ${points[0].y}${endX ? ` L${endX} ${points[0].y}` : ''}`;
        const first = points[0];
        const second = points[1];
        const last = points[points.length - 1];
        const beforeLast = points[points.length - 2];
        const startX = 0;
        const targetEndX = width;
        const startSlope = (second.y - first.y) / Math.max(1, second.x - first.x);
        const endSlope = (last.y - beforeLast.y) / Math.max(1, last.x - beforeLast.x);
        const edgePoints = [
          { x: startX, y: clampY(first.y - startSlope * (first.x - startX)) },
          ...points
        ];
        if (targetEndX > last.x) {
          edgePoints.push({ x: targetEndX, y: clampY(last.y + endSlope * (targetEndX - last.x)) });
        }
        return edgePoints.map((point, index) => `${index ? 'L' : 'M'}${point.x} ${point.y}`).join(' ');
      };
      const horizontalGrid = () => '';
      const divisionBands = axis => axis.labels
        .map(value => `<rect x="${value - 1}" y="0" width="2" height="${height}" fill="#e3e3e3"></rect>`)
        .join('');
      const profitValues = (incomeValues, outValues) => incomeValues.map((value, index) => Math.max(0, Number(value || 0) - Number(outValues[index] || 0)));
      const placedPointLabels = [];
      const labelsOverlap = (a, b) => (
        a.x < b.x + b.w + 5 &&
        a.x + a.w + 5 > b.x &&
        a.y < b.y + b.h + 5 &&
        a.y + a.h + 5 > b.y
      );
      const pointValueLabels = (xPositions, points, amounts, color, placement = 'above') => points.map((y, index) => {
        const amount = Number(amounts[index] || 0);
        if (!amount) return '';
        const x = xPositions[index];
        const value = chartValueText(amount);
        const labelWidth = Math.max(26, Math.min(70, value.length * 6.2));
        const labelHeight = 14;
        let labelX = Math.round(x - labelWidth / 2);
        labelX = Math.max(axisLeft + 2, Math.min(axisRight - labelWidth - 2, labelX));
        const minY = 5;
        const maxY = Math.max(minY, labelY - labelHeight - 34);
        const aboveY = Math.round(y - labelHeight - 9);
        const belowY = Math.round(y + 11);
        const firstY = placement === 'below' ? belowY : aboveY;
        const secondY = placement === 'below' ? aboveY : belowY;
        const candidates = [firstY, secondY];
        const step = labelHeight + 5;
        for (let attempt = 1; attempt <= 5; attempt += 1) {
          candidates.push(firstY + (placement === 'below' ? step * attempt : -step * attempt));
          candidates.push(secondY + (placement === 'below' ? -step * attempt : step * attempt));
        }
        const textTop = candidates
          .map(candidate => Math.max(minY, Math.min(maxY, candidate)))
          .find(candidate => !placedPointLabels.some(rect => labelsOverlap({ x: labelX, y: candidate, w: labelWidth, h: labelHeight }, rect)));
        if (textTop === undefined) return '';
        placedPointLabels.push({ x: labelX, y: textTop, w: labelWidth, h: labelHeight });
        return `<text class="ibc-point-value" x="${Math.round(labelX + labelWidth / 2)}" y="${textTop + 11}" text-anchor="middle" fill="${color}">${escapeHtml(value)}</text>`;
      }).join('');
      const months = dashboardMonths(12, selectedYear);
      const byMonth = Object.fromEntries((monthly || []).map(item => [item.Mes, item]));
      const values = months.map(month => byMonth[month.key] || { Entrada: 0, Saida: 0 });
      const entradaValues = values.map(item => Number(item.Entrada || 0));
      const saidaValues = values.map(item => Number(item.Saida || 0));
      const lucroValues = profitValues(entradaValues, saidaValues);
      const maxValue = Math.max(...lucroValues, 1);
      const monthScale = niceAxis(maxValue);
      const scaleY = value => Math.round(plotBottom - (Number(value || 0) / monthScale.max) * (plotBottom - plotTop));
      const chartBlueY = lucroValues.map(scaleY);
      const path = values => smoothPath(pointX, values, monthAxis.end);
      const dots = (points, amounts, color, flowLabel) => points.map((y, index) => {
        const x = pointX[index];
        const value = money.format(Number(amounts[index] || 0));
        const label = `${flowLabel} ${labels[index]}: ${value}`;
        return `
          <g class="ibc-dot-hit" role="button" tabindex="0" aria-label="${escapeHtml(label)}" data-x="${x}" data-y="${y}" data-value="${escapeHtml(value)}" data-color="${color}" onclick="showIbcPointValue(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showIbcPointValue(event)}">
            <circle cx="${x}" cy="${y}" r="6" fill="${color}" stroke="#fff" stroke-width="2.5"><title>${escapeHtml(label)}</title></circle>
          </g>`;
      }).join('');
      if (showMonths && selectedMonth) {
        const totalDays = daysInMonth(selectedYear, selectedMonth);
        const dayLabels = Array.from({ length: totalDays }, (_, index) => String(index + 1).padStart(2, '0'));
        const dayAxis = periodAxis(dayLabels.length, 16);
        const dayPointX = dayAxis.points;
        const dayLabelX = dayAxis.labels;
        const monthKey = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;
        const totalsByDay = Object.fromEntries(dayLabels.map(day => [day, { Entrada: 0, Saida: 0 }]));
        (transactions || []).forEach(item => {
          const date = String(item.Data || '');
          if (!date.startsWith(`${monthKey}-`)) return;
          const day = date.slice(8, 10);
          if (!totalsByDay[day]) return;
          if (item.Fluxo === 'Entrada') totalsByDay[day].Entrada += Number(item.Valor || 0);
          if (item.Fluxo === 'Saída') totalsByDay[day].Saida += Number(item.Valor || 0);
        });
        const dayEntradaValues = dayLabels.map(day => totalsByDay[day].Entrada);
        const daySaidaValues = dayLabels.map(day => totalsByDay[day].Saida);
        const dayLucroValues = profitValues(dayEntradaValues, daySaidaValues);
        const dayMax = Math.max(...dayLucroValues, 1);
        const dayScale = niceAxis(dayMax);
        const dayScaleY = value => Math.round(plotBottom - (Number(value || 0) / dayScale.max) * (plotBottom - plotTop));
        const dayBlueY = dayLucroValues.map(dayScaleY);
        const dayPath = values => smoothPath(dayPointX, values, dayAxis.end);
        const monthName = labels[selectedMonth - 1];
        const dayDots = (points, amounts, color, flowLabel) => points.map((y, index) => {
          const x = dayPointX[index];
          const value = money.format(Number(amounts[index] || 0));
          const label = `${flowLabel} ${dayLabels[index]}/${String(selectedMonth).padStart(2, '0')}/${selectedYear}: ${value}`;
          return `
            <g class="ibc-dot-hit" role="button" tabindex="0" aria-label="${escapeHtml(label)}" data-x="${x}" data-y="${y}" data-value="${escapeHtml(value)}" data-color="${color}" onclick="showIbcPointValue(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showIbcPointValue(event)}">
              <circle cx="${x}" cy="${y}" r="6" fill="${color}" stroke="#fff" stroke-width="2.5"><title>${escapeHtml(label)}</title></circle>
            </g>`;
        }).join('');
        return `
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="${chartAspect}" role="img" aria-label="Gráfico diário de lucro de ${monthName} de ${selectedYear}">
            <rect x="0" y="0" width="${width}" height="${height}" rx="10" fill="#fff"></rect>
            ${horizontalGrid(dayScale)}
            ${divisionBands(dayAxis)}
            <path d="${dayPath(dayBlueY)}" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
            ${dayDots(dayBlueY, dayLucroValues, '#2563eb', 'Lucro')}
            ${pointValueLabels(dayPointX, dayBlueY, dayLucroValues, '#2563eb', 'above')}
            <text class="ibc-click-value" x="0" y="0"></text>
            ${dayLabels.map((label, index) => `
              <g class="ibc-day-hit ${Number(selectedDay) === index + 1 ? 'active' : ''}" role="button" tabindex="0" data-day="${index + 1}" aria-label="Filtrar dia ${label}/${String(selectedMonth).padStart(2, '0')}/${selectedYear}" onclick="selectIbcDayChart(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectIbcDayChart(event)}">
                <rect x="${dayLabelX[index] - 16}" y="${labelY - 24}" width="32" height="32" fill="transparent"></rect>
                <text class="ibc-day" x="${dayLabelX[index]}" y="${labelY}" text-anchor="middle">${label}</text>
              </g>
            `).join('')}
          </svg>`;
      }
      if (!showMonths) {
        const years = Array.from({ length: IBC_YEAR_END - IBC_YEAR_START + 1 }, (_, index) => IBC_YEAR_START + index);
        const yearAxis = periodAxis(years.length, 44);
        const yearPointX = yearAxis.points;
        const yearLabelX = yearAxis.labels;
        const yearGrid = yearAxis.boundaries;
        const totalsByYear = Object.fromEntries(years.map(year => [year, { Entrada: 0, Saida: 0 }]));
        (monthly || []).forEach(item => {
          const year = Number(String(item.Mes || '').slice(0, 4));
          if (!totalsByYear[year]) return;
          totalsByYear[year].Entrada += Number(item.Entrada || 0);
          totalsByYear[year].Saida += Number(item.Saida || 0);
        });
        const yearEntradaValues = years.map(year => totalsByYear[year].Entrada);
        const yearSaidaValues = years.map(year => totalsByYear[year].Saida);
        const yearLucroValues = profitValues(yearEntradaValues, yearSaidaValues);
        const yearMax = Math.max(...yearLucroValues, 1);
        const yearScale = niceAxis(yearMax);
        const yearScaleY = value => Math.round(plotBottom - (Number(value || 0) / yearScale.max) * (plotBottom - plotTop));
        const yearBlueY = yearLucroValues.map(yearScaleY);
        const yearLabelY = labelY - 8;
        const yearPath = values => smoothPath(yearPointX, values, yearAxis.end);
        const yearDot = (points, amounts, color, flowLabel) => points.map((y, index) => {
          const x = yearPointX[index];
          const value = money.format(Number(amounts[index] || 0));
          const label = `${flowLabel} ${years[index]}: ${value}`;
          return `
            <g class="ibc-dot-hit" role="button" tabindex="0" aria-label="${escapeHtml(label)}" data-x="${x}" data-y="${y}" data-value="${escapeHtml(value)}" data-color="${color}" onclick="showIbcPointValue(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showIbcPointValue(event)}">
              <circle cx="${x}" cy="${y}" r="6" fill="${color}" stroke="#fff" stroke-width="2.5"><title>${escapeHtml(label)}</title></circle>
            </g>`;
        }).join('');
        return `
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="${chartAspect}" role="img" aria-label="Gráfico anual de lucro de 2026 a 2036">
            <rect x="0" y="0" width="${width}" height="${height}" rx="10" fill="#fff"></rect>
            ${horizontalGrid(yearScale)}
            ${divisionBands(yearAxis)}
            <path d="${yearPath(yearBlueY)}" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
            ${yearDot(yearBlueY, yearLucroValues, '#2563eb', 'Lucro')}
            ${pointValueLabels(yearPointX, yearBlueY, yearLucroValues, '#2563eb', 'above')}
            <text class="ibc-click-value" x="0" y="0"></text>
            ${years.map((year, index) => `
              <g class="ibc-year-hit" role="button" tabindex="0" data-year="${year}" aria-label="Abrir meses de janeiro a dezembro de ${year}" onclick="expandIbcYearChart(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();expandIbcYearChart(event)}">
                <rect x="${yearLabelX[index] - 34}" y="${yearLabelY - 26}" width="68" height="34" fill="transparent"></rect>
                <text class="ibc-year-label" x="${yearLabelX[index]}" y="${yearLabelY}" text-anchor="middle">${year}</text>
              </g>
            `).join('')}
          </svg>`;
      }
      return `
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="${chartAspect}" role="img" aria-label="Gráfico de lucro por mês, de janeiro a dezembro de ${selectedYear}">
          <rect x="0" y="0" width="${width}" height="${height}" rx="10" fill="#fff"></rect>
          ${horizontalGrid(monthScale)}
          ${divisionBands(monthAxis)}
          <path d="${path(chartBlueY)}" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
          ${dots(chartBlueY, lucroValues, '#2563eb', 'Lucro')}
          ${pointValueLabels(pointX, chartBlueY, lucroValues, '#2563eb', 'above')}
          <text class="ibc-click-value" x="0" y="0"></text>
          ${labels.map((label, index) => `
            <g class="ibc-month-hit" role="button" tabindex="0" data-month="${index + 1}" aria-label="Abrir dias de ${label} de ${selectedYear}" onclick="expandIbcMonthChart(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();expandIbcMonthChart(event)}">
              <rect x="${labelX[index] - 32}" y="${labelY - 25}" width="64" height="34" fill="transparent"></rect>
              <text class="ibc-month" x="${labelX[index]}" y="${labelY}" text-anchor="middle">${label}</text>
            </g>
          `).join('')}
        </svg>`;
    }

    function expandIbcYearChart(event) {
      event?.preventDefault?.();
      const year = Number(event?.currentTarget?.dataset?.year || IBC_YEAR_START);
      state.ibcChartSelectedYear = year;
      state.ibcChartMonthsExpanded = true;
      state.ibcChartSelectedMonth = null;
      state.ibcChartSelectedDay = null;
      renderDashboard();
    }

    function expandIbcMonthChart(event) {
      event?.preventDefault?.();
      const month = Number(event?.currentTarget?.dataset?.month || 1);
      state.ibcChartSelectedMonth = Math.min(12, Math.max(1, month));
      state.ibcChartSelectedDay = null;
      state.ibcChartMonthsExpanded = true;
      renderDashboard();
    }

    function selectIbcDayChart(event) {
      event?.preventDefault?.();
      const day = Number(event?.currentTarget?.dataset?.day || 1);
      state.ibcChartSelectedDay = Math.min(31, Math.max(1, day));
      state.ibcChartMonthsExpanded = true;
      renderDashboard();
    }

    function backIbcChartPeriod() {
      if (state.ibcChartSelectedDay) {
        state.ibcChartSelectedDay = null;
      } else if (state.ibcChartSelectedMonth) {
        state.ibcChartSelectedMonth = null;
      } else {
        state.ibcChartMonthsExpanded = false;
      }
      renderDashboard();
    }

    function showIbcPointValue(event) {
      const point = event.currentTarget || event.target.closest('.ibc-dot-hit');
      if (!point) return;
      const svg = point.ownerSVGElement;
      const label = svg?.querySelector('.ibc-click-value');
      if (label) label.textContent = '';
      svg.querySelectorAll('.ibc-dot-hit.active').forEach(item => item.classList.remove('active'));
      point.classList.add('active');
    }

    function dashboardViewData() {
      const all = Array.isArray(state.allTransactions) && state.allTransactions.length
        ? state.allTransactions
        : Array.isArray(state.transactions) ? state.transactions : [];
      const selection = ibcDashboardSelection();
      if (!all.length && state.dashboard) {
        return {
          ...state.dashboard,
          selectedMonths: [],
          hasMonthFilter: false,
          filterLabel: 'Visão anual',
          periodText: selection.label,
          balanceText: selection.label,
          selectionLabel: selection.label,
          chartPeriodLabel: selection.label,
          transactions: all
        };
      }
      const hasPeriodFilter = Boolean(selection.start && selection.end);
      const periodItems = hasPeriodFilter
        ? all.filter(item => {
          const date = String(item.Data || '');
          return date >= selection.start && date <= selection.end;
        })
        : all;
      const balanceItems = periodItems;
      const accounts = dashboardBalances(balanceItems);
      const entradas = periodItems.filter(item => item.Fluxo === 'Entrada').reduce(sumTxValue, 0);
      const saidas = periodItems.filter(item => item.Fluxo === 'Saída').reduce(sumTxValue, 0);
      const transferencias = periodItems.filter(item => item.Fluxo === 'Transferência').reduce(sumTxValue, 0);
      return {
        metrics: {
          saldo: accounts.reduce((sum, account) => sum + Number(account.Saldo || 0), 0),
          entradas,
          saidas,
          transferencias,
          resultado: entradas - saidas,
          quantidade: periodItems.length
        },
        accounts,
        monthly: dashboardMonthlyFromTransactions(all),
        transactions: all,
        recent: periodItems.slice().sort(sortTransactionsDesc).slice(0, 6),
        selectedMonths: [],
        hasMonthFilter: hasPeriodFilter,
        filterLabel: selection.label,
        periodText: selection.label,
        balanceText: selection.label,
        selectionLabel: selection.label,
        chartPeriodLabel: selection.label
      };
    }

    function ibcDashboardSelection() {
      const year = Number(state.ibcChartSelectedYear || IBC_YEAR_START);
      const month = Number(state.ibcChartSelectedMonth || 0);
      const day = Number(state.ibcChartSelectedDay || 0);
      if (state.ibcChartMonthsExpanded && month) {
        const monthKey = `${year}-${String(month).padStart(2, '0')}`;
        const label = day
          ? `${year} - ${ibcMonthName(month)} - Dia ${String(day).padStart(2, '0')}`
          : `${year} - ${ibcMonthName(month)}`;
        if (day) {
          const date = `${monthKey}-${String(day).padStart(2, '0')}`;
          return { start: date, end: date, label };
        }
        const end = `${monthKey}-${String(daysInMonth(year, month)).padStart(2, '0')}`;
        return { start: `${monthKey}-01`, end, label };
      }
      if (state.ibcChartMonthsExpanded) {
        return { start: `${year}-01-01`, end: `${year}-12-31`, label: String(year) };
      }
      return { start: '', end: '', label: `${IBC_YEAR_START} - ${IBC_YEAR_END}` };
    }

    function ibcMonthName(month) {
      return ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][Number(month) - 1] || '';
    }

    function dashboardBalances(items) {
      const baseAccounts = (state.catalogs.accounts && state.catalogs.accounts.length)
        ? state.catalogs.accounts
        : (state.dashboard?.accounts || []).map(account => ({ ...account, SaldoInicial: account.SaldoInicial ?? account.Saldo ?? 0 }));
      const balances = baseAccounts.map(account => ({ ...account, Saldo: Number(account.SaldoInicial || 0) }));
      (items || []).forEach(item => {
        balances.forEach(account => {
          const leg = accountLeg(account.Nome, item);
          if (leg) account.Saldo += Number(leg.entrada || 0) - Number(leg.saida || 0);
        });
      });
      return balances;
    }

    function dashboardMonthlyFromTransactions(items) {
      const byMonth = {};
      (items || []).forEach(item => {
        const key = String(item.Data || '').slice(0, 7);
        if (!key) return;
        byMonth[key] ||= { Mes: key, Entrada: 0, Saida: 0, Transferencia: 0, Resultado: 0 };
        if (item.Fluxo === 'Entrada') byMonth[key].Entrada += Number(item.Valor || 0);
        if (item.Fluxo === 'Saída') byMonth[key].Saida += Number(item.Valor || 0);
        if (item.Fluxo === 'Transferência') byMonth[key].Transferencia += Number(item.Valor || 0);
        byMonth[key].Resultado = byMonth[key].Entrada - byMonth[key].Saida;
      });
      return Object.keys(byMonth).sort().map(key => byMonth[key]);
    }

    function selectDashboardMonth(monthKey) {
      if (!monthKey) {
        state.dashboardMonths = [];
        renderDashboard();
        return;
      }
      const selected = new Set(Array.isArray(state.dashboardMonths) ? state.dashboardMonths : []);
      selected.has(monthKey) ? selected.delete(monthKey) : selected.add(monthKey);
      state.dashboardMonths = Array.from(selected).sort();
      renderDashboard();
    }

    function dashboardFilterLabel(months) {
      if (!months || !months.length) return 'Visão anual';
      if (months.length === 1) return monthYear(`${months[0]}-01`);
      return `${months.length} meses selecionados`;
    }

    function sumTxValue(sum, item) {
      return sum + Number(item.Valor || 0);
    }

    function sortTransactionsDesc(a, b) {
      return String(b.Data || '').localeCompare(String(a.Data || '')) || String(b.CriadoEm || '').localeCompare(String(a.CriadoEm || ''));
    }

    function lastDayOfMonthKey(monthKey) {
      const [year, month] = String(monthKey || '').split('-').map(Number);
      if (!year || !month) return '9999-12-31';
      return new Date(Date.UTC(year, month, 0)).toISOString().slice(0, 10);
    }

    function dashboardChart(monthly, selectedMonths = []) {
      const months = dashboardMonths(12);
      const selected = new Set(Array.isArray(selectedMonths) ? selectedMonths : []);
      const byMonth = Object.fromEntries((monthly || []).map(item => [item.Mes, item]));
      const values = months.map(month => byMonth[month.key] || { Entrada: 0, Saida: 0 });
      const max = Math.max(...values.map(item => Math.max(Number(item.Entrada || 0), Number(item.Saida || 0))), 1000);
      const scale = Array.from({ length: 6 }, (_, index) => Math.round((max / 5) * (5 - index)));
      return `
        <div class="chart-legend">
          <span><i class="legend-dot"></i>Entradas</span>
          <span><i class="legend-dot out"></i>Saídas</span>
        </div>
        <div class="vchart">
          <div class="vchart-scale">${scale.map(value => `<span>${shortMoney(value)}</span>`).join('')}</div>
          <div class="vchart-plot">
            ${months.map((month, index) => {
              const entrada = Number(values[index].Entrada || 0);
              const saida = Number(values[index].Saida || 0);
              const entradaHeight = Math.max(entrada ? 4 : 0, (entrada / max) * 100);
              const saidaHeight = Math.max(saida ? 4 : 0, (saida / max) * 100);
              const labelsWouldCollide = entrada > 0 && saida > 0 && Math.abs(entradaHeight - saidaHeight) < 12;
              const entradaGap = labelsWouldCollide && entrada >= saida ? 16 : 2;
              const saidaGap = labelsWouldCollide && saida > entrada ? 16 : 2;
              const active = selected.has(month.key);
              return `
                <div class="vbar-group ${active ? 'active' : ''}" role="button" tabindex="0" title="${active ? 'Remover' : 'Selecionar'} ${month.label}" onclick="selectDashboardMonth('${month.key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectDashboardMonth('${month.key}')}">
                  ${entrada ? `<span class="vbar-value in" style="--bar-height:${entradaHeight}%;--label-gap:${entradaGap}px">${shortMoney(entrada)}</span>` : ''}
                  ${saida ? `<span class="vbar-value out" style="--bar-height:${saidaHeight}%;--label-gap:${saidaGap}px">${shortMoney(saida)}</span>` : ''}
                  <span class="vbar" title="Entradas: ${money.format(entrada)}" style="height:${entradaHeight}%"></span>
                  <span class="vbar out" title="Saídas: ${money.format(saida)}" style="height:${saidaHeight}%"></span>
                  <span class="vlabel">${month.label}</span>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    function dashboardCategoryDonut(d) {
      const total = Number(d.metrics?.saidas || 0);
      if (!total) return '<div class="donut-wrap"></div>';
      return `
        <div class="donut-wrap">
          <div>
            <div class="donut" style="--pct:100%"></div>
            <div class="chart-legend"><span><i class="legend-dot out"></i>Saídas realizadas</span></div>
          </div>
        </div>`;
    }

    function dashboardFlowComposition(d) {
      const entrada = Number(d.metrics?.entradas || 0);
      const saida = Number(d.metrics?.saidas || 0);
      const total = entrada + saida;
      if (!total) return '<div class="donut-wrap"></div>';
      const inPct = (entrada / total) * 100;
      const outPct = inPct + (saida / total) * 100;
      return `
        <div class="mix-wrap">
          <div class="mix-donut" style="--in:${inPct}%;--out:${outPct}%"></div>
          <div class="mix-legend">
            <div><i></i><span>Entradas · ${percent(entrada, total)}</span><strong>${money.format(entrada)}</strong></div>
            <div><i class="out"></i><span>Saídas · ${percent(saida, total)}</span><strong>${money.format(saida)}</strong></div>
          </div>
        </div>`;
    }

    function dashboardRecentList(items) {
      if (!items || !items.length) return empty('Nenhuma movimentação recente.');
      return `<div class="recent-list">${items.slice(0, 2).map(item => {
        const out = item.Fluxo === 'Saída';
        const transfer = item.Fluxo === 'Transferência';
        const label = transfer ? 'Transferido' : out ? 'Pago' : 'Recebido';
        const sign = transfer ? '→ ' : out ? '− ' : '+ ';
        return `
          <div class="recent-row ${out ? 'out' : ''}">
            <div>
              <h4>${escapeHtml(item.Historico || 'Movimentação')}</h4>
              <div class="muted">${escapeHtml(item.Categoria || '')}${item.Subcategoria ? ' · ' + escapeHtml(item.Subcategoria) : ''}</div>
            </div>
            <span class="badge date-badge">${formatDate(item.Data)}</span>
            <span class="badge">${label}</span>
            <span class="amount">${sign}${money.format(Number(item.Valor || 0))}</span>
          </div>`;
      }).join('')}</div>`;
    }

    function dashboardAccounts(accounts) {
      if (!accounts || !accounts.length) return empty('Nenhuma conta cadastrada.');
      return `<div class="dashboard-account-list">${accounts.slice(0, 4).map(account => `
        <div class="dashboard-account">
          <span class="account-icon">♜</span>
          <div>
            <h4>${escapeHtml(account.Nome || 'Conta')}</h4>
            <span>${escapeHtml(account.Tipo || 'Banco')}</span>
          </div>
          <strong>${money.format(Number(account.Saldo || 0))}</strong>
        </div>`).join('')}</div>`;
    }

    function dashboardMonths(total, year = IBC_YEAR_START) {
      const labels = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
      return Array.from({ length: total }, (_, index) => {
        const monthNumber = index + 1;
        const key = `${year}-${String(monthNumber).padStart(2, '0')}`;
        return { key, label: labels[index] };
      });
    }

    function daysInMonth(year, month) {
      return new Date(Date.UTC(Number(year), Number(month), 0)).getUTCDate();
    }

    function shortMoney(value) {
      const n = Number(value || 0);
      if (Math.abs(n) >= 1000000) return `R$ ${(n / 1000000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mi`;
      if (Math.abs(n) >= 1000) return `R$ ${(n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mil`;
      return `R$ ${Math.round(n).toLocaleString('pt-BR')}`;
    }

    function percent(value, total) {
      const base = Number(total || 0);
      if (!base) return '0%';
      const pct = (Number(value || 0) / base) * 100;
      return `${pct.toLocaleString('pt-BR', { maximumFractionDigits: pct < 10 && pct > 0 ? 1 : 0 })}%`;
    }

    function monthlyBars(monthly) {
      if (!monthly || !monthly.length) return empty('Ainda não existem movimentações para gerar gráfico.');
      const max = Math.max(...monthly.map(item => Math.max(item.Entrada || 0, item.Saida || 0)), 1);
      return `<div class="bars">${monthly.slice(-12).map(item => `
        <div class="bar-row">
          <strong>${escapeHtml(item.Mes)}</strong>
          <div class="bar-track">
            <div class="bar-in" style="width:${Math.max(2, (item.Entrada / max) * 100)}%"></div>
            <div class="bar-out" style="width:${Math.max(2, (item.Saida / max) * 100)}%"></div>
          </div>
          <span>${money.format(item.Resultado || 0)}</span>
        </div>`).join('')}</div>`;
    }

    function accountCard(account) {
      return `<div class="account-row"><div><strong>${escapeHtml(account.Nome)}</strong><span>${escapeHtml(account.Tipo || 'Conta')}</span></div><strong>${money.format(account.Saldo || 0)}</strong></div>`;
    }

    function renderTransactions() {
      state.txPage = 1;
      const list = Array.isArray(state.transactions) && state.transactions.length ? state.transactions : (state.allTransactions || []);
      const periodText = launchDateRangeLabel(list);
      $('#content').classList.add('launch-page');
      $('#content').innerHTML = `
        <div class="launch-screen">
          <header class="ibc-home-top" aria-label="Topo da aba lançamentos">
            <button class="ibc-panel-toggle" type="button" title="Recolher menu" aria-label="Recolher menu" onclick="toggleMenu()"></button>
            <h1 class="ibc-home-title">${escapeHtml(companyHeaderTitle())}</h1>
            <div class="ibc-home-actions">
              <button class="ibc-home-action" type="button" title="Notificações" aria-label="Notificações" onclick="toast('Nenhuma notificação nova.')">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
              </button>
              <button class="ibc-home-action primary" type="button" title="Novo lançamento" aria-label="Novo lançamento" onclick="openTransactionModal()">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
              </button>
            </div>
          </header>

          <div class="ibc-filter-row launch-filter-row" aria-label="Filtros de lançamentos">
            <button class="ibc-filter-pill" type="button" title="${escapeHtml(periodText)}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v4"></path><path d="M17 3v4"></path><path d="M4 8h16"></path><rect x="4" y="5" width="16" height="16" rx="2"></rect></svg>
              <span>${escapeHtml(periodText)}</span>
              <svg class="ibc-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <button class="ibc-filter-pill" type="button">
              <span>Mensal</span>
              <svg class="ibc-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <label class="ibc-search-field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
              <input id="txSearch" type="search" placeholder="Pesquisar..." aria-label="Pesquisar lançamentos" oninput="loadTransactions(true)">
            </label>
          </div>

          <section id="txTable" class="launch-table-card launch-ref-table" aria-label="Tabela de lançamentos">${launchReferenceTable(list)}</section>
        </div>
      `;
      fitLaunchReferencePageSize();
      loadTransactions(true);
    }

    function launchBankCards() {
      const items = Array.isArray(state.allTransactions) && state.allTransactions.length
        ? state.allTransactions
        : Array.isArray(state.transactions) ? state.transactions : [];
      let accounts = dashboardBalances(items);
      if (!accounts.length && state.dashboard?.accounts?.length) accounts = state.dashboard.accounts;
      if (!accounts.length && state.catalogs?.accounts?.length) accounts = state.catalogs.accounts;
      return accounts.slice(0, 4).map(account => {
        const name = account.Nome || account.name || 'Banco';
        const value = Number(account.Saldo ?? account.balance ?? account.SaldoInicial ?? 0);
        return `
          <article class="ibc-summary-item">
            <span class="ibc-summary-icon blue" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 10h18"></path><path d="M5 10l7-5 7 5"></path><path d="M6 10v8"></path><path d="M10 10v8"></path><path d="M14 10v8"></path><path d="M18 10v8"></path><path d="M4 18h16"></path></svg>
            </span>
            <span class="ibc-summary-label">${escapeHtml(name)}</span>
            <strong class="ibc-summary-value">${money.format(value)}</strong>
          </article>`;
      }).join('') || `
        <article class="ibc-summary-item">
          <span class="ibc-summary-icon blue" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 10h18"></path><path d="M5 10l7-5 7 5"></path><path d="M6 10v8"></path><path d="M10 10v8"></path><path d="M14 10v8"></path><path d="M18 10v8"></path><path d="M4 18h16"></path></svg>
          </span>
          <span class="ibc-summary-label">Banco</span>
          <strong class="ibc-summary-value">${money.format(0)}</strong>
        </article>`;
    }

    function launchSummaryMetrics(items) {
      const list = Array.isArray(items) ? items : [];
      const entradas = list.filter(item => item.Fluxo === 'Entrada').reduce(sumTxValue, 0);
      const saidas = list.filter(item => item.Fluxo === 'Saída').reduce(sumTxValue, 0);
      const saldo = Number(state.dashboard?.metrics?.saldo ?? (entradas - saidas));
      return {
        saldo,
        entradas,
        saidas,
        resultado: entradas - saidas
      };
    }

    function launchDateRangeLabel(items) {
      const dates = (Array.isArray(items) ? items : [])
        .map(item => String(item.Data || ''))
        .filter(Boolean)
        .sort();
      if (!dates.length) return `${IBC_YEAR_START} - ${IBC_YEAR_END}`;
      return `${launchShortDate(dates[0])} - ${launchShortDate(dates[dates.length - 1])}`;
    }

    function launchShortDate(iso) {
      const date = new Date(`${iso}T12:00:00Z`);
      const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
      return `${String(date.getUTCDate()).padStart(2, '0')} ${months[date.getUTCMonth()]} ${String(date.getUTCFullYear()).slice(-2)}`;
    }

    function launchReferenceTable(items) {
      const list = Array.isArray(items) ? items : [];
      if (!list.length) return '<div class="launch-empty-row">Nenhum lançamento encontrado.</div>';
      const computed = launchReverseBalanceRows(list);
      const page = launchPageInfo(computed.length);
      const rows = computed.slice(page.startIndex, page.endIndex);
      return `
        <div class="launch-ref-scroll">
          <table class="launch-ref-ledger">
            <thead>
              <tr>
                <th>Data</th>
                <th>Nº de lançamento</th>
                <th>Descrição</th>
                <th>Entrada</th>
                <th>Saída</th>
                <th>Saldo</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  <td>${formatDate(row.item.Data)}</td>
                  <td>${escapeHtml(numberFor(row.item))}</td>
                  <td title="${escapeHtml(row.item.Historico || '')}">${escapeHtml(row.item.Historico || '')}</td>
                  <td>${launchAmountCell(row.item, 'Entrada')}</td>
                  <td>${launchAmountCell(row.item, 'Saída')}</td>
                  <td class="launch-balance">${money.format(row.saldo)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        ${launchPagination(computed.length, page)}`;
    }

    function launchReverseBalanceRows(items) {
      const rows = (items || []).slice().sort(sortTransactionsDesc);
      let balance = rows.reduce((sum, item) => sum + ledgerDelta(item), 0);
      return rows.map(item => {
        const row = { item, saldo: balance };
        balance -= ledgerDelta(item);
        return row;
      });
    }

    function launchReferenceSource() {
      if (state.route === 'database') {
        return databaseReferenceItems();
      }
      return Array.isArray(state.transactions) && state.transactions.length ? state.transactions : (state.allTransactions || []);
    }

    function launchReferenceSearchValue() {
      if (state.route === 'database') return String(state.databaseFilters.search || '').trim();
      return ($('#txSearch') && $('#txSearch').value || '').trim();
    }

    function launchPageInfo(total) {
      const size = Math.max(10, Number(state.launchAutoPageSize || state.txPageSize || 10));
      const pages = Math.max(1, Math.ceil(total / size));
      const page = Math.min(Math.max(1, Number(state.txPage || 1)), pages);
      state.txPage = page;
      const startIndex = total ? (page - 1) * size : 0;
      const endIndex = Math.min(page * size, total);
      return {
        total,
        size,
        pages,
        page,
        startIndex,
        endIndex,
        start: total ? startIndex + 1 : 0,
        end: endIndex
      };
    }

    function fitLaunchReferencePageSize() {
      if (state.route !== 'transactions' && state.route !== 'database') return;
      window.requestAnimationFrame(() => {
        const tableCard = $('#txTable.launch-ref-table');
        const scroll = tableCard?.querySelector('.launch-ref-scroll');
        const header = tableCard?.querySelector('.launch-ref-ledger thead');
        const firstRow = tableCard?.querySelector('.launch-ref-ledger tbody tr');
        if (!tableCard || !scroll || !firstRow) return;
        const headerHeight = Math.ceil(header?.getBoundingClientRect().height || 40);
        const rowHeight = Math.max(34, Math.ceil(firstRow.getBoundingClientRect().height || 40));
        const availableRows = Math.floor((scroll.clientHeight - headerHeight - 2) / rowHeight);
        const nextSize = Math.max(10, Math.min(30, availableRows));
        if (!Number.isFinite(nextSize) || nextSize === state.launchAutoPageSize) return;
        state.launchAutoPageSize = nextSize;
        tableCard.innerHTML = launchReferenceTable(launchReferenceSource());
      });
    }

    function launchPagination(total, info) {
      if (!total || info.pages <= 1) return '';
      return `
        <nav class="launch-pagination" aria-label="Paginação dos lançamentos">
          <span class="launch-pagination-info">Mostrando ${info.start} a ${info.end} de ${total} lançamentos</span>
          <div class="launch-pagination-controls">
            <button class="page-btn" type="button" aria-label="Página anterior" ${info.page <= 1 ? 'disabled' : ''} onclick="setTxPage(${info.page - 1})">‹</button>
            ${launchPageButtons(info.page, info.pages)}
            <button class="page-btn" type="button" aria-label="Próxima página" ${info.page >= info.pages ? 'disabled' : ''} onclick="setTxPage(${info.page + 1})">›</button>
          </div>
        </nav>`;
    }

    function launchPageButtons(page, pages) {
      const nums = pages <= 3
        ? Array.from({ length: pages }, (_, index) => index + 1)
        : unique([1, page, pages].filter(item => item >= 1 && item <= pages)).sort((a, b) => a - b);
      return nums.map((num, index) => `
        ${index && num - nums[index - 1] > 1 ? '<span class="launch-pagination-gap" aria-hidden="true">...</span>' : ''}
        <button class="page-btn ${num === page ? 'active' : ''}" type="button" aria-label="Página ${num}" onclick="setTxPage(${num})">${num}</button>
      `).join('');
    }

    function launchAmountCell(item, flow) {
      const cls = launchFlowClass(flow);
      if (item.Fluxo !== flow) return `<span class="launch-value empty ${cls}">–</span>`;
      return `<span class="launch-value ${cls}">${money.format(Number(item.Valor || 0))}</span>`;
    }

    function launchFlowBadge(flow) {
      const label = String(flow || 'Entrada');
      const cls = launchFlowClass(label);
      return `<span class="launch-flow-pill ${cls}">${escapeHtml(label)}</span>`;
    }

    function launchFlowClass(flow) {
      const label = String(flow || 'Entrada');
      return label === 'Saída' ? 'saida' : label === 'Transferência' ? 'transferencia' : 'entrada';
    }

    function launchAccountChips() {
      const accounts = (state.dashboard?.accounts?.length ? state.dashboard.accounts : state.catalogs.accounts || []).slice(0, 4);
      return accounts.map(account => {
        const name = account.Nome || account.name || 'Conta';
        const value = Number(account.Saldo ?? account.balance ?? account.SaldoInicial ?? 0);
        return `<div class="launch-account-chip"><small>${escapeHtml(name)}</small><strong>${money.format(value)}</strong></div>`;
      }).join('');
    }

    function openTransactionModal(item) {
      modal(companyHeaderTitle(), transactionForm(), '', 'launch-entry-modal');
      requestAnimationFrame(() => {
        updateFlowFields();
        if (item) editTransaction(item);
      });
    }

    function transactionForm() {
      return `
        <form id="txForm" class="launch-modal-form" onsubmit="submitTransaction(event)">
          <input type="hidden" name="ID">
          <input type="hidden" name="Categoria">
          <input type="hidden" name="Subcategoria">
          <div class="launch-modal-card">
            <div class="launch-modal-row">
              <div>
                <label>Data</label>
                <input name="Data" type="date" value="${launchDefaultDate()}" min="2026-01-01" max="2036-12-31">
              </div>
              <span class="launch-modal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M7 3v4"></path><path d="M17 3v4"></path><path d="M4 8h16"></path><rect x="4" y="5" width="16" height="16" rx="2"></rect></svg>
              </span>
            </div>
            <div class="launch-modal-row">
              <div>
                <label>Fluxo</label>
                <select name="Fluxo" onchange="updateFlowFields()">
                  <option>Entrada</option>
                  <option>Saída</option>
                  <option>Transferência</option>
                </select>
              </div>
              <span class="launch-modal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
              </span>
            </div>
            <div class="launch-modal-row">
              <div>
                <label>Origem</label>
                <select name="Origem" onchange="syncLaunchClassificationFields(); updatePreview()"></select>
              </div>
              <span class="launch-modal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
              </span>
            </div>
            <div class="launch-modal-row">
              <div>
                <label>Destino</label>
                <select name="Destino" onchange="syncLaunchClassificationFields(); updatePreview()"></select>
              </div>
              <span class="launch-modal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
              </span>
            </div>
            <div class="launch-modal-row">
              <div>
                <label>Valor</label>
                <input name="Valor" type="text" inputmode="numeric" autocomplete="off" placeholder="R$ 0,00" oninput="formatLaunchCurrencyInput(this)">
              </div>
              <span class="launch-modal-hidden" id="launchCharCount">0/160 caracteres</span>
            </div>
            <div class="launch-modal-row">
              <div>
                <label>Descrição</label>
                <input name="Historico" maxlength="160" placeholder="Descreva o lançamento" oninput="updateLaunchCharCount()">
              </div>
            </div>
          </div>
          <button type="submit" class="launch-modal-submit">Adicionar lançamento</button>
        </form>
      `;
    }

    function field(label, name, type, value = '', step = '') {
      return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${value}" ${step ? `step="${step}"` : ''}></div>`;
    }

    function launchRevenuePlanOptions() {
      return [
        { value: 'Vendas|Online', label: '2 Vendas / 2.1 Online', categoria: 'Vendas', subcategoria: 'Online' },
        { value: 'Vendas|Serviços', label: '2 Vendas / 2.2 Serviços', categoria: 'Vendas', subcategoria: 'Serviços' },
        { value: 'Vendas|Mensalidades', label: '2 Vendas / 2.3 Mensalidades', categoria: 'Vendas', subcategoria: 'Mensalidades' },
        { value: 'Outras receitas|Créditos diversos', label: '4 Outras receitas / 4.1 Créditos diversos', categoria: 'Outras receitas', subcategoria: 'Créditos diversos' },
        { value: 'Outras receitas|Resgate de aplicação', label: '4 Outras receitas / 4.2 Resgate de aplicação', categoria: 'Outras receitas', subcategoria: 'Resgate de aplicação' },
        { value: 'Recebimento de empréstimos|Empréstimo', label: '5 Recebimento de empréstimos / 5.1 Empréstimo', categoria: 'Recebimento de empréstimos', subcategoria: 'Empréstimo' },
        { value: 'Patrimônio|Saldo inicial', label: '11 Patrimônio / 11.1 Saldo inicial', categoria: 'Patrimônio', subcategoria: 'Saldo inicial' }
      ];
    }

    function launchExpensePlanOptions() {
      return [
        { value: 'Compras|Mercadorias para revenda', label: '1 Compras / 1.1 Mercadorias para revenda', categoria: 'Compras', subcategoria: 'Mercadorias para revenda' },
        { value: 'Compras|Insumos e embalagens', label: '1 Compras / 1.2 Insumos e embalagens', categoria: 'Compras', subcategoria: 'Insumos e embalagens' },
        { value: 'Despesas administrativas|Aluguel do ponto', label: '2 Despesas administrativas / 2.1 Aluguel do ponto', categoria: 'Despesas administrativas', subcategoria: 'Aluguel do ponto' },
        { value: 'Despesas administrativas|Energia, água e internet', label: '2 Despesas administrativas / 2.2 Energia, água e internet', categoria: 'Despesas administrativas', subcategoria: 'Energia, água e internet' },
        { value: 'Pessoal|Folha de pagamento', label: '3 Pessoal / 3.1 Folha de pagamento', categoria: 'Pessoal', subcategoria: 'Folha de pagamento' },
        { value: 'Marketing|Divulgação local', label: '4 Marketing / 4.1 Divulgação local', categoria: 'Marketing', subcategoria: 'Divulgação local' }
      ];
    }

    function launchPlanOptionsForFlow(flow) {
      if (flow === 'Saída') return launchExpensePlanOptions();
      if (flow === 'Transferência') return [{ value: 'Transferências internas|Entre contas e agências', label: '7 Transferências internas / 7.1 Entre contas e agências', categoria: 'Transferências internas', subcategoria: 'Entre contas e agências' }];
      return launchRevenuePlanOptions();
    }

    function launchPlanOptionHtml(options) {
      return `<option value="">Selecione</option>${options.map(item => `<option value="${escapeHtml(item.value)}">${escapeHtml(item.label)}</option>`).join('')}`;
    }

    function launchAccountOptionHtml() {
      const accounts = state.catalogs.accounts || [];
      return `<option value="">Selecione</option>${accounts.map(item => `<option>${escapeHtml(item.Nome)}</option>`).join('')}`;
    }

    function launchSelectedPlan(flow) {
      const form = $('#txForm');
      if (!form) return null;
      const sourceValue = flow === 'Saída' ? form.Destino.value : form.Origem.value;
      return launchPlanOptionsForFlow(flow).find(item => item.value === sourceValue) || null;
    }

    function syncLaunchClassificationFields() {
      const form = $('#txForm');
      if (!form) return;
      const flow = form.Fluxo.value;
      if (flow === 'Transferência') {
        form.Categoria.value = 'Transferências internas';
        form.Subcategoria.value = 'Entre contas e agências';
        return;
      }
      const selected = launchSelectedPlan(flow);
      form.Categoria.value = selected?.categoria || '';
      form.Subcategoria.value = selected?.subcategoria || '';
    }

    function launchPlanValue(category, subcategory) {
      return `${category || ''}|${subcategory || ''}`;
    }

    function launchPlanLabel(category, subcategory) {
      return `${category || 'Categoria'} / ${subcategory || 'Subcategoria'}`;
    }

    function setLaunchSelectValue(select, value, label) {
      if (!select || !value) return;
      if (![...select.options].some(option => option.value === value)) {
        select.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(value)}">${escapeHtml(label || value)}</option>`);
      }
      select.value = value;
    }

    function updateFlowFields() {
      const form = $('#txForm');
      if (!form) return;
      const fluxo = form.Fluxo.value;
      if (!fluxo || fluxo === 'Entrada') {
        form.Origem.innerHTML = launchPlanOptionHtml(launchRevenuePlanOptions());
        form.Destino.innerHTML = launchAccountOptionHtml();
      } else if (fluxo === 'Saída') {
        form.Origem.innerHTML = launchAccountOptionHtml();
        form.Destino.innerHTML = launchPlanOptionHtml(launchExpensePlanOptions());
      } else {
        form.Origem.innerHTML = launchAccountOptionHtml();
        form.Destino.innerHTML = launchAccountOptionHtml();
        form.Categoria.value = 'Transferências internas';
        form.Subcategoria.value = 'Entre contas e agências';
      }
      syncLaunchClassificationFields();
      updatePreview();
    }

    function updateCategories() {
      const form = $('#txForm');
      if (!form) return;
      syncLaunchClassificationFields();
    }

    function updateSubcategories() {
      const form = $('#txForm');
      if (!form) return;
      syncLaunchClassificationFields();
      updatePreview();
    }

    function launchCurrencyNumber(value) {
      const text = String(value || '');
      const digits = text.replace(/\D/g, '');
      if (!digits) return 0;
      return Number(digits) / 100;
    }

    function launchCurrencyLabel(value) {
      return money.format(Number(value || 0)).replace(/\u00a0/g, ' ');
    }

    function formatLaunchCurrencyInput(input) {
      if (!input) return;
      input.value = launchCurrencyLabel(launchCurrencyNumber(input.value));
      requestAnimationFrame(() => {
        try {
          input.setSelectionRange(input.value.length, input.value.length);
        } catch (error) {}
      });
      updatePreview();
    }

    function updatePreview() {
      const form = $('#txForm');
      if (!form) return;
      const fluxo = form.Fluxo.value;
      const valor = launchCurrencyLabel(launchCurrencyNumber(form.Valor.value));
      let debit = 'Selecione os dados';
      let credit = 'Selecione os dados';
      if (fluxo === 'Entrada') {
        debit = `${form.Destino.value || 'Conta de destino'} · ${valor}`;
        credit = `${form.Categoria.value || 'Receita'} / ${form.Subcategoria.value || 'Subcategoria'} · ${valor}`;
      } else if (fluxo === 'Saída') {
        debit = `${form.Categoria.value || 'Despesa'} / ${form.Subcategoria.value || 'Subcategoria'} · ${valor}`;
        credit = `${form.Origem.value || 'Conta de origem'} · ${valor}`;
      } else {
        debit = `${form.Destino.value || 'Conta destino'} · ${valor}`;
        credit = `${form.Origem.value || 'Conta origem'} · ${valor}`;
      }
      const debitPreview = $('#debitPreview');
      const creditPreview = $('#creditPreview');
      if (debitPreview) debitPreview.textContent = debit;
      if (creditPreview) creditPreview.textContent = credit;
      updateLaunchCharCount();
    }

    function updateLaunchCharCount() {
      const form = $('#txForm');
      const counter = $('#launchCharCount');
      if (!form || !counter) return;
      counter.textContent = `${String(form.Historico.value || '').length}/160 caracteres`;
    }

    async function submitTransaction(event) {
      event.preventDefault();
      syncLaunchClassificationFields();
      const data = formToObject(event.currentTarget);
      if (!data.Fluxo) {
        toast('Selecione o fluxo do lançamento.', 'error');
        return;
      }
      if ((data.Fluxo === 'Entrada' || data.Fluxo === 'Saída') && (!data.Categoria || !data.Subcategoria)) {
        toast(data.Fluxo === 'Entrada' ? 'Selecione a origem do lançamento.' : 'Selecione o destino do lançamento.', 'error');
        return;
      }
      if (data.Fluxo === 'Entrada') data.Origem = `${data.Categoria} / ${data.Subcategoria}`;
      if (data.Fluxo === 'Saída') data.Destino = `${data.Categoria} / ${data.Subcategoria}`;
      data.Valor = launchCurrencyNumber(data.Valor);
      if (!isLaunchDateInIbcRange(data.Data)) {
        toast('A data do lançamento deve estar entre 01/01/2026 e 31/12/2036.', 'error');
        return;
      }
      try {
        await serverCall('salvarLancamento', data);
        toast('Lançamento salvo com sucesso.', 'success');
        clearTxForm();
        if ($('#modalRoot')?.classList.contains('open')) closeModal();
        await refreshData();
        renderTransactions();
      } catch (error) {
        toast(error.message, 'error');
      }
    }

    function clearTxForm() {
      const form = $('#txForm');
      if (!form) return;
      form.reset();
      form.Data.value = launchDefaultDate();
      updateFlowFields();
      updateLaunchCharCount();
    }

    async function loadTransactions(resetPage = false) {
      try {
        if (resetPage) state.txPage = 1;
        const search = $('#txSearch') ? $('#txSearch').value : '';
        const items = await serverCall('listarLancamentos', { search });
        state.transactions = items;
        const target = $('#txTable');
        if (target) {
          target.innerHTML = target.classList.contains('launch-ref-table')
            ? launchReferenceTable(items)
            : transactionLedgerTable(items, false);
          if (target.classList.contains('launch-ref-table')) fitLaunchReferencePageSize();
        }
      } catch (error) {
        toast(error.message, 'error');
      }
    }

    function transactionLedgerTable(items, actions) {
      const list = Array.isArray(items) ? items : [];
      const search = ($('#txSearch') && $('#txSearch').value || '').trim();
      const ordered = list.slice().sort((a, b) => String(a.Data).localeCompare(String(b.Data)) || String(a.CriadoEm || '').localeCompare(String(b.CriadoEm || '')));
      const totalDelta = ordered.reduce((sum, item) => sum + ledgerDelta(item), 0);
      const openingBalance = search ? 0 : Number(state.dashboard?.metrics?.saldo || 0) - totalDelta;
      let runningBalance = openingBalance;
      const computed = ordered.map(item => {
        const entrada = item.Fluxo === 'Entrada' ? Number(item.Valor || 0) : 0;
        const saida = item.Fluxo === 'Saída' ? Number(item.Valor || 0) : 0;
        runningBalance += ledgerDelta(item);
        return { item, entrada, saida, saldo: runningBalance };
      }).reverse();
      const page = txPageInfo(computed.length);
      const pageRows = computed.slice(page.startIndex, page.endIndex);
      const openingDate = lastDayPreviousMonth(firstTransactionDate(ordered) || today());
      const openingRow = `
        <tr class="opening-row">
          <td>${formatDate(openingDate)}</td>
          <td>–</td>
          <td><strong>SALDO ANTERIOR - ${monthYear(openingDate)}</strong></td>
          <td>–</td>
          <td>–</td>
          <td class="amount-in ${openingBalance < 0 ? 'amount-out' : ''}">${money.format(openingBalance)}</td>
          ${actions ? '<td></td>' : ''}
        </tr>`;
      const rows = pageRows.map(row => `
        <tr>
          <td>${formatDate(row.item.Data)}</td>
          <td>${escapeHtml(numberFor(row.item))}</td>
          <td>
            <strong>${escapeHtml(String(row.item.Historico || '').toUpperCase())}</strong>
            <div class="muted">${escapeHtml(row.item.Categoria || '')}${row.item.Subcategoria ? ' · ' + escapeHtml(row.item.Subcategoria) : ''}</div>
          </td>
          <td class="amount-in">${row.entrada ? money.format(row.entrada) : '–'}</td>
          <td class="amount-out">${row.saida ? money.format(row.saida) : '–'}</td>
          <td class="amount-in ${row.saldo < 0 ? 'amount-out' : ''}">${money.format(row.saldo)}</td>
          ${actions ? `<td><div class="row-actions"><button class="btn small" onclick='editTransaction(${JSON.stringify(row.item)})'>Editar</button><button class="btn small danger" onclick="deleteTransaction('${row.item.ID}')">Excluir</button></div></td>` : ''}
        </tr>`).join('');
      const showOpening = computed.length === 0 || page.page === page.pages;
      return `
        <div class="table-scroll">
          <table class="ledger-table">
            <thead><tr><th>Data</th><th>Nº lançamento</th><th>Histórico</th><th>Entrada</th><th>Saída</th><th>Saldo</th>${actions ? '<th></th>' : ''}</tr></thead>
            <tbody>${rows}${showOpening ? openingRow : ''}</tbody>
          </table>
        </div>
        ${txPagination(computed.length, page)}`;
    }

    function txPageInfo(total) {
      const size = Number(state.txPageSize || 10);
      const pages = Math.max(1, Math.ceil(total / size));
      const page = Math.min(Math.max(1, Number(state.txPage || 1)), pages);
      state.txPage = page;
      const startIndex = total ? (page - 1) * size : 0;
      const endIndex = Math.min(page * size, total);
      return {
        total,
        size,
        pages,
        page,
        startIndex,
        endIndex,
        start: total ? startIndex + 1 : 0,
        end: endIndex
      };
    }

    function txPagination(total, info) {
      return `
        <div class="ledger-footer">
          <span>Mostrando ${info.start} a ${info.end} de ${total} lançamentos</span>
          <div class="ledger-pagination">
            <button class="page-btn" ${info.page <= 1 ? 'disabled' : ''} onclick="setTxPage(${info.page - 1})">‹</button>
            ${txPageButtons(info.page, info.pages)}
            <button class="page-btn" ${info.page >= info.pages ? 'disabled' : ''} onclick="setTxPage(${info.page + 1})">›</button>
            <select class="page-size" onchange="setTxPageSize(this.value)">
              ${[10, 25, 50].map(size => `<option value="${size}" ${info.size === size ? 'selected' : ''}>${size} por página</option>`).join('')}
            </select>
          </div>
        </div>`;
    }

    function txPageButtons(page, pages) {
      const nums = pages <= 3
        ? Array.from({ length: pages }, (_, index) => index + 1)
        : unique([1, page, pages].filter(item => item >= 1 && item <= pages)).sort((a, b) => a - b);
      return nums.map((num, index) => `
        ${index && num - nums[index - 1] > 1 ? '<span class="muted">...</span>' : ''}
        <button class="page-btn ${num === page ? 'active' : ''}" onclick="setTxPage(${num})">${num}</button>
      `).join('');
    }

    function setTxPage(page) {
      state.txPage = page;
      const target = $('#txTable');
      if (target) {
        target.innerHTML = target.classList.contains('launch-ref-table')
          ? launchReferenceTable(launchReferenceSource())
          : transactionLedgerTable(launchReferenceSource(), false);
      }
    }

    function setTxPageSize(size) {
      state.txPageSize = Number(size) || 10;
      state.txPage = 1;
      setTxPage(1);
    }

    function firstTransactionDate(items) {
      return items.length ? items[0].Data : '';
    }

    function ledgerDelta(item) {
      if (item.Fluxo === 'Entrada') return Number(item.Valor || 0);
      if (item.Fluxo === 'Saída') return -Number(item.Valor || 0);
      return 0;
    }

    function transactionTable(items, actions) {
      if (!items || !items.length) return empty('Nenhum lançamento encontrado.');
      return `<div class="table-scroll"><table>
        <thead><tr><th>Data</th><th>Nº lançamento</th><th>Histórico</th><th>Partida dobrada</th><th>Status</th><th>Valor</th>${actions ? '<th></th>' : ''}</tr></thead>
        <tbody>${items.map(item => `
          <tr>
            <td>${formatDate(item.Data)}</td>
            <td>${escapeHtml(numberFor(item))}</td>
            <td><strong>${escapeHtml(item.Historico)}</strong><div class="muted">${escapeHtml(item.Categoria || '')}${item.Subcategoria ? ' · ' + escapeHtml(item.Subcategoria) : ''}</div></td>
            <td><strong>D · ${escapeHtml(debitLabel(item))}</strong><div class="muted">C · ${escapeHtml(creditLabel(item))}</div></td>
            <td><span class="badge">${escapeHtml(item.Status || 'Realizado')}</span></td>
            <td class="${item.Fluxo === 'Saída' ? 'amount-out' : 'amount-in'}">${item.Fluxo === 'Saída' ? '− ' : '+ '}${money.format(Number(item.Valor || 0))}</td>
            ${actions ? `<td><div class="row-actions"><button class="btn small" onclick='editTransaction(${JSON.stringify(item)})'>Editar</button><button class="btn small danger" onclick="deleteTransaction('${item.ID}')">Excluir</button></div></td>` : ''}
          </tr>`).join('')}</tbody>
      </table></div>`;
    }

    function debitLabel(item) {
      if (item.Fluxo === 'Entrada') return item.Destino;
      if (item.Fluxo === 'Saída') return `${item.Categoria} / ${item.Subcategoria}`;
      return item.Destino;
    }

    function creditLabel(item) {
      if (item.Fluxo === 'Entrada') return `${item.Categoria} / ${item.Subcategoria}`;
      if (item.Fluxo === 'Saída') return item.Origem;
      return item.Origem;
    }

    function editTransaction(item) {
      const form = $('#txForm');
      if (!form) {
        openTransactionModal(item);
        return;
      }
      form.ID.value = item.ID;
      form.Data.value = item.Data;
      form.Fluxo.value = item.Fluxo;
      updateFlowFields();
      const planValue = launchPlanValue(item.Categoria, item.Subcategoria);
      const planLabel = launchPlanLabel(item.Categoria, item.Subcategoria);
      if (item.Fluxo === 'Entrada') {
        setLaunchSelectValue(form.Origem, planValue, planLabel);
        form.Destino.value = item.Destino;
      } else if (item.Fluxo === 'Saída') {
        form.Origem.value = item.Origem;
        setLaunchSelectValue(form.Destino, planValue, planLabel);
      } else {
        form.Origem.value = item.Origem;
        form.Destino.value = item.Destino;
      }
      form.Categoria.value = item.Categoria;
      form.Subcategoria.value = item.Subcategoria;
      form.Valor.value = launchCurrencyLabel(Number(item.Valor || 0));
      form.Historico.value = item.Historico;
      syncLaunchClassificationFields();
      updatePreview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cashbookDateRange() {
      const dates = (Array.isArray(state.allTransactions) ? state.allTransactions : [])
        .map(item => String(item.Data || ''))
        .filter(Boolean)
        .sort();
      return {
        start: dates[0] || `${IBC_YEAR_START}-01-01`,
        end: dates[dates.length - 1] || `${IBC_YEAR_END}-12-31`
      };
    }

    function cashbookCategoryOptions() {
      const categories = unique(['Disponível', ...(state.allTransactions || []).map(item => item.Categoria || 'Sem categoria')]).sort((a, b) => {
        if (a === 'Disponível') return -1;
        if (b === 'Disponível') return 1;
        return a.localeCompare(b);
      });
      return categories.map(category => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join('');
    }

          account: $('#cashAccount') ? $('#cashAccount').value : ''

        if (exportArea) exportArea.innerHTML = cashbookHtml(data);

    function renderCashbookCards() {
