      fitLaunchReferencePageSize();
    }

    function databaseReferenceBase() {
      return Array.isArray(state.allTransactions) && state.allTransactions.length ? state.allTransactions : (state.transactions || []);
    }

    function databaseReferenceItems() {
      const category = state.databaseFilters.category || '';
      const query = String(state.databaseFilters.search || '').trim().toLowerCase();
      return databaseReferenceBase()
        .filter(item => !category || (item.Categoria || 'Sem categoria') === category)
        .filter(item => transactionSearchMatches(item, query));
    }

    function databaseCategoryOptions() {
      return unique(databaseReferenceBase().map(item => item.Categoria || 'Sem categoria'))
        .sort()
        .map(category => `<option value="${escapeHtml(category)}" ${state.databaseFilters.category === category ? 'selected' : ''}>${escapeHtml(category)}</option>`)
        .join('');
    }

    function databaseSetFilter(key, value) {
      state.databaseFilters[key] = value;
      state.txPage = 1;
      const target = $('#txTable');
      if (target) {
        target.innerHTML = launchReferenceTable(databaseReferenceItems());
        fitLaunchReferencePageSize();
      }
    }

    function databaseAnalysisCards(year) {
      const months = analyticsMonthOptions().map(month => ({
        title: `Análises de ${month.label}`,
        tag: 'Mensal',
        period: `${firstDayMonth(year, month.value)} até ${lastDayMonth(year, month.value)}`,
        month: month.value,
        quarter: ''
      }));
      const quarters = [
        { title: 'Análises 1º trimestre', tag: 'Trimestral', period: `01/01/${year} até 31/03/${year}`, quarter: '1', month: '' },
        { title: 'Análises 2º trimestre', tag: 'Trimestral', period: `01/04/${year} até 30/06/${year}`, quarter: '2', month: '' },
        { title: 'Análises 3º trimestre', tag: 'Trimestral', period: `01/07/${year} até 30/09/${year}`, quarter: '3', month: '' },
        { title: 'Análises 4º trimestre', tag: 'Trimestral', period: `01/10/${year} até 31/12/${year}`, quarter: '4', month: '' }
      ];
      const annual = [{ title: 'Análises anual', tag: 'Anual', period: `01/01/${year} até 31/12/${year}`, quarter: '', month: '' }];
      return [...months, ...quarters, ...annual].map(card => `
        <div class="card analysis-mini-card">
          <div>
            <span class="pill">${card.tag}</span>
            <h3>${card.title}</h3>
            <p class="muted">${card.period}</p>
          </div>
          <div class="analysis-actions">
            <button class="btn" onclick="openAnalysisPeriod('${card.month}', '${card.quarter}')">Ver análises →</button>
            <button class="btn" onclick="downloadAnalysisPdf('${card.month}', '${card.quarter}')">PDF</button>
            <button class="btn" onclick="printAnalysisPeriod('${card.month}', '${card.quarter}')">Imprimir</button>
          </div>
        </div>
      `).join('');
    }

    function openAnalysisPeriod(month, quarter) {
      state.analyticsFilters = { year: '2026', quarter: quarter || '', month: month || '', flow: '' };
      state.analyticsSelection = null;
      navigate('analytics');
    }

    function downloadAnalysisPdf(month, quarter) {
      toast('Para baixar em PDF, escolha “Salvar como PDF” na janela de impressão.', 'success');
      printAnalysisPeriod(month, quarter);
    }

    function printAnalysisPeriod(month, quarter) {
      const filters = analysisFiltersFromPeriod(month, quarter);
      const printArea = $('#printArea');
      printArea.innerHTML = analysisReportHtml(filters);
      document.body.classList.add('printing-report');
      setTimeout(() => {
        window.print();
        setTimeout(() => {
          document.body.classList.remove('printing-report');
          printArea.innerHTML = '';
        }, 400);
      }, 120);
    }

    function analysisFiltersFromPeriod(month, quarter) {
      return { year: '2026', quarter: quarter || '', month: month || '', flow: '' };
    }

    function analysisReportHtml(filters) {
      const previousSelection = state.analyticsSelection;
      state.analyticsSelection = null;
      const items = analyticsFilteredItems(filters);
      const summary = analyticsSummary(items);
      const byCategory = analyticsGroups(items, item => item.Categoria || 'Sem categoria');
      const bySubcategory = analyticsGroups(items, item => item.Subcategoria || 'Sem subcategoria');
      const monthlyRows = analyticsMonthlyRows(items);
      const label = analyticsPeriodLabel(filters);
      const title = analysisReportTitle(filters);
      const period = analysisReportPeriod(filters);
      const html = `
        <section class="analysis-report">
          <header class="report-head">
            <div>
              <small>Aurora Studio · Gestão Financeira Empresarial</small>
              <h1>${escapeHtml(title)}</h1>
              <p class="muted">Relatório gerencial com gráficos adaptados para ${escapeHtml(label.toLowerCase())}.</p>
            </div>
            <div class="report-meta">
              <div><strong>Período:</strong> ${escapeHtml(period)}</div>
              <div><strong>Base:</strong> Regime de caixa</div>
              <div><strong>Emitido em:</strong> ${formatDate(today())}</div>
            </div>
          </header>

          <div class="report-executive">
            <div class="report-box">
              <h3>Leitura executiva</h3>
              ${reportExecutiveNarrative(summary, byCategory, bySubcategory, monthlyRows, label)}
            </div>
            <div class="report-box">
              <h3>Pontos de atenção</h3>
              ${reportAttentionNarrative(summary, byCategory, monthlyRows)}
            </div>
          </div>

          <div class="analytics-kpis">
            <div class="card analytics-kpi"><small>Entradas realizadas</small><strong>${money.format(summary.entrada)}</strong><span class="muted">${summary.count} lançamento(s)</span></div>
            <div class="card analytics-kpi negative"><small>Saídas realizadas</small><strong>${money.format(summary.saida)}</strong><span class="muted">Pagamentos no período</span></div>
            <div class="card analytics-kpi ${summary.resultado < 0 ? 'negative' : ''}"><small>Resultado financeiro</small><strong>${money.format(summary.resultado)}</strong><span class="muted">Entrada menos saída</span></div>
            <div class="card analytics-kpi"><small>Classificações usadas</small><strong>${summary.categories}</strong><span class="muted">${summary.subcategories} subcategoria(s)</span></div>
          </div>

          <h2 class="report-section-title">Análise geral</h2>
          <div class="card panel">
            <div class="analytics-insights">
              ${analyticsGeneralInsights(summary, byCategory, bySubcategory)}
            </div>
          </div>

          <h2 class="report-section-title">Gráficos do período</h2>
          <div class="report-grid">
            ${reportChart('Evolução mensal por fluxo', 'Entradas e saídas adaptadas ao período do card.', analyticsMonthlyChart(items), reportAnalysisMonthly(items, summary, monthlyRows, label), true)}
            ${reportChart('Saldo por categoria', 'Ranking de categorias do período.', analyticsHorizontalBars(byCategory, 8, summary.volume, 'Categoria'), reportAnalysisCategory(byCategory, summary))}
            ${reportChart('Saldo por subcategoria', 'Detalhamento de subcategorias do período.', analyticsHorizontalBars(bySubcategory, 8, summary.volume, 'Subcategoria'), reportAnalysisSubcategory(bySubcategory, summary))}
            ${reportChart('Mapa rápido das categorias', 'Categorias com maior impacto visual.', analyticsTreemap(byCategory, summary.volume), reportAnalysisTreemap(byCategory, summary))}
            ${reportChart('Comparativo por trimestre', 'Compara o período dentro dos trimestres de 2026.', analyticsQuarterChart(items, summary.volume), reportAnalysisQuarter(items, summary))}
            ${reportChart('Composição do fluxo', 'Participação de entradas, saídas e transferências.', analyticsFlowMix(summary), reportAnalysisFlow(summary))}
            ${reportChart('Saldo acumulado no ano', 'Curva acumulada considerando os dados filtrados.', analyticsCumulativeLine(items, summary), reportAnalysisCumulative(items, summary), true, true)}
            ${reportChart('Mapa de calor · mês por categoria', 'Concentração por mês e categoria.', analyticsHeatmap(items, byCategory, summary.volume), reportAnalysisHeatmap(items, byCategory, summary), true)}
            ${reportChart('Ponte do resultado', 'Como entradas e saídas formam o resultado.', analyticsWaterfall(summary), reportAnalysisWaterfall(summary), true)}
          </div>
        </section>
      `;
      state.analyticsSelection = previousSelection;
      return html;
    }

    function reportChart(title, subtitle, chartHtml, analysisHtml, wide = false, pageBreak = false) {
      return `
        <div class="report-chart-card ${wide ? 'analytics-wide' : ''} ${pageBreak ? 'report-page-break' : ''}">
          <div class="card panel analytics-chart">
            <div class="panel-head">
              <div><h2>${escapeHtml(title)}</h2><p class="analytics-panel-note">${escapeHtml(subtitle)}</p></div>
            </div>
            ${chartHtml}
          </div>
          <div class="report-analysis">
            <h3>Análise detalhada</h3>
            ${analysisHtml}
          </div>
        </div>`;
    }

    function reportText(text) {
      return `<p>${escapeHtml(text)}</p>`;
    }

    function reportBullets(lines) {
      const safeLines = (lines || []).filter(Boolean);
      if (!safeLines.length) return '';
      return `<ul>${safeLines.map(line => `<li>${escapeHtml(line)}</li>`).join('')}</ul>`;
    }

    function reportSigned(value) {
      const signal = Number(value || 0) >= 0 ? '+' : '−';
      return `${signal} ${money.format(Math.abs(Number(value || 0)))}`;
    }

    function reportFlowName(summary) {
      if (!summary.volume) return 'sem movimentação';
      if (summary.entrada >= summary.saida && summary.entrada >= summary.transferencia) return 'predominância de entradas';
      if (summary.saida >= summary.entrada && summary.saida >= summary.transferencia) return 'predominância de saídas';
      return 'predominância de transferências';
    }

    function analyticsMonthlyRows(items) {
      const rows = analyticsChartMonths().map(month => ({
        key: month.key,
        label: month.label,
        entrada: 0,
        saida: 0,
        transferencia: 0,
        resultado: 0,
        volume: 0
      }));
      const map = Object.fromEntries(rows.map(row => [row.key, row]));
      items.forEach(item => {
        const row = map[String(item.Data || '').slice(0, 7)];
        if (!row) return;
        const value = Number(item.Valor || 0);
        if (item.Fluxo === 'Entrada') row.entrada += value;
        else if (item.Fluxo === 'Saída') row.saida += value;
        else row.transferencia += value;
        row.resultado = row.entrada - row.saida;
        row.volume = row.entrada + row.saida + row.transferencia;
      });
      return rows;
    }

    function analyticsQuarterRows(items) {
      const rows = [1, 2, 3, 4].map(q => ({
        key: String(q),
        label: `${q}º trimestre`,
        entrada: 0,
        saida: 0,
        transferencia: 0,
        resultado: 0,
        volume: 0
      }));
      items.forEach(item => {
        const month = Number(String(item.Data || '').slice(5, 7));
        const row = rows[Math.ceil(month / 3) - 1];
        if (!row) return;
        const value = Number(item.Valor || 0);
        if (item.Fluxo === 'Entrada') row.entrada += value;
        else if (item.Fluxo === 'Saída') row.saida += value;
        else row.transferencia += value;
        row.resultado = row.entrada - row.saida;
        row.volume = row.entrada + row.saida + row.transferencia;
      });
      return rows;
    }

    function reportTopRow(rows, field) {
      return (rows || []).reduce((best, row) => Number(row[field] || 0) > Number(best?.[field] || 0) ? row : best, null);
    }

    function reportActiveRows(rows) {
      return (rows || []).filter(row => Number(row.volume || 0) > 0);
    }

    function reportExecutiveNarrative(summary, byCategory, bySubcategory, monthlyRows, label) {
      if (!summary.count) {
        return reportText(`Não há movimentações registradas para ${label.toLowerCase()}. O relatório fica preparado para acompanhar entradas, saídas e resultado assim que os lançamentos forem incluídos.`);
      }
      const topCategory = byCategory[0];
      const topSubcategory = bySubcategory[0];
      const topMonth = reportTopRow(monthlyRows, 'volume');
      const margin = summary.entrada ? (summary.resultado / summary.entrada) * 100 : 0;
      return reportText(`Em ${label.toLowerCase()}, o fluxo apresenta ${reportFlowName(summary)}. Foram analisados ${summary.count} lançamento(s), com ${money.format(summary.entrada)} em entradas, ${money.format(summary.saida)} em saídas e resultado de ${reportSigned(summary.resultado)}. A principal categoria foi ${topCategory ? topCategory.label : 'sem categoria'}, enquanto a subcategoria de maior peso foi ${topSubcategory ? topSubcategory.label : 'sem subcategoria'}. O mês com maior volume foi ${topMonth?.label || 'sem mês dominante'}, e a margem sobre entradas ficou em ${summary.entrada ? `${margin.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%` : 'sem base para cálculo'}.`);
    }

    function reportAttentionNarrative(summary, byCategory, monthlyRows) {
      if (!summary.count) return reportText('Sem lançamentos no período, não há alertas financeiros para destacar.');
      const topOutMonth = reportTopRow(monthlyRows, 'saida');
      const topOutCategory = [...(byCategory || [])].sort((a, b) => Number(b.saida || 0) - Number(a.saida || 0))[0];
      const outPressure = summary.entrada ? (summary.saida / summary.entrada) * 100 : 0;
      return reportBullets([
        summary.resultado < 0 ? `O resultado está negativo em ${money.format(Math.abs(summary.resultado))}; vale revisar as maiores saídas antes de novos compromissos.` : `O resultado está positivo em ${money.format(summary.resultado)}, indicando sobra financeira no período filtrado.`,
        summary.entrada ? `As saídas consumiram ${outPressure.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}% das entradas realizadas.` : 'Não houve entradas; qualquer saída no período pressiona diretamente o caixa.',
        topOutMonth?.saida ? `O maior mês de saída foi ${topOutMonth.label}, com ${money.format(topOutMonth.saida)} pagos.` : 'Não houve saídas registradas no período.',
        topOutCategory ? `A categoria com maior saída foi ${topOutCategory.label}, somando ${money.format(topOutCategory.saida)}.` : 'Nenhuma categoria de despesa foi identificada.'
      ]);
    }

    function reportAnalysisMonthly(items, summary, rows, label) {
      if (!summary.count) return reportText('O gráfico mensal não possui barras relevantes porque não há lançamentos no período selecionado.');
      const active = reportActiveRows(rows);
      const topIn = reportTopRow(rows, 'entrada');
      const topOut = reportTopRow(rows, 'saida');
      const topVolume = reportTopRow(rows, 'volume');
      return reportText(`Este gráfico mostra a distribuição de entradas e saídas ao longo de janeiro a dezembro de 2026, respeitando o filtro de ${label.toLowerCase()}. Ele ajuda a identificar sazonalidade, picos de recebimento e meses com pressão de pagamentos.`) +
        reportBullets([
          `${active.length} mês(es) tiveram movimentação dentro do filtro aplicado.`,
          topIn?.entrada ? `Maior entrada em ${topIn.label}: ${money.format(topIn.entrada)}.` : 'Não houve entradas no período.',
          topOut?.saida ? `Maior saída em ${topOut.label}: ${money.format(topOut.saida)}.` : 'Não houve saídas no período.',
          topVolume?.volume ? `Mês de maior volume financeiro: ${topVolume.label}, com ${money.format(topVolume.volume)} movimentados.` : '',
          `Resultado consolidado do período: ${reportSigned(summary.resultado)}.`
        ]);
    }

    function reportAnalysisCategory(groups, summary) {
      if (!groups.length) return reportText('Sem categorias movimentadas no período.');
      const top = groups[0];
      const topThree = groups.slice(0, 3).reduce((sum, row) => sum + row.total, 0);
      const nature = top.saida > top.entrada ? 'mais ligada a pagamentos' : top.entrada > top.saida ? 'mais ligada a recebimentos' : 'equilibrada';
      return reportText('O ranking por categoria revela onde o dinheiro se concentrou. Quanto maior a barra, maior o peso daquela classificação dentro do período analisado.') +
        reportBullets([
          `Categoria principal: ${top.label}, com ${money.format(top.total)} e participação de ${percent(top.total, summary.volume)} no volume total.`,
          `Essa categoria tem característica ${nature}. Entradas: ${money.format(top.entrada)}; saídas: ${money.format(top.saida)}.`,
          `As 3 maiores categorias representam ${percent(topThree, summary.volume)} do volume analisado.`,
          `Resultado líquido da categoria principal: ${reportSigned(top.resultado)}.`
        ]);
    }

    function reportAnalysisSubcategory(groups, summary) {
      if (!groups.length) return reportText('Sem subcategorias movimentadas no período.');
      const top = groups[0];
      const out = groups.find(row => row.saida > row.entrada);
      return reportText('A leitura por subcategoria aprofunda a análise da categoria, mostrando quais detalhes explicam as entradas e saídas.') +
        reportBullets([
          `Subcategoria de maior impacto: ${top.label}, com ${money.format(top.total)} (${percent(top.total, summary.volume)} do volume).`,
          `Entradas nessa subcategoria: ${money.format(top.entrada)}; saídas: ${money.format(top.saida)}; resultado: ${reportSigned(top.resultado)}.`,
          out ? `Subcategoria com maior perfil de despesa entre as principais: ${out.label}, com ${money.format(out.saida)} em saídas.` : 'Nenhuma subcategoria de despesa se destacou no período.',
          `${groups.length} subcategoria(s) foram identificadas no filtro.`
        ]);
    }

    function reportAnalysisTreemap(groups, summary) {
      if (!groups.length) return reportText('O mapa rápido não possui dados suficientes para montar blocos de categoria.');
      const top = groups[0];
      const concentration = groups.slice(0, 5).reduce((sum, row) => sum + row.total, 0);
      return reportText('O mapa rápido funciona como uma visão de concentração: blocos maiores indicam categorias que merecem mais atenção gerencial.') +
        reportBullets([
          `O maior bloco é ${top.label}, com ${money.format(top.total)}.`,
          `As 5 maiores categorias concentram ${percent(concentration, summary.volume)} do volume financeiro.`,
          concentration / Math.max(summary.volume, 1) > .8 ? 'A movimentação está bastante concentrada em poucas categorias.' : 'A movimentação está relativamente distribuída entre categorias.',
          `Volume total usado no mapa: ${money.format(summary.volume)}.`
        ]);
    }

    function reportAnalysisQuarter(items, summary) {
      const rows = analyticsQuarterRows(items);
      if (!summary.count) return reportText('Sem lançamentos para comparar entre trimestres.');
      const top = reportTopRow(rows, 'volume');
      const best = rows.reduce((winner, row) => row.resultado > (winner?.resultado ?? -Infinity) ? row : winner, null);
      const worst = rows.reduce((loser, row) => row.resultado < (loser?.resultado ?? Infinity) ? row : loser, null);
      return reportText('O comparativo trimestral transforma a leitura mensal em blocos gerenciais, útil para planejamento e comparação de desempenho entre períodos maiores.') +
        reportBullets([
          `Trimestre com maior volume: ${top.label}, totalizando ${money.format(top.volume)} (${percent(top.volume, summary.volume)}).`,
          `Melhor resultado trimestral: ${best.label}, com ${reportSigned(best.resultado)}.`,
          `Pior resultado trimestral: ${worst.label}, com ${reportSigned(worst.resultado)}.`,
          `Resultado consolidado dos trimestres filtrados: ${reportSigned(summary.resultado)}.`
        ]);
    }

    function reportAnalysisFlow(summary) {
      if (!summary.volume) return reportText('Não há volume financeiro para calcular participação por fluxo.');
      return reportText('A composição do fluxo separa o volume entre dinheiro recebido, dinheiro pago e eventuais transferências internas.') +
        reportBullets([
          `Entradas: ${money.format(summary.entrada)} (${percent(summary.entrada, summary.volume)} do volume).`,
          `Saídas: ${money.format(summary.saida)} (${percent(summary.saida, summary.volume)} do volume).`,
          `Transferências: ${money.format(summary.transferencia)} (${percent(summary.transferencia, summary.volume)} do volume).`,
          summary.saida > summary.entrada ? 'As saídas superaram as entradas, exigindo atenção ao caixa realizado.' : 'As entradas cobriram as saídas no período analisado.'
        ]);
    }

    function reportAnalysisCumulative(items, summary) {
      if (!summary.count) return reportText('Sem lançamentos, a curva acumulada permanece zerada.');
      const rows = analyticsMonthlyRows(items);
      let acc = 0;
      const curve = rows.map(row => ({ ...row, monthlyResult: row.entrada - row.saida, accumulated: acc += row.entrada - row.saida }));
      const high = curve.reduce((best, row) => row.accumulated > (best?.accumulated ?? -Infinity) ? row : best, null);
      const low = curve.reduce((worst, row) => row.accumulated < (worst?.accumulated ?? Infinity) ? row : worst, null);
      return reportText('A curva acumulada mostra a trajetória do caixa ao longo do tempo, permitindo ver se o período melhora, piora ou fica estável conforme os meses avançam.') +
        reportBullets([
          `Saldo acumulado final do filtro: ${reportSigned(summary.resultado)}.`,
          `Ponto acumulado mais alto: ${high.label}, com ${reportSigned(high.accumulated)}.`,
          `Ponto acumulado mais baixo: ${low.label}, com ${reportSigned(low.accumulated)}.`,
          summary.resultado >= 0 ? 'A tendência final é positiva para o período filtrado.' : 'A tendência final é negativa para o período filtrado.'
        ]);
    }

    function reportAnalysisHeatmap(items, byCategory, summary) {
      if (!items.length || !byCategory.length) return reportText('Sem dados suficientes para montar mapa de calor por mês e categoria.');
      const months = analyticsChartMonths();
      const categories = byCategory.slice(0, 6).map(row => row.label);
      const map = {};
      categories.forEach(category => months.forEach(month => { map[`${category}|${month.key}`] = 0; }));
      items.forEach(item => {
        const key = `${item.Categoria || 'Sem categoria'}|${String(item.Data || '').slice(0, 7)}`;
        if (key in map) map[key] += Number(item.Valor || 0);
      });
      let top = { category: '', month: '', value: 0 };
      Object.entries(map).forEach(([key, value]) => {
        if (value > top.value) {
          const [category, monthKey] = key.split('|');
          top = { category, month: months.find(month => month.key === monthKey)?.label || monthKey, value };
        }
      });
      return reportText('O mapa de calor cruza mês e categoria para encontrar onde o volume financeiro realmente se concentrou.') +
        reportBullets([
          top.value ? `Maior concentração: ${top.category} em ${top.month}, com ${money.format(top.value)}.` : 'Nenhuma célula apresentou valor relevante.',
          `Foram consideradas as ${categories.length} categorias de maior volume.`,
          `A célula mais forte representa ${percent(top.value, summary.volume)} do volume total do período.`,
          'Use essa leitura para investigar meses ou categorias que destoam do comportamento normal.'
        ]);
    }

    function reportAnalysisWaterfall(summary) {
      if (!summary.volume) return reportText('Sem entradas ou saídas, a ponte do resultado fica zerada.');
      return reportText('A ponte do resultado explica a formação do saldo: parte das entradas realizadas, abate as saídas pagas e chega ao resultado líquido do período.') +
        reportBullets([
          `Entradas adicionaram ${money.format(summary.entrada)} ao fluxo.`,
          `Saídas reduziram o fluxo em ${money.format(summary.saida)}.`,
          `Resultado final: ${reportSigned(summary.resultado)}.`,
          summary.resultado < 0 ? 'O período terminou com consumo líquido de caixa.' : 'O período terminou com geração líquida de caixa.'
        ]);
    }

    function analyticsGeneralInsights(summary, byCategory, bySubcategory) {
      const topCategory = byCategory[0];
      const topSubcategory = bySubcategory[0];
      const margin = summary.entrada ? (summary.resultado / summary.entrada) * 100 : 0;
      const outPressure = summary.entrada ? (summary.saida / summary.entrada) * 100 : 0;
      return [
        analyticsInsight('◎', 'Categoria de maior impacto', topCategory ? `${topCategory.label} · ${money.format(topCategory.total)} · ${percent(topCategory.total, summary.volume)}` : 'Sem dados no período'),
        analyticsInsight('◇', 'Subcategoria principal', topSubcategory ? `${topSubcategory.label} · ${money.format(topSubcategory.total)} · ${percent(topSubcategory.total, summary.volume)}` : 'Sem dados no período'),
        analyticsInsight('↕', 'Resultado geral', `${summary.resultado >= 0 ? 'Saldo positivo' : 'Saldo negativo'} de ${money.format(summary.resultado)} no período`),
        analyticsInsight('▦', 'Margem sobre entradas', summary.entrada ? `${margin.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}% de resultado sobre entradas` : 'Sem entradas para calcular margem'),
        analyticsInsight('!', 'Comprometimento por saídas', summary.entrada ? `${outPressure.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}% das entradas foram consumidas por saídas` : 'Sem entradas no período')
      ].join('');
    }

    function analysisReportTitle(filters) {
      if (filters.month) {
        const month = analyticsMonthOptions().find(item => item.value === String(filters.month).padStart(2, '0'));
        return `Análises de ${month?.label || filters.month} 2026`;
      }
      if (filters.quarter) return `Análises ${filters.quarter}º trimestre 2026`;
      return 'Análises anual 2026';
    }

    function analysisReportPeriod(filters) {
      if (filters.month) return `${firstDayMonth('2026', filters.month)} até ${lastDayMonth('2026', filters.month)}`;
      if (filters.quarter) {
        const map = {
          '1': '01/01/2026 até 31/03/2026',
          '2': '01/04/2026 até 30/06/2026',
          '3': '01/07/2026 até 30/09/2026',
          '4': '01/10/2026 até 31/12/2026'
        };
        return map[String(filters.quarter)] || '01/01/2026 até 31/12/2026';
      }
      return '01/01/2026 até 31/12/2026';
    }

    function firstDayMonth(year, month) {
      return `01/${String(month).padStart(2, '0')}/${year}`;
    }

    function lastDayMonth(year, month) {
      const iso = new Date(Date.UTC(Number(year), Number(month), 0)).toISOString().slice(0, 10);
      return formatDate(iso);
    }

    function changeProfilePhoto(input) {
      const file = input && input.files && input.files[0];
      if (!file) return;
      if (!String(file.type || '').startsWith('image/')) {
        toast('Escolha um arquivo de imagem.', 'error');
        input.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = String(reader.result || '');
        if (!/^data:image\//.test(dataUrl)) {
          toast('Não foi possível carregar essa imagem.', 'error');
          return;
        }
        try {
          storageSet('pinguim-profile-photo', dataUrl);
        } catch (error) {
          toast('Essa imagem está muito grande. Escolha uma imagem menor.', 'error');
          return;
        }
        updateProfilePhotoSurfaces();
        toast('Foto atualizada.', 'success');
      };
      reader.onerror = () => toast('Não foi possível carregar essa imagem.', 'error');
      reader.readAsDataURL(file);
    }

        return;
      }
      const fields = {
        contas: ['Nome', 'Tipo', 'Banco', 'Agencia', 'Numero', 'SaldoInicial'],
        categorias: ['Tipo', 'Codigo', 'Categoria', 'Subcodigo', 'Subcategoria'],
        usuarios: ['Nome', 'Email', 'Perfil', 'Ativo'],
        clientes: ['Nome', 'Documento', 'Email', 'Telefone'],
        fornecedores: ['Nome', 'Documento', 'Email', 'Telefone']
      }[entity];
      modal(`Cadastro`, `
        <form id="entityForm" class="form-body" style="padding:0">
          <input type="hidden" name="ID" value="${escapeHtml(row.ID || '')}">
          ${fields.map(name => `<div class="field"><label>${name}</label><input name="${name}" value="${escapeHtml(row[name] ?? '')}"></div>`).join('')}
        </form>
      `, `
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="saveEntity('${entity}')">Salvar</button>
      `);
    }

    function categoryModalTypes(selected = 'Despesa') {
      return ['Despesa', 'Receita', 'Transferência']
        .map(type => `<option value="${escapeHtml(type)}" ${type === selected ? 'selected' : ''}>${escapeHtml(type)}</option>`)
        .join('');
    }

    function categoryModalExistingOptions(type, selected = '') {
      const seen = new Set();
      const rows = (state.catalogs.categories || [])
        .filter(item => (item.Tipo || '') === type)
        .filter(item => {
          const name = String(item.Categoria || '').trim();
          if (!name || seen.has(name)) return false;
          seen.add(name);
          return true;
        })
        .sort((a, b) => String(a.Categoria || '').localeCompare(String(b.Categoria || ''), 'pt-BR'));
      return `<option value="">Selecione</option>${rows.map(row => `<option value="${escapeHtml(row.Categoria)}" ${row.Categoria === selected ? 'selected' : ''}>${escapeHtml(row.Categoria)}</option>`).join('')}`;
    }

    function openCategoryEntityModal(row = {}) {
      const type = row.Tipo || 'Despesa';
      const mode = row.ID ? 'subcategory' : 'subcategory';
      modal('Nova categoria ou subcategoria', `
        <form id="categoryEntityForm" class="category-modal-form">
          <input type="hidden" name="ID" value="${escapeHtml(row.ID || '')}">
          <div class="field">
            <label>Tipo</label>
            <select name="Tipo" onchange="refreshCategoryModalOptions(); updateCategoryModalPreview()">
              ${categoryModalTypes(type)}
            </select>
          </div>
          <div class="field">
            <label>Cadastro</label>
            <select name="Cadastro" onchange="toggleCategoryModalMode(); updateCategoryModalPreview()">
              <option value="subcategory" ${mode === 'subcategory' ? 'selected' : ''}>Criar subcategoria em categoria existente</option>
              <option value="category">Criar nova categoria</option>
            </select>
          </div>
          <div class="field" id="categoryExistingField">
            <label>Categoria existente</label>
            <select name="CategoriaExistente" onchange="updateCategoryModalPreview()">
              ${categoryModalExistingOptions(type, row.Categoria || '')}
            </select>
          </div>
          <div class="field" id="categoryNewField" hidden>
            <label>Categoria</label>
            <input name="CategoriaNova" value="${escapeHtml(row.ID ? '' : row.Categoria || '')}" placeholder="Ex.: Compras, Vendas, Marketing..." oninput="updateCategoryModalPreview()">
          </div>
          <div class="field full">
            <label>Subcategoria</label>
            <input name="Subcategoria" value="${escapeHtml(row.Subcategoria || '')}" placeholder="Ex.: Online, Serviços, Folha de pagamento..." oninput="updateCategoryModalPreview()">
          </div>
          <div class="category-preview-box">
            <div class="category-preview-card" id="categoryPreviewCard"></div>
          </div>
        </form>
      `, `
        <button class="btn" type="button" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" type="button" onclick="saveCategoryEntity()">Salvar</button>
      `);
      toggleCategoryModalMode();
      updateCategoryModalPreview();
    }

    function toggleCategoryModalMode() {
      const form = $('#categoryEntityForm');
      if (!form) return;
      const isNew = form.Cadastro.value === 'category';
      $('#categoryExistingField').hidden = isNew;
      $('#categoryNewField').hidden = !isNew;
    }

    function refreshCategoryModalOptions() {
      const form = $('#categoryEntityForm');
      if (!form) return;
      const selected = form.CategoriaExistente.value;
      form.CategoriaExistente.innerHTML = categoryModalExistingOptions(form.Tipo.value, selected);
    }

    function categoryModalParent(type, category) {
      return (state.catalogs.categories || [])
        .filter(item => (item.Tipo || '') === type)
        .find(item => (item.Categoria || '') === category);
    }

    function nextCategoryCode(type) {
      const codes = (state.catalogs.categories || [])
        .filter(item => (item.Tipo || '') === type)
        .map(item => Number(String(item.Codigo || '').replace(',', '.')))
        .filter(Number.isFinite);
      return String((codes.length ? Math.max(...codes) : 0) + 1);
    }

    function nextSubcategoryCode(type, category, categoryCode) {
      const indexes = (state.catalogs.categories || [])
        .filter(item => (item.Tipo || '') === type && (item.Categoria || '') === category)
        .map(item => Number(String(item.Subcodigo || '').split('.')[1] || 0))
        .filter(Number.isFinite);
      return `${categoryCode}.${(indexes.length ? Math.max(...indexes) : 0) + 1}`;
    }

    function categoryModalPayload() {
      const form = $('#categoryEntityForm');
      if (!form) return null;
      const type = form.Tipo.value;
      const newCategory = form.Cadastro.value === 'category';
      const category = (newCategory ? form.CategoriaNova.value : form.CategoriaExistente.value).trim();
      const subcategory = form.Subcategoria.value.trim();
      const parent = newCategory ? null : categoryModalParent(type, category);
      const codigo = newCategory ? nextCategoryCode(type) : (parent?.Codigo || nextCategoryCode(type));
      const subcodigo = form.ID.value
        ? ((state.catalogs.categories || []).find(item => item.ID === form.ID.value)?.Subcodigo || nextSubcategoryCode(type, category, codigo))
        : nextSubcategoryCode(type, category, codigo);
      return {
        ID: form.ID.value,
        Tipo: type,
        Codigo: codigo,
        Categoria: category,
        Subcodigo: subcodigo,
        Subcategoria: subcategory,
        Ativo: true
      };
    }

    function updateCategoryModalPreview() {
      const payload = categoryModalPayload();
      const preview = $('#categoryPreviewCard');
      if (!payload || !preview) return;
      if (!payload.Categoria || !payload.Subcategoria) {
        const hint = $('#categoryEntityForm')?.Cadastro.value === 'category'
          ? 'Informe uma categoria nova.'
          : 'Selecione uma categoria existente.';
        preview.innerHTML = `
          <span>Prévia automática</span>
          <strong>Preencha a categoria e subcategoria</strong>
          <small>${escapeHtml(hint)}</small>
        `;
        return;
      }
      preview.innerHTML = `
        <span>Prévia automática</span>
        <strong>${escapeHtml(payload.Categoria)} / ${escapeHtml(payload.Subcategoria)}</strong>
        <small>${escapeHtml(payload.Tipo)} · ${escapeHtml(payload.Codigo)} / ${escapeHtml(payload.Subcodigo)}</small>
      `;
    }

    async function saveCategoryEntity() {
      const payload = categoryModalPayload();
      if (!payload?.Categoria) {
        toast('Informe a categoria.', 'error');
        return;
      }
      if (!payload?.Subcategoria) {
        toast('Informe a subcategoria.', 'error');
        return;
      }
      try {
        await serverCall('salvarEntidade', 'categorias', payload);
        closeModal();
        toast('Categoria salva.', 'success');
        await refreshData();
        renderSettings();
      } catch (error) {
        toast(error.message, 'error');
      }
    }

    async function saveEntity(entity) {
      try {
        await serverCall('salvarEntidade', entity, formToObject($('#entityForm')));
        closeModal();
        toast('Cadastro salvo.', 'success');
        await refreshData();
        renderSettings();
      } catch (error) {
        toast(error.message, 'error');
      }
    }

    async function deleteEntity(entity, id) {
      if (!id || !confirm('Excluir este cadastro?')) return;
      try {
        await serverCall('excluirEntidade', entity, id);
        toast('Cadastro excluído.', 'success');
        await refreshData();
        renderSettings();
      } catch (error) {
        toast(error.message, 'error');
      }
    }

    async function refreshData() {
      const data = await serverCall('appBootstrap');
      state.user = data.user;
      state.catalogs = data.catalogs;
      state.dashboard = data.dashboard;
      state.allTransactions = data.transactions || data.recent || [];
      state.transactions = data.transactions || data.recent || [];
    }

    function isVercelApiRuntime() {
      return !isAppsScriptRuntime() && /^https?:$/.test(window.location.protocol);
    }

    async function vercelApiCall(name, args) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), APP_SERVER_TIMEOUT_MS);
      try {
        const response = await fetch('/api/google-sheets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, args }),
          signal: controller.signal
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error((payload && payload.error) || `Erro HTTP ${response.status}`);
        }
        if (payload && payload.ok) return payload.data;
        throw new Error((payload && payload.error) || 'Erro desconhecido.');
      } catch (error) {
        if (error && error.name === 'AbortError') {
          throw new Error('A API do Vercel demorou para responder.');
        }
        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    function serverCall(name, ...args) {
      if (isVercelApiRuntime()) return vercelApiCall(name, args);
      if (!isAppsScriptRuntime()) return mockServer(name, ...args);
      return new Promise((resolve, reject) => {
        let settled = false;
        const done = callback => value => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          callback(value);
        };
        const timer = setTimeout(() => {
          done(reject)(new Error('O Apps Script demorou para responder. Abrindo a tela com dados locais.'));
        }, APP_SERVER_TIMEOUT_MS);
        const runner = google.script.run
          .withSuccessHandler(done(response => {
            if (response && response.ok) resolve(response.data);
            else reject(new Error((response && response.error) || 'Erro desconhecido.'));
          }))
          .withFailureHandler(done(error => reject(new Error(error.message || String(error)))));
        try {
          runner[name](...args);
        } catch (error) {
          done(reject)(error);
        }
      });
    }

    function mockLoad() {
      const raw = storageGet('pinguim-financeiro-mock');
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed.version === DEFAULT_MOCK_VERSION) return parsed;
        } catch (error) {}
      }
      const fresh = JSON.parse(JSON.stringify(DEFAULT_MOCK));
      storageSet('pinguim-financeiro-mock', JSON.stringify(fresh));
      return fresh;
    }

    function mockSave(data) {
      storageSet('pinguim-financeiro-mock', JSON.stringify(data));
    }

    async function mockServer(name, ...args) {
      const db = mockLoad();
      if (name === 'appBootstrap') return mockBootstrap();
      if (name === 'listarLancamentos') {
        const filters = args[0] || {};
        const search = String(filters.search || '').trim().toLowerCase();
        return db.transactions
          .filter(item => transactionSearchMatches(item, search))
          .sort((a, b) => String(b.Data).localeCompare(String(a.Data)));
      }
      if (name === 'salvarLancamento') {
        const payload = args[0];
        payload.ID = payload.ID || `LAN-${Date.now()}`;
        payload.Status = 'Realizado';
        payload.Valor = Number(payload.Valor || 0);
        if (payload.Fluxo === 'Entrada') payload.Origem = `${payload.Categoria} / ${payload.Subcategoria}`;
        if (payload.Fluxo === 'Saída') payload.Destino = `${payload.Categoria} / ${payload.Subcategoria}`;
        const index = db.transactions.findIndex(item => item.ID === payload.ID);
        index >= 0 ? db.transactions[index] = payload : db.transactions.push(payload);
        mockSave(db);
        return payload;
      }
      if (name === 'excluirLancamento') {
        db.transactions = db.transactions.filter(item => item.ID !== args[0]);
        mockSave(db);
        return { id: args[0] };
      }
      if (name === 'obterLivroCaixa') return mockCashbook(args[0] || {});
      if (name === 'salvarEntidade') {
        const entity = args[0], payload = args[1];
        const keyMap = { contas: 'accounts', categorias: 'categories', usuarios: 'users', clientes: 'clients', fornecedores: 'suppliers' };
        const key = keyMap[entity];
        payload.ID = payload.ID || `${entity}-${Date.now()}`;
        payload.Ativo = payload.Ativo === '' ? true : payload.Ativo;
        const index = db.catalogs[key].findIndex(item => item.ID === payload.ID);
        index >= 0 ? db.catalogs[key][index] = payload : db.catalogs[key].push(payload);
        mockSave(db);
        return payload;
      }
      if (name === 'excluirEntidade') {
        const entity = args[0], id = args[1];
        const keyMap = { contas: 'accounts', categorias: 'categories', usuarios: 'users', clientes: 'clients', fornecedores: 'suppliers' };
        const key = keyMap[entity];
        if (key) db.catalogs[key] = db.catalogs[key].filter(item => item.ID !== id);
        mockSave(db);
        return { id };
      }
      return {};
    }

    function mockBootstrap() {
      const db = mockLoad();
      const dashboard = mockBuildDashboard(db);
      return {
        app: { name: 'Pinguim Financeiro', version: 'local', spreadsheetUrl: '#' },
        user: db.catalogs.users[0],
        catalogs: db.catalogs,
        dashboard,
        transactions: db.transactions.slice().sort(sortTransactionsDesc),
        recent: dashboard.recent
      };
    }

    function mockBuildDashboard(db = mockLoad()) {
      const balances = db.catalogs.accounts.map(account => ({ ...account, Saldo: Number(account.SaldoInicial || 0) }));
      db.transactions.forEach(item => {
        const v = Number(item.Valor || 0);
        const from = balances.find(a => a.Nome === item.Origem);
        const to = balances.find(a => a.Nome === item.Destino);
        if (item.Fluxo === 'Entrada' && to) to.Saldo += v;
        if (item.Fluxo === 'Saída' && from) from.Saldo -= v;
        if (item.Fluxo === 'Transferência') { if (from) from.Saldo -= v; if (to) to.Saldo += v; }
      });
      const entradas = db.transactions.filter(i => i.Fluxo === 'Entrada').reduce((s, i) => s + Number(i.Valor || 0), 0);
      const saidas = db.transactions.filter(i => i.Fluxo === 'Saída').reduce((s, i) => s + Number(i.Valor || 0), 0);
      const transferencias = db.transactions.filter(i => i.Fluxo === 'Transferência').reduce((s, i) => s + Number(i.Valor || 0), 0);
      const byMonth = {};
      db.transactions.forEach(item => {
        const key = String(item.Data || '').slice(0, 7);
        if (!key) return;
        byMonth[key] ||= { Mes: key, Entrada: 0, Saida: 0, Transferencia: 0, Resultado: 0 };
        if (item.Fluxo === 'Entrada') byMonth[key].Entrada += Number(item.Valor || 0);
        if (item.Fluxo === 'Saída') byMonth[key].Saida += Number(item.Valor || 0);
        if (item.Fluxo === 'Transferência') byMonth[key].Transferencia += Number(item.Valor || 0);
        byMonth[key].Resultado = byMonth[key].Entrada - byMonth[key].Saida;
      });
      return {
        metrics: { saldo: balances.reduce((s, a) => s + a.Saldo, 0), entradas, saidas, transferencias, resultado: entradas - saidas, quantidade: db.transactions.length },
        accounts: balances,
        monthly: Object.keys(byMonth).sort().map(k => byMonth[k]),
        recent: db.transactions.slice().sort((a, b) => String(b.Data).localeCompare(String(a.Data))).slice(0, 6)
      };
    }

    function mockCashbook(filters) {
      const db = mockLoad();
      const start = filters.start || `${new Date().getFullYear()}-01-01`;
      const end = filters.end || today();
      const selectedAccount = String(filters.account || '').trim();
      const openingDate = previousDay(start);
      const openingLabel = `SALDO ANTERIOR - ${monthYear(openingDate)}`;
      const tx = db.transactions
        .filter(item => item.Data >= start && item.Data <= end)
        .filter(item => !selectedAccount || item.Origem === selectedAccount || item.Destino === selectedAccount)
        .sort((a, b) => String(a.Data || '').localeCompare(String(b.Data || '')) || String(a.CriadoEm || '').localeCompare(String(b.CriadoEm || '')) || String(a.ID || '').localeCompare(String(b.ID || '')));
      const availableAccounts = (db.catalogs.accounts || []).filter(account => !selectedAccount || account.Nome === selectedAccount);
      const accounts = availableAccounts.map((account, index) => {
        let saldo = Number(account.SaldoInicial || 0), entrada = 0, saida = 0;
        const rows = tx.map(item => {
          const leg = accountLeg(account.Nome, item);
          if (!leg) return null;
          saldo += leg.entrada - leg.saida;
          entrada += leg.entrada;
          saida += leg.saida;
          return { id: item.ID, data: item.Data, numero: numberFor(item), historico: item.Historico, entrada: leg.entrada, saida: leg.saida, saldo };
        }).filter(Boolean);
        return { codigo: `1.${index + 1}`, titulo: account.Nome, openingDate, openingLabel, opening: Number(account.SaldoInicial || 0), rows, totalEntrada: entrada, totalSaida: saida, saldoFinal: saldo };
      });
      const normalize = value => String(value || '').trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const categoryCatalog = (db.catalogs.categories || [])
        .filter(item => item.Ativo !== false && item.Categoria && item.Tipo !== 'Transferência');
      const categoryOrder = [];
      const categorySeen = new Set();
      categoryCatalog.forEach((item, index) => {
        const key = normalize(item.Categoria);
        if (!key || key === 'disponivel' || categorySeen.has(key)) return;
        categorySeen.add(key);
        categoryOrder.push({
          key,
          name: item.Categoria,
          rank: item.Tipo === 'Receita' ? 0 : item.Tipo === 'Despesa' ? 1 : 2,
          index
        });
      });
      categoryOrder.sort((a, b) => a.rank - b.rank || a.index - b.index || a.name.localeCompare(b.name, 'pt-BR'));

      let nextCategoryCode = 2;
      const categoryMeta = new Map();
      categoryOrder.forEach(category => {
        const code = String(nextCategoryCode++);
        const subs = new Map();
        categoryCatalog
          .filter(item => normalize(item.Categoria) === category.key)
          .forEach(item => {
            const subKey = normalize(item.Subcategoria);
            if (subKey && !subs.has(subKey)) subs.set(subKey, `${code}.${subs.size + 1}`);
          });
        categoryMeta.set(category.key, { code, name: category.name, subs });
      });
      const ensureCategoryMeta = (categoryName, subcategoryName) => {
        const categoryKey = normalize(categoryName);
        let meta = categoryMeta.get(categoryKey);
        if (!meta) {
          meta = { code: String(nextCategoryCode++), name: categoryName, subs: new Map() };
          categoryMeta.set(categoryKey, meta);
        }
        const subKey = normalize(subcategoryName);
        if (subKey && !meta.subs.has(subKey)) meta.subs.set(subKey, `${meta.code}.${meta.subs.size + 1}`);
        return { categoryCode: meta.code, subcategoryCode: meta.subs.get(subKey) || `${meta.code}.1` };
      };

      const categoryGroups = new Map();
      tx.forEach(item => {
        if (item.Fluxo !== 'Entrada' && item.Fluxo !== 'Saída') return;
        const value = Number(item.Valor || 0);
        if (!value) return;
        const plan = cashbookPlanParts(item.Fluxo === 'Entrada' ? item.Origem : item.Destino);
        const categoryName = String(item.Categoria || plan?.category || (item.Fluxo === 'Entrada' ? 'Receitas' : 'Despesas')).trim();
        if (normalize(categoryName) === 'disponivel') return;
        const subcategoryName = String(item.Subcategoria || plan?.subcategory || 'Sem subcategoria').trim();
        const meta = ensureCategoryMeta(categoryName, subcategoryName);
        const key = `${meta.categoryCode}|${categoryName}|${meta.subcategoryCode}|${subcategoryName}`;
        if (!categoryGroups.has(key)) {
          categoryGroups.set(key, {
            categoryCode: meta.categoryCode,
            categoryName,
            subcategoryCode: meta.subcategoryCode,
            subcategoryName,
            rows: []
          });
        }
        categoryGroups.get(key).rows.push({
          id: item.ID,
          data: item.Data,
          numero: numberFor(item),
          historico: item.Historico,
          entrada: item.Fluxo === 'Entrada' ? value : 0,
          saida: item.Fluxo === 'Saída' ? value : 0
        });
      });
      const categories = [...categoryGroups.values()]
        .sort((a, b) => Number(a.categoryCode) - Number(b.categoryCode) || Number(String(a.subcategoryCode).split('.')[1] || 0) - Number(String(b.subcategoryCode).split('.')[1] || 0) || a.categoryName.localeCompare(b.categoryName, 'pt-BR') || a.subcategoryName.localeCompare(b.subcategoryName, 'pt-BR'))
        .map(section => {
          let saldo = 0, entrada = 0, saida = 0;
          const rows = section.rows
            .sort((a, b) => String(a.data || '').localeCompare(String(b.data || '')) || String(a.numero || '').localeCompare(String(b.numero || ''), 'pt-BR', { numeric: true }) || String(a.id || '').localeCompare(String(b.id || '')))
            .map(row => {
              saldo += Number(row.entrada || 0) - Number(row.saida || 0);
              entrada += Number(row.entrada || 0);
              saida += Number(row.saida || 0);
              return { ...row, saldo };
            });
          return {
            codigo: section.categoryCode,
            titulo: section.categoryName,
            subcodigo: section.subcategoryCode,
            subtitulo: section.subcategoryName,
            openingDate,
            openingLabel,
            opening: 0,
            rows,
            totalEntrada: entrada,
            totalSaida: saida,
            saldoFinal: saldo
          };
        });
      return { periodo: { start, end, openingDate, openingLabel }, accounts, categories, totals: { entrada: accounts.reduce((s,a)=>s+a.totalEntrada,0), saida: accounts.reduce((s,a)=>s+a.totalSaida,0), saldo: accounts.reduce((s,a)=>s+a.saldoFinal,0) } };
    }

    function accountLeg(name, item) {
      const v = Number(item.Valor || 0);
      if (item.Fluxo === 'Entrada' && item.Destino === name) return { entrada: v, saida: 0 };
      if (item.Fluxo === 'Saída' && item.Origem === name) return { entrada: 0, saida: v };
      if (item.Fluxo === 'Transferência' && item.Origem === name) return { entrada: 0, saida: v };
      if (item.Fluxo === 'Transferência' && item.Destino === name) return { entrada: v, saida: 0 };
      return null;
    }

    function formToObject(form) {
      return Object.fromEntries(new FormData(form).entries());
    }

    function modal(title, body, foot, extraClass = '') {
      const className = ['modal', extraClass].filter(Boolean).join(' ');
      $('#modalRoot').innerHTML = `<div class="${escapeHtml(className)}"><div class="modal-head"><strong>${escapeHtml(title)}</strong><button class="btn small" onclick="closeModal()">Fechar</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot || ''}</div></div>`;
      $('#modalRoot').classList.toggle('launch-entry-backdrop', String(extraClass || '').includes('launch-entry-modal'));
      $('#modalRoot').classList.add('open');
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      $('#modalRoot').classList.remove('open');
      $('#modalRoot').classList.remove('launch-entry-backdrop');
      $('#modalRoot').innerHTML = '';
      document.body.classList.remove('modal-open');
    }

    function toast(message, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = message;
      $('#toasts').appendChild(el);
      setTimeout(() => el.remove(), 3600);
    }

    function exportTable(format) {
      const rows = state.transactions || [];
      const headers = ['Data', 'Numero', 'Historico', 'Fluxo', 'Origem', 'Destino', 'Valor'];
      const csv = [headers.join(';')].concat(rows.map(item => [
        item.Data, numberFor(item), item.Historico, item.Fluxo, item.Origem, item.Destino, String(item.Valor).replace('.', ',')
      ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'))).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `lancamentos.${format === 'excel' ? 'xls' : 'csv'}`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function exportCashbookExcel() {
      const area = $('#cashbookArea');
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${area ? area.outerHTML : ''}</body></html>`;
      const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'livro-diario-fluxo-detalhado.xls';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function numberFor(item) {
      const date = String(item.Data || '').replace(/-/g, '').slice(0, 6) || '000000';
      const suffix = String(item.ID || '').replace(/\D/g, '').slice(-4).padStart(4, '0');
      return `LD-${date}-${suffix}`;
    }

    function formatDate(value) {
      if (!value) return '-';
      return dateFmt.format(new Date(`${value}T12:00:00Z`));
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function launchDefaultDate() {
      const current = today();
      if (isLaunchDateInIbcRange(current)) return current;
      return '2026-01-01';
    }

    function isLaunchDateInIbcRange(value) {
      return String(value || '') >= '2026-01-01' && String(value || '') <= '2036-12-31';
    }

    function previousDay(iso) {
      const date = new Date(`${iso}T12:00:00`);
      date.setDate(date.getDate() - 1);
      return date.toISOString().slice(0, 10);
    }

    function lastDayPreviousMonth(iso) {
      const date = new Date(`${iso || today()}T12:00:00`);
      date.setDate(1);
      date.setDate(0);
      return date.toISOString().slice(0, 10);
    }

    function monthYear(iso) {
      const months = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
      const d = new Date(`${iso}T12:00:00`);
      return `${months[d.getMonth()]}/${d.getFullYear()}`;
    }

    function initials(value) {
      return String(value || 'P').trim().slice(0, 1).toUpperCase();
    }

    function unique(items) {
      return [...new Set(items.filter(Boolean))];
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function empty(text) {
      return `<div style="padding:30px;text-align:center;color:var(--muted)">${text}</div>`;
    }
</script>

</body>
</html>
