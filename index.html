    async function downloadAnalyticsChartPng(button) {
      const card = button?.closest?.('.analytics-ref-card, .analytics-pie-card');
      const svg = card?.querySelector('svg');
      if (!svg) {
        toast('Não há gráfico para baixar em PNG.', 'error');
        return;
      }
      const title = card.querySelector('h2')?.textContent || 'grafico';
      const subtitle = card.querySelector('p')?.textContent || '';
      const filename = `${analyticsPngFilename(`${title} ${subtitle}`)}.png`;
      try {
        await exportAnalyticsCardAsPng(card, svg, filename);
      } catch (error) {
        toast('Não foi possível gerar o PNG.', 'error');
      }
    }

    function analyticsPngFilename(value) {
      return String(value || 'grafico')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 80) || 'grafico';
    }

    function analyticsPngFont(weight, size) {
      return `${weight} ${size}px Rubik, Arial, sans-serif`;
    }

    function drawCanvasText(ctx, text, x, y, maxWidth) {
      const value = String(text || '').trim();
      if (!value) return;
      if (!maxWidth || ctx.measureText(value).width <= maxWidth) {
        ctx.fillText(value, x, y);
        return;
      }
      let clipped = value;
      while (clipped.length > 1 && ctx.measureText(`${clipped}...`).width > maxWidth) {
        clipped = clipped.slice(0, -1);
      }
      ctx.fillText(`${clipped}...`, x, y);
    }

    function drawCanvasTextRight(ctx, text, rightX, y) {
      const value = String(text || '').trim();
      if (!value) return;
      ctx.fillText(value, rightX - ctx.measureText(value).width, y);
    }

    function drawAnalyticsPngCardBackground(ctx, width, height) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = '#dedede';
      ctx.lineWidth = 1;
      const radius = 8;
      if (typeof ctx.roundRect === 'function') {
        ctx.beginPath();
        ctx.roundRect(.5, .5, width - 1, height - 1, radius);
        ctx.stroke();
      } else {
        ctx.strokeRect(.5, .5, width - 1, height - 1);
      }
    }

    function drawAnalyticsPngLegend(ctx, rightX, y) {
      const entries = [
        { label: 'Entradas', color: '#2dca72' },
        { label: 'Saídas', color: '#ec1b24' }
      ];
      ctx.font = analyticsPngFont(850, 13);
      const totalWidth = entries.reduce((sum, entry) => sum + 10 + 6 + ctx.measureText(entry.label).width, 0) + 16;
      let x = rightX - totalWidth;
      entries.forEach(entry => {
        ctx.fillStyle = entry.color;
        ctx.beginPath();
        ctx.arc(x + 5, y - 4, 5, 0, Math.PI * 2);
        ctx.fill();
        x += 16;
        ctx.fillStyle = '#777';
        ctx.fillText(entry.label, x, y);
        x += ctx.measureText(entry.label).width + 16;
      });
    }

    async function svgElementToImage(svg, width, height) {
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('width', width);
      clone.setAttribute('height', height);
      if (!clone.getAttribute('viewBox')) clone.setAttribute('viewBox', `0 0 ${width} ${height}`);
      inlineSvgStyles(svg, clone);

      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('x', '0');
      bg.setAttribute('y', '0');
      bg.setAttribute('width', '100%');
      bg.setAttribute('height', '100%');
      bg.setAttribute('fill', '#fff');
      clone.insertBefore(bg, clone.firstChild);

      const data = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Não foi possível preparar o gráfico.'));
        };
        image.src = url;
      });
    }

    function canvasToPngBlob(canvas) {
      return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    }

    async function exportAnalyticsCardAsPng(card, svg, filename) {
      const cardRect = card.getBoundingClientRect();
      const chartRect = svg.getBoundingClientRect();
      const cardStyle = window.getComputedStyle(card);
      const padX = Math.max(18, Math.round(parseFloat(cardStyle.paddingLeft) || 20));
      const isPie = card.classList.contains('analytics-pie-card');
      const outputWidth = Math.max(420, Math.round(cardRect.width || chartRect.width + padX * 2));
      const chartWidth = Math.max(320, outputWidth - padX * 2);
      const chartHeight = Math.max(isPie ? 340 : 300, Math.round(chartRect.height || chartWidth * (isPie ? .68 : .42)));
      const chartY = isPie ? 88 : 118;
      const footerHeight = isPie ? 62 : 34;
      const outputHeight = Math.max(320, chartY + chartHeight + footerHeight);
      const image = await svgElementToImage(svg, chartWidth, chartHeight);
      const scale = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(outputWidth * scale);
      canvas.height = Math.round(outputHeight * scale);
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      drawAnalyticsPngCardBackground(ctx, outputWidth, outputHeight);

      const title = card.querySelector('h2')?.textContent || 'Gráfico';
      const subtitle = card.querySelector('p')?.textContent || '';
      ctx.fillStyle = '#050505';
      ctx.font = analyticsPngFont(900, 21);
      drawCanvasText(ctx, title, padX, 39, isPie ? outputWidth - padX * 2 : outputWidth * .55);
      ctx.fillStyle = '#9a9a9a';
      ctx.font = analyticsPngFont(700, 15);
      drawCanvasText(ctx, subtitle, padX, 68, isPie ? outputWidth - padX * 2 : outputWidth * .58);

      if (isPie) {
        const total = card.querySelector('.analytics-pie-total')?.dataset.totalText || card.querySelector('.analytics-pie-total')?.textContent || '';
        ctx.drawImage(image, padX, chartY, chartWidth, chartHeight);
        ctx.fillStyle = '#050505';
        ctx.font = analyticsPngFont(950, 15);
        drawCanvasTextRight(ctx, total, outputWidth - padX, outputHeight - 28);
      } else {
        const result = card.querySelector('.analytics-ref-total')?.textContent || '';
        drawAnalyticsPngLegend(ctx, outputWidth - padX, 42);
        ctx.fillStyle = '#2563eb';
        ctx.font = analyticsPngFont(950, 16);
        drawCanvasTextRight(ctx, result, outputWidth - padX, 72);
        ctx.drawImage(image, padX, chartY, chartWidth, chartHeight);
      }

      const png = await canvasToPngBlob(canvas);
      if (!png) throw new Error('PNG vazio.');
      fujiDownloadBlob(png, filename);
      toast('Gráfico baixado em PNG.', 'success');
    }

    function inlineSvgStyles(sourceSvg, targetSvg) {
      const sourceNodes = [sourceSvg, ...sourceSvg.querySelectorAll('*')];
      const targetNodes = [targetSvg, ...targetSvg.querySelectorAll('*')];
      const styleProps = [
        'fill', 'stroke', 'stroke-width', 'stroke-linecap', 'stroke-linejoin', 'stroke-dasharray',
        'opacity', 'font-family', 'font-size', 'font-weight', 'paint-order', 'text-anchor',
        'dominant-baseline', 'transform', 'filter'
      ];
      sourceNodes.forEach((sourceNode, index) => {
        const targetNode = targetNodes[index];
        if (!targetNode || targetNode.tagName === 'title') return;
        const computed = window.getComputedStyle(sourceNode);
        const inline = styleProps
          .map(prop => {
            const value = computed.getPropertyValue(prop);
            return value ? `${prop}:${value}` : '';
          })
          .filter(Boolean)
          .join(';');
        if (inline) targetNode.setAttribute('style', inline);
      });
    }

    function exportSvgElementAsPng(svg, filename) {
      const clone = svg.cloneNode(true);
      const rect = svg.getBoundingClientRect();
      const viewBox = svg.viewBox?.baseVal;
      const width = Math.max(320, Math.round(rect.width || svg.clientWidth || viewBox?.width || Number(svg.dataset.chartWidth) || 900));
      const height = Math.max(240, Math.round(rect.height || svg.clientHeight || viewBox?.height || Number(svg.dataset.chartHeight) || 520));
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('width', width);
      clone.setAttribute('height', height);
      if (!clone.getAttribute('viewBox')) clone.setAttribute('viewBox', `0 0 ${width} ${height}`);
      inlineSvgStyles(svg, clone);

      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('x', '0');
      bg.setAttribute('y', '0');
      bg.setAttribute('width', '100%');
      bg.setAttribute('height', '100%');
      bg.setAttribute('fill', '#fff');
      clone.insertBefore(bg, clone.firstChild);

      const data = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const image = new Image();
      image.onload = () => {
        const scale = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(png => {
          if (!png) {
            toast('Não foi possível gerar o PNG.', 'error');
            return;
          }
          fujiDownloadBlob(png, filename);
          toast('Gráfico baixado em PNG.', 'success');
        }, 'image/png');
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        toast('Não foi possível gerar o PNG.', 'error');
      };
      image.src = url;
    }

    function analyticsReferenceViewMeta() {
      const year = Number(state.analyticsChartSelectedYear || 0);
      const month = Number(state.analyticsChartSelectedMonth || 0);
      if (year && month) {
        const monthName = analyticsMonthOptions()[month - 1]?.label || 'Mês';
        return { title: 'Entradas e saídas por dia', subtitle: `${monthName} de ${year}` };
      }
      if (year) return { title: 'Entradas e saídas por mês', subtitle: `${year}` };
      return { title: 'Entradas e saídas por ano', subtitle: `${IBC_YEAR_START} - ${IBC_YEAR_END}` };
    }

    function analyticsReferenceLineChart(items, size = {}) {
      const view = analyticsReferenceChartRows(items);
      const mobileChart = window.matchMedia && window.matchMedia('(max-width: 700px)').matches;
      const width = Math.max(320, Math.round(Number(size.width) || (mobileChart ? 360 : 930)));
      const height = Math.max(300, Math.round(Number(size.height) || (mobileChart ? 520 : 360)));
      const padX = mobileChart ? 18 : 12;
      const plotTop = mobileChart ? 46 : 52;
      const labelY = height - (mobileChart ? 38 : 30);
      const plotBottom = labelY - (mobileChart ? 56 : 44);
      const dotRadius = mobileChart ? 8 : 6;
      const chartValues = view.rows.flatMap(row => [row.entrada, row.saida]).map(value => Number(value || 0));
      const allValues = chartValues.length ? chartValues : [0];
      const rawMin = Math.min(...allValues);
      const rawMax = Math.max(1, ...allValues);
      const rawRange = Math.max(1, rawMax - rawMin);
      const domainPadding = rawRange * 0.12;
      const scaleMin = rawMin > 0 ? Math.max(0, rawMin - domainPadding) : 0;
      const scaleMax = rawMax + domainPadding;
      const scaleY = value => {
        const normalized = (Number(value || 0) - scaleMin) / Math.max(1, scaleMax - scaleMin);
        return plotBottom - normalized * (plotBottom - plotTop);
      };
      const pointX = index => padX + (index * (width - padX * 2)) / Math.max(view.rows.length - 1, 1);
      const entradaPoints = view.rows.map((row, index) => ({ x: pointX(index), y: scaleY(row.entrada), value: row.entrada, row }));
      const saidaPoints = view.rows.map((row, index) => ({ x: pointX(index), y: scaleY(row.saida), value: row.saida, row }));
      const grid = Array.from({ length: 5 }, (_, index) => {
        const y = plotTop + ((plotBottom - plotTop) / 4) * index;
        return `<line class="analytics-ref-grid" x1="${padX}" y1="${y}" x2="${width - padX}" y2="${y}"></line>`;
      }).join('');
      const labelGroups = view.rows.map((row, index) => {
        const x = pointX(index);
        const lastIndex = view.rows.length - 1;
        const labelAnchor = index === 0 ? 'start' : index === lastIndex ? 'end' : 'middle';
        const labelX = index === 0 ? x + 10 : index === lastIndex ? x - 10 : x;
        const hitX = Math.max(0, Math.min(width - 76, labelX - 38));
        if (!view.clickable) return `<text class="analytics-ref-label" x="${labelX}" y="${labelY}" text-anchor="${labelAnchor}">${escapeHtml(row.label)}</text>`;
        const click = view.level === 'years' ? 'openAnalyticsReferenceYear(event)' : 'openAnalyticsReferenceMonth(event)';
        const keyAttr = view.level === 'years' ? `data-year="${row.key}"` : `data-month="${row.key}"`;
        const aria = view.level === 'years'
          ? `Abrir meses de ${row.label}`
          : `Abrir dias de ${row.label} de ${state.analyticsChartSelectedYear}`;
        return `
          <g class="analytics-ref-axis-hit" role="button" tabindex="0" ${keyAttr} aria-label="${escapeHtml(aria)}" onclick="${click}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${click}}">
            <rect x="${hitX}" y="${labelY - 24}" width="76" height="34" fill="transparent"></rect>
            <text class="analytics-ref-label" x="${labelX}" y="${labelY}" text-anchor="${labelAnchor}">${escapeHtml(row.label)}</text>
          </g>`;
      });
      const dots = (points, kind, label) => points.map(point => `
        <circle class="analytics-ref-dot ${kind}" cx="${point.x}" cy="${point.y}" r="${dotRadius}">
          <title>${escapeHtml(point.row.label)} · ${label}: ${money.format(point.value)}</title>
        </circle>
      `).join('');
      const valueLabels = (points, kind, placement) => points.map(point => {
        if (!Number(point.value || 0)) return '';
        const y = placement === 'above'
          ? Math.max(18, point.y - 12)
          : Math.min(labelY - 22, point.y + 23);
        const anchor = point.x < padX + 30 ? 'start' : point.x > width - padX - 30 ? 'end' : 'middle';
        const x = anchor === 'start' ? point.x + 4 : anchor === 'end' ? point.x - 4 : point.x;
        return `<text class="analytics-ref-value ${kind}" x="${x}" y="${y}" text-anchor="${anchor}">${escapeHtml(analyticsReferenceValueText(point.value))}</text>`;
      }).join('');
      return `
        <svg viewBox="0 0 ${width} ${height}" data-chart-width="${width}" data-chart-height="${height}" role="img" aria-label="${escapeHtml(view.aria)}">
          <rect x="0" y="0" width="${width}" height="${height}" fill="#fff"></rect>
          ${grid}
          <line class="analytics-ref-axis" x1="${padX}" y1="${plotBottom}" x2="${width - padX}" y2="${plotBottom}"></line>
          <path class="analytics-ref-line entrada" d="${analyticsReferenceSmoothPath(entradaPoints)}"></path>
          <path class="analytics-ref-line saida" d="${analyticsReferenceSmoothPath(saidaPoints)}"></path>
          ${dots(entradaPoints, 'entrada', 'Entradas')}
          ${dots(saidaPoints, 'saida', 'Saídas')}
          ${valueLabels(entradaPoints, 'entrada', 'above')}
          ${valueLabels(saidaPoints, 'saida', 'below')}
          ${labelGroups.join('')}
        </svg>`;
    }

    function analyticsReferenceValueText(value) {
      const number = Number(value || 0);
      const sign = number < 0 ? '-' : '';
      const abs = Math.abs(number);
      if (abs >= 1000000) return `${sign}${(abs / 1000000).toLocaleString('pt-BR', { maximumFractionDigits: 2 })} mi`;
      if (abs >= 1000) return `${sign}${(abs / 1000).toLocaleString('pt-BR', { maximumFractionDigits: abs >= 100000 ? 1 : 2 })} mil`;
      return `${sign}${Math.round(abs).toLocaleString('pt-BR')}`;
    }

    function analyticsReferencePieSection(items, chartType = 'category-pie') {
      const meta = analyticsReferenceViewMeta();
      const visibleItems = analyticsReferenceVisibleItems(items);
      const groupKey = chartType === 'subcategory-pie' ? 'Subcategoria' : 'Categoria';
      const label = groupKey === 'Subcategoria' ? 'subcategoria' : 'categoria';
      const entradaRows = analyticsReferenceGroupedPieRows(visibleItems, 'Entrada', groupKey);
      const saidaRows = analyticsReferenceGroupedPieRows(visibleItems, 'Saída', groupKey);
      return `
        <section class="analytics-pie-grid" aria-label="Entradas e saídas por ${escapeHtml(label)}">
          ${analyticsReferencePieCard(`Entradas por ${label}`, meta.subtitle, entradaRows, 'entrada')}
          ${analyticsReferencePieCard(`Saídas por ${label}`, meta.subtitle, saidaRows, 'saida')}
        </section>`;
    }

    function analyticsReferenceGroupedPieRows(items, flow, groupKey) {
      const groups = {};
      (items || [])
        .filter(item => item.Fluxo === flow)
        .forEach(item => {
          const label = item[groupKey] || (groupKey === 'Subcategoria' ? 'Sem subcategoria' : 'Sem categoria');
          groups[label] ||= { label, entrada: 0, saida: 0, count: 0 };
          groups[label].count += 1;
          if (flow === 'Entrada') groups[label].entrada += Number(item.Valor || 0);
          if (flow === 'Saída') groups[label].saida += Number(item.Valor || 0);
        });
      return Object.values(groups)
        .filter(row => Number(row.count || 0) > 0)
        .sort((a, b) => Number(b.entrada || b.saida || 0) - Number(a.entrada || a.saida || 0));
    }

    function analyticsReferencePieCard(title, subtitle, rows, field) {
      const total = rows.reduce((sum, row) => sum + Number(row[field] || 0), 0);
      return `
        <article class="analytics-pie-card">
          <div>
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(subtitle)}</p>
          </div>
          <div class="analytics-pie-chart">${analyticsReferencePieChart(rows, field, title)}</div>
          <div class="analytics-pie-footer">
            ${analyticsReferenceChartActions()}
            <strong class="analytics-pie-total" data-total-text="${escapeHtml(`Total ${money.format(total)}`)}">Total ${money.format(total)}</strong>
          </div>
        </article>`;
    }

    function analyticsReferencePieChart(rows, field, title) {
      const colors = field === 'entrada'
        ? ['#8fb9ed', '#3d88df', '#2464b4', '#1f5faa', '#2f80dc', '#58a5f6', '#9ad1ff', '#2dca72']
        : ['#ffd0d4', '#ff8e99', '#ec1b24', '#c91822', '#f17f8b', '#963fb0', '#3d88df', '#2aa066'];
      const values = rows
        .map(row => ({ label: row.label, value: Number(row[field] || 0), count: Number(row.count || 0) }))
        .filter(row => row.count > 0 && row.value > 0)
        .sort((a, b) => b.value - a.value);
      if (!values.length) return '<div class="analytics-pie-empty">Sem valores para montar o setor.</div>';
      const data = values.length > 8
        ? [...values.slice(0, 7), { label: 'Outros', value: values.slice(7).reduce((sum, row) => sum + row.value, 0), count: values.slice(7).reduce((sum, row) => sum + row.count, 0) }]
        : values;
      const total = data.reduce((sum, row) => sum + row.value, 0);
      const width = 620;
      const height = 420;
      const cx = width / 2;
      const cy = 205;
      const radius = 168;
      const labelDistance = 232;
      let angle = -90;
      const polar = (degrees, distance) => {
        const radians = (degrees - 90) * Math.PI / 180;
        return { x: cx + distance * Math.cos(radians), y: cy + distance * Math.sin(radians) };
      };
      const slice = (start, end, color, row, dx, dy, pct, segment) => {
        const titleText = `${row.label}: ${pct} · ${money.format(row.value)}`;
        const attrs = `class="analytics-pie-slice" data-segment="${segment}" data-label="${escapeHtml(row.label)}" data-value="${row.value}" tabindex="0" role="button" aria-label="${escapeHtml(titleText)}" style="--slice-x:${dx}px;--slice-y:${dy}px" onmouseenter="setAnalyticsPieSliceHover(event, true)" onmouseleave="setAnalyticsPieSliceHover(event, false)" onfocus="setAnalyticsPieSliceHover(event, true)" onblur="setAnalyticsPieSliceHover(event, false)" onclick="toggleAnalyticsPieSlice(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleAnalyticsPieSlice(event)}"`;
        if (end - start >= 359.99) return `<circle ${attrs} cx="${cx}" cy="${cy}" r="${radius}" fill="${color}"><title>${escapeHtml(titleText)}</title></circle>`;
        const startPoint = polar(start, radius);
        const endPoint = polar(end, radius);
        const large = end - start > 180 ? 1 : 0;
        return `<path ${attrs} d="M${cx} ${cy} L${startPoint.x} ${startPoint.y} A${radius} ${radius} 0 ${large} 1 ${endPoint.x} ${endPoint.y} Z" fill="${color}"><title>${escapeHtml(titleText)}</title></path>`;
      };
      const pieces = data.map((row, index) => {
        const start = angle;
        const end = angle + (row.value / total) * 360;
        angle = end;
        const mid = start + ((end - start) / 2);
        const radians = (mid - 90) * Math.PI / 180;
        const dx = Math.round(Math.cos(radians) * 13);
        const dy = Math.round(Math.sin(radians) * 13);
        const labelPoint = polar(mid, labelDistance);
        const rawAnchor = labelPoint.x < cx - 10 ? 'end' : labelPoint.x > cx + 10 ? 'start' : 'middle';
        const lines = analyticsReferencePieLabelLines(row.label);
        const labelWidth = Math.max(...lines.map(line => line.length), 4) * 6.8;
        const anchor = labelWidth > 84 ? 'middle' : rawAnchor;
        let labelX = labelPoint.x;
        if (anchor === 'end') labelX = Math.max(labelWidth + 18, labelX);
        else if (anchor === 'start') labelX = Math.min(width - labelWidth - 18, labelX);
        else labelX = Math.max((labelWidth / 2) + 18, Math.min(width - (labelWidth / 2) - 18, labelX));
        const labelY = Math.max(24, Math.min(height - 34 - (lines.length * 13), labelPoint.y));
        const pctValue = (row.value / total) * 100;
        const pct = `${pctValue.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
        const segment = `segment-${index}`;
        return {
          sector: slice(start, end, colors[index % colors.length], row, dx, dy, pct, segment),
          label: pctValue < 0.1 ? '' : `
            <text class="analytics-pie-label" data-segment="${segment}" x="${labelX}" y="${labelY}" text-anchor="${anchor}">
              ${lines.map((line, lineIndex) => `<tspan x="${labelX}" dy="${lineIndex ? 13 : 0}">${escapeHtml(line)}</tspan>`).join('')}
              <tspan x="${labelX}" dy="15">${pct}</tspan>
            </text>`
        };
      });
      return `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(title)}">
          ${pieces.map(piece => piece.sector).join('')}
          ${pieces.map(piece => piece.label).join('')}
        </svg>`;
    }

    function analyticsReferencePieLabelLines(label) {
      const words = String(label || 'Sem categoria').split(/\s+/).filter(Boolean);
      if (words.length <= 1) return [words[0] || 'Sem categoria'];
      const first = [];
      const second = [];
      words.forEach(word => {
        const target = first.join(' ').length <= 11 ? first : second;
        target.push(word);
      });
      const lines = [first.join(' '), second.join(' ')].filter(Boolean);
      return lines.length > 2 ? [lines[0], lines.slice(1).join(' ')] : lines;
    }

    function toggleAnalyticsPieSlice(event) {
      event?.stopPropagation?.();
      const slice = event.currentTarget || event.target.closest('.analytics-pie-slice');
      if (!slice) return;
      const svg = slice.ownerSVGElement;
      const wasActive = slice.classList.contains('active');
      svg?.querySelectorAll('.analytics-pie-slice.active').forEach(item => item.classList.remove('active'));
      svg?.querySelectorAll('.analytics-pie-label.active').forEach(item => item.classList.remove('active'));
      const total = slice.closest('.analytics-pie-card')?.querySelector('.analytics-pie-total');
      if (!wasActive) {
        slice.classList.add('active');
        analyticsPieLabelForSlice(slice)?.classList.add('active');
        analyticsSetPieTotalFromSlice(slice);
      } else if (total) {
        analyticsRestorePieTotal(slice);
      }
    }

    function setAnalyticsPieSliceHover(event, active) {
      const slice = event.currentTarget || event.target.closest('.analytics-pie-slice');
      if (!slice) return;
      const label = analyticsPieLabelForSlice(slice);
      if (label) label.classList.toggle('hover', Boolean(active));
      if (active) analyticsSetPieTotalFromSlice(slice);
      else analyticsRestorePieTotal(slice);
    }

    function analyticsSetPieTotalFromSlice(slice) {
      const total = slice?.closest('.analytics-pie-card')?.querySelector('.analytics-pie-total');
      if (!total) return;
      total.textContent = money.format(Number(slice.dataset.value || 0));
      total.classList.add('selected');
    }

    function analyticsRestorePieTotal(slice) {
      const card = slice?.closest('.analytics-pie-card');
      const total = card?.querySelector('.analytics-pie-total');
      if (!total) return;
      const activeSlice = card.querySelector('.analytics-pie-slice.active');
      if (activeSlice) {
        analyticsSetPieTotalFromSlice(activeSlice);
        return;
      }
      total.textContent = total.dataset.totalText || total.textContent;
      total.classList.remove('selected');
    }

    function analyticsPieLabelForSlice(slice) {
      const segment = slice?.dataset?.segment;
      if (!segment || !slice.ownerSVGElement) return null;
      return slice.ownerSVGElement.querySelector(`.analytics-pie-label[data-segment="${segment}"]`);
    }

    function analyticsReferenceChartRows(items) {
      const year = Number(state.analyticsChartSelectedYear || 0);
      const month = Number(state.analyticsChartSelectedMonth || 0);
      if (year && month) {
        const totalDays = daysInMonth(year, month);
        const rows = Array.from({ length: totalDays }, (_, index) => ({
          key: String(index + 1).padStart(2, '0'),
          label: String(index + 1).padStart(2, '0'),
          entrada: 0,
          saida: 0
        }));
        const byDay = Object.fromEntries(rows.map(row => [row.key, row]));
        (items || []).forEach(item => {
          const date = String(item.Data || '');
          if (!date.startsWith(`${year}-${String(month).padStart(2, '0')}-`)) return;
          const row = byDay[date.slice(8, 10)];
          if (!row) return;
          if (item.Fluxo === 'Entrada') row.entrada += Number(item.Valor || 0);
          if (item.Fluxo === 'Saída') row.saida += Number(item.Valor || 0);
        });
        return { level: 'days', rows, clickable: false, aria: `Entradas e saídas por dia em ${String(month).padStart(2, '0')}/${year}` };
      }
      if (year) {
        const months = analyticsMonthOptions().map((monthItem, index) => ({
          key: String(index + 1).padStart(2, '0'),
          label: monthItem.label.slice(0, 3),
          entrada: 0,
          saida: 0
        }));
        const byMonth = Object.fromEntries(months.map(row => [row.key, row]));
        (items || []).forEach(item => {
          const date = String(item.Data || '');
          if (date.slice(0, 4) !== String(year)) return;
          const row = byMonth[date.slice(5, 7)];
          if (!row) return;
          if (item.Fluxo === 'Entrada') row.entrada += Number(item.Valor || 0);
          if (item.Fluxo === 'Saída') row.saida += Number(item.Valor || 0);
        });
        return { level: 'months', rows: months, clickable: true, aria: `Entradas e saídas por mês em ${year}` };
      }
      const years = Array.from({ length: IBC_YEAR_END - IBC_YEAR_START + 1 }, (_, index) => ({
        key: IBC_YEAR_START + index,
        label: String(IBC_YEAR_START + index),
        entrada: 0,
        saida: 0
      }));
      const byYear = Object.fromEntries(years.map(row => [row.key, row]));
      (items || []).forEach(item => {
        const yearKey = Number(String(item.Data || '').slice(0, 4));
        const row = byYear[yearKey];
        if (!row) return;
        if (item.Fluxo === 'Entrada') row.entrada += Number(item.Valor || 0);
        if (item.Fluxo === 'Saída') row.saida += Number(item.Valor || 0);
      });
      return { level: 'years', rows: years, clickable: true, aria: `Entradas e saídas por ano de ${IBC_YEAR_START} a ${IBC_YEAR_END}` };
    }

    function analyticsReferenceSmoothPath(points) {
      if (!points.length) return '';
      if (points.length === 1) return `M${points[0].x} ${points[0].y}`;
      return points.reduce((path, point, index) => {
        if (!index) return `M${point.x} ${point.y}`;
        const previous = points[index - 1];
        const midX = (previous.x + point.x) / 2;
        return `${path} C${midX} ${previous.y}, ${midX} ${point.y}, ${point.x} ${point.y}`;
      }, '');
    }

    function openAnalyticsReferenceYear(event) {
      event?.preventDefault?.();
      const year = Number(event?.currentTarget?.dataset?.year || 0);
      if (!year) return;
      state.analyticsChartSelectedYear = year;
      state.analyticsChartSelectedMonth = null;
      renderAnalyticsBody();
    }

    function openAnalyticsReferenceMonth(event) {
      event?.preventDefault?.();
      const month = Number(event?.currentTarget?.dataset?.month || 0);
      if (!month) return;
      state.analyticsChartSelectedMonth = Math.max(1, Math.min(12, month));
      renderAnalyticsBody();
    }

    function backAnalyticsReferenceChart() {
      if (state.analyticsChartSelectedMonth) {
        state.analyticsChartSelectedMonth = null;
      } else {
        state.analyticsChartSelectedYear = null;
      }
      renderAnalyticsBody();
    }

    function analyticsYears(items) {
      const years = unique((items || []).map(item => String(item.Data || '').slice(0, 4)).filter(Boolean));
      return years.sort((a, b) => String(b).localeCompare(String(a)));
    }

    function bindAnalyticsInteractions() {
      $$('.analytics-click').forEach(element => {
        element.addEventListener('click', () => analyticsSelect(element.dataset.kind, element.dataset.label, element.dataset.key || ''));
      });
    }

    function analyticsSelect(kind, label, key = '') {
      state.analyticsSelection = { kind, label, key };
      renderAnalyticsBody();
    }

    function analyticsClearSelection() {
      state.analyticsSelection = null;
      renderAnalyticsBody();
    }

    function analyticsSelectionPanel(items, summary) {
      const selected = state.analyticsSelection;
      if (!selected) {
        return `
          <div class="card analytics-selection">
            <div>
              <h3>Interaja com os gráficos</h3>
              <div class="muted">Clique em barras, blocos, meses, trimestres ou pontos da linha para ver valores e percentuais detalhados.</div>
            </div>
          </div>`;
      }
      const selectedItems = analyticsSelectionItems(items, selected);
      const detail = analyticsSummary(selectedItems);
      const pctVolume = percent(detail.volume, summary.volume);
      return `
        <div class="card analytics-selection">
          <div>
            <h3>${escapeHtml(selected.kind)} · ${escapeHtml(selected.label)}</h3>
            <div class="muted">${selectedItems.length} lançamento(s) · ${pctVolume} do volume filtrado</div>
          </div>
          <div class="selection-metric"><small>Entradas</small><strong>${money.format(detail.entrada)}</strong></div>
          <div class="selection-metric negative"><small>Saídas</small><strong>${money.format(detail.saida)}</strong></div>
          <div class="selection-metric ${detail.resultado < 0 ? 'negative' : ''}"><small>Resultado</small><strong>${money.format(detail.resultado)}</strong></div>
          <div class="selection-metric"><small>Percentual</small><strong>${pctVolume}</strong></div>
          <button class="btn small" onclick="analyticsClearSelection()">Limpar seleção</button>
        </div>`;
    }

    function analyticsSelectionItems(items, selected) {
      return (items || []).filter(item => {
        const monthKey = String(item.Data || '').slice(0, 7);
        const month = Number(String(item.Data || '').slice(5, 7));
        const quarter = Math.ceil(month / 3);
        if (selected.kind === 'Categoria') return (item.Categoria || 'Sem categoria') === selected.label;
        if (selected.kind === 'Subcategoria') return (item.Subcategoria || 'Sem subcategoria') === selected.label;
        if (selected.kind === 'Mês') return monthKey === selected.key;
        if (selected.kind === 'Trimestre') return String(quarter) === String(selected.key);
        if (selected.kind === 'Fluxo') return item.Fluxo === selected.label;
        if (selected.kind === 'Mapa de calor') return (item.Categoria || 'Sem categoria') === selected.label && monthKey === selected.key;
        return true;
      });
    }

    function analyticsMonthOptions() {
      const labels = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      return labels.map((label, index) => ({ label, value: String(index + 1).padStart(2, '0') }));
    }

    function analyticsFilteredItems(customFilters) {
      const filters = customFilters || state.analyticsFilters || {};
      const fixedYear = '2026';
      const source = (state.analyticsTransactions && state.analyticsTransactions.length)
        ? state.analyticsTransactions
        : (state.allTransactions && state.allTransactions.length)
          ? state.allTransactions
          : (state.transactions || []);
      return source.filter(item => {
        const date = String(item.Data || '');
        const year = date.slice(0, 4);
        const month = date.slice(5, 7);
        const quarter = Math.ceil(Number(month || 0) / 3);
        if (year !== fixedYear) return false;
        if (filters.quarter && String(quarter) !== String(filters.quarter)) return false;
        if (filters.month && month !== String(filters.month).padStart(2, '0')) return false;
        if (filters.flow && item.Fluxo !== filters.flow) return false;
        return true;
      });
    }

    function analyticsSummary(items) {
      const entrada = items.filter(item => item.Fluxo === 'Entrada').reduce((sum, item) => sum + Number(item.Valor || 0), 0);
      const saida = items.filter(item => item.Fluxo === 'Saída').reduce((sum, item) => sum + Number(item.Valor || 0), 0);
      const transferencia = items.filter(item => item.Fluxo === 'Transferência').reduce((sum, item) => sum + Number(item.Valor || 0), 0);
      return {
        entrada,
        saida,
        transferencia,
        resultado: entrada - saida,
        volume: entrada + saida + transferencia,
        count: items.length,
        categories: unique(items.map(item => item.Categoria)).length,
        subcategories: unique(items.map(item => item.Subcategoria)).length
      };
    }

    function analyticsGroups(items, labelFn) {
      const map = {};
      items.forEach(item => {
        const label = labelFn(item) || 'Sem classificação';
        map[label] ||= { label, entrada: 0, saida: 0, transferencia: 0, total: 0, resultado: 0 };
        const value = Number(item.Valor || 0);
        if (item.Fluxo === 'Entrada') map[label].entrada += value;
        else if (item.Fluxo === 'Saída') map[label].saida += value;
        else map[label].transferencia += value;
        map[label].total += value;
        map[label].resultado = map[label].entrada - map[label].saida;
      });
      return Object.values(map).sort((a, b) => b.total - a.total);
    }

    function analyticsHorizontalBars(groups, limit = 8, totalVolume = 0, kind = 'Categoria') {
      const rows = groups.slice(0, limit);
      if (!rows.length) return empty('Nenhum dado encontrado para os filtros selecionados.');
      const max = Math.max(...rows.map(row => row.total), 1);
      return `<div class="analytics-bars">${rows.map(row => {
        const isOut = row.saida > row.entrada && row.saida >= row.transferencia;
        const selected = state.analyticsSelection?.kind === kind && state.analyticsSelection?.label === row.label;
        return `
          <div class="analytics-bar-row analytics-click ${selected ? 'analytics-selected' : ''}" data-kind="${kind}" data-label="${escapeHtml(row.label)}">
            <b title="${escapeHtml(row.label)}">${escapeHtml(row.label)}</b>
            <div class="analytics-bar-track">
              <span class="${isOut ? 'analytics-bar-out' : 'analytics-bar-in'}" style="width:${Math.max(2, (row.total / max) * 100)}%"></span>
            </div>
            <span class="analytics-bar-value ${isOut ? 'negative' : ''}">${money.format(row.total)}</span>
            <span class="pct-pill ${isOut ? 'negative' : ''}">${percent(row.total, totalVolume)}</span>
          </div>`;
      }).join('')}</div>`;
    }

    function analyticsMonthlyChart(items) {
      const months = analyticsChartMonths();
      const map = Object.fromEntries(months.map(month => [month.key, { entrada: 0, saida: 0, transferencia: 0 }]));
      items.forEach(item => {
        const key = String(item.Data || '').slice(0, 7);
        if (!map[key]) return;
        const value = Number(item.Valor || 0);
        if (item.Fluxo === 'Entrada') map[key].entrada += value;
        else if (item.Fluxo === 'Saída') map[key].saida += value;
        else map[key].transferencia += value;
      });
      const values = months.map(month => map[month.key]);
      const max = Math.max(...values.map(row => row.entrada + row.saida + row.transferencia), 1000);
      const totalVolume = values.reduce((sum, row) => sum + row.entrada + row.saida + row.transferencia, 0);
      const scale = Array.from({ length: 5 }, (_, index) => Math.round((max / 4) * (4 - index)));
      return `
        <div class="chart-legend">
          <span><i class="legend-dot"></i>Entradas</span>
          <span><i class="legend-dot out"></i>Saídas</span>
        </div>
        <div class="analytics-monthly">
          <div class="analytics-monthly-scale">${scale.map(value => `<span>${shortMoney(value)}</span>`).join('')}</div>
          <div class="analytics-monthly-plot">
            ${months.map((month, index) => {
              const row = values[index];
              const total = row.entrada + row.saida + row.transferencia;
              const selected = state.analyticsSelection?.kind === 'Mês' && state.analyticsSelection?.key === month.key;
              return `
                <div class="analytics-month-stack analytics-click ${selected ? 'analytics-selected' : ''}" data-kind="Mês" data-label="${escapeHtml(month.label)}" data-key="${month.key}">
                  ${total ? `<span class="analytics-month-pct">${percent(total, totalVolume)}</span>` : ''}
                  <div class="analytics-month-bar" title="${month.label}: ${money.format(total)} · ${percent(total, totalVolume)}" style="height:${Math.max(total ? 5 : 0, (total / max) * 100)}%">
                    <span class="in" style="height:${total ? (row.entrada / total) * 100 : 0}%"></span>
                    <span class="out" style="height:${total ? (row.saida / total) * 100 : 0}%"></span>
                  </div>
                  <span class="analytics-month-label">${month.label}</span>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    function analyticsChartMonths() {
      return analyticsMonthOptions().map(month => ({
        key: `2026-${month.value}`,
        label: month.label.slice(0, 3).toLowerCase()
      }));
    }

    function analyticsTreemap(groups, totalVolume = 0) {
      const rows = groups.slice(0, 9);
      if (!rows.length) return empty('Sem categorias para montar o mapa.');
      return `<div class="analytics-treemap">${rows.map(row => {
        const isOut = row.saida > row.entrada && row.saida >= row.transferencia;
        const selected = state.analyticsSelection?.kind === 'Categoria' && state.analyticsSelection?.label === row.label;
        return `
          <div class="tree-card analytics-click ${isOut ? 'out' : ''} ${selected ? 'analytics-selected' : ''}" data-kind="Categoria" data-label="${escapeHtml(row.label)}">
            <small>${isOut ? 'Saída' : 'Entrada/Saldo'}</small>
            <b>${escapeHtml(row.label)}</b>
            <strong>${money.format(row.total)}</strong>
            <span class="pct-pill ${isOut ? 'negative' : ''}">${percent(row.total, totalVolume)}</span>
          </div>`;
      }).join('')}</div>`;
    }

    function analyticsQuarterChart(items, totalVolume = 0) {
      const quarters = [1, 2, 3, 4].map(q => ({ q, entrada: 0, saida: 0, transferencia: 0 }));
      items.forEach(item => {
        const month = Number(String(item.Data || '').slice(5, 7));
        const quarter = Math.ceil(month / 3);
        const row = quarters[quarter - 1];
        if (!row) return;
        const value = Number(item.Valor || 0);
        if (item.Fluxo === 'Entrada') row.entrada += value;
        else if (item.Fluxo === 'Saída') row.saida += value;
        else row.transferencia += value;
      });
      const max = Math.max(...quarters.map(q => Math.max(q.entrada, q.saida, q.transferencia)), 1);
      return `<div class="quarter-grid">${quarters.map(q => `
        <div class="quarter-card analytics-click ${state.analyticsSelection?.kind === 'Trimestre' && String(state.analyticsSelection?.key) === String(q.q) ? 'analytics-selected' : ''}" data-kind="Trimestre" data-label="${q.q}º trimestre" data-key="${q.q}">
          <b>${q.q}º trimestre <span class="pct-pill">${percent(q.entrada + q.saida + q.transferencia, totalVolume)}</span></b>
          <div class="quarter-stack">
            <span title="Entradas: ${money.format(q.entrada)}" style="height:${Math.max(q.entrada ? 4 : 0, (q.entrada / max) * 100)}%"></span>
            <span class="out" title="Saídas: ${money.format(q.saida)}" style="height:${Math.max(q.saida ? 4 : 0, (q.saida / max) * 100)}%"></span>
          </div>
          <small class="muted">Resultado ${money.format(q.entrada - q.saida)}</small>
        </div>`).join('')}</div>`;
    }

    function analyticsFlowMix(summary) {
      const total = Math.max(summary.volume || 0, 0);
      if (!total) return empty('Sem volume para compor o gráfico.');
      const inPct = (summary.entrada / total) * 100;
      const outPct = inPct + (summary.saida / total) * 100;
      return `
        <div class="mix-wrap">
          <div class="mix-donut" style="--in:${inPct}%;--out:${outPct}%"></div>
          <div class="mix-legend">
            <div class="analytics-click ${state.analyticsSelection?.kind === 'Fluxo' && state.analyticsSelection?.label === 'Entrada' ? 'analytics-selected' : ''}" data-kind="Fluxo" data-label="Entrada"><i></i><span>Entradas · ${percent(summary.entrada, total)}</span><strong>${money.format(summary.entrada)}</strong></div>
            <div class="analytics-click ${state.analyticsSelection?.kind === 'Fluxo' && state.analyticsSelection?.label === 'Saída' ? 'analytics-selected' : ''}" data-kind="Fluxo" data-label="Saída"><i class="out"></i><span>Saídas · ${percent(summary.saida, total)}</span><strong>${money.format(summary.saida)}</strong></div>
            <div class="analytics-click ${state.analyticsSelection?.kind === 'Fluxo' && state.analyticsSelection?.label === 'Transferência' ? 'analytics-selected' : ''}" data-kind="Fluxo" data-label="Transferência"><i class="transfer"></i><span>Transferências · ${percent(summary.transferencia, total)}</span><strong>${money.format(summary.transferencia)}</strong></div>
          </div>
        </div>`;
    }

    function analyticsCumulativeLine(items, summary = analyticsSummary(items)) {
      const months = analyticsChartMonths();
      const monthMap = Object.fromEntries(months.map(month => [month.key, { entrada: 0, saida: 0 }]));
      items.forEach(item => {
        const key = String(item.Data || '').slice(0, 7);
        if (!(key in monthMap)) return;
        if (item.Fluxo === 'Entrada') monthMap[key].entrada += Number(item.Valor || 0);
        if (item.Fluxo === 'Saída') monthMap[key].saida += Number(item.Valor || 0);
      });
      let accEntrada = 0;
      let accSaida = 0;
      const entradaValues = months.map(month => {
        accEntrada += monthMap[month.key].entrada || 0;
        return accEntrada;
      });
      const saidaValues = months.map(month => {
        accSaida += monthMap[month.key].saida || 0;
        return accSaida;
      });
      const min = 0;
      const max = Math.max(...entradaValues, ...saidaValues, 1000);
      const range = Math.max(max - min, 1);
      const w = 980, h = 270, pad = 38;
      const makePoints = values => values.map((value, index) => {
        const x = pad + (index * (w - pad * 2)) / Math.max(values.length - 1, 1);
        const y = h - pad - ((value - min) / range) * (h - pad * 2);
        return { x, y, value, label: months[index].label };
      });
      const entradaPoints = makePoints(entradaValues);
      const saidaPoints = makePoints(saidaValues);
      const entradaPath = entradaPoints.map(point => `${point.x},${point.y}`).join(' ');
      const saidaPath = saidaPoints.map(point => `${point.x},${point.y}`).join(' ');
      const zeroY = h - pad;
      const totalEntrada = Math.max(summary.entrada || accEntrada, 1);
      const totalSaida = Math.max(summary.saida || accSaida, 1);
      return `
        <div class="chart-legend">
          <span><i class="legend-dot"></i>Entradas acumuladas</span>
          <span><i class="legend-dot out"></i>Saídas acumuladas</span>
        </div>
        <div class="line-chart">
          <svg viewBox="0 0 ${w} ${h}" width="100%" height="270" role="img" aria-label="Entradas e saídas acumuladas">
            <line x1="${pad}" y1="${zeroY}" x2="${w - pad}" y2="${zeroY}" stroke="#cfd8e3" stroke-width="1" />
            <polyline points="${entradaPath}" fill="none" stroke="#103367" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <polyline points="${saidaPath}" fill="none" stroke="#e5484d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            ${entradaPoints.map((point, index) => `<circle class="analytics-click" data-kind="Mês" data-label="${escapeHtml(point.label)}" data-key="${months[index].key}" cx="${point.x}" cy="${point.y}" r="5" fill="#103367"><title>${point.label} · Entradas: ${money.format(point.value)} · ${percent(point.value, totalEntrada)}</title></circle>`).join('')}
            ${saidaPoints.map((point, index) => `<circle class="analytics-click" data-kind="Mês" data-label="${escapeHtml(point.label)}" data-key="${months[index].key}" cx="${point.x}" cy="${point.y}" r="5" fill="#e5484d"><title>${point.label} · Saídas: ${money.format(point.value)} · ${percent(point.value, totalSaida)}</title></circle>`).join('')}
            ${entradaPoints.map((point, index) => index % 2 === 0 ? `<text x="${point.x}" y="${h - 10}" text-anchor="middle" font-size="11" fill="#667085">${point.label}</text>` : '').join('')}
            <text x="${pad}" y="22" font-size="12" fill="#667085">Máx. ${money.format(max)}</text>
            <text x="${pad}" y="${h - 46}" font-size="12" fill="#667085">Base ${money.format(0)}</text>
          </svg>
        </div>`;
    }

    function analyticsHeatmap(items, byCategory, totalVolume = 0) {
      const months = analyticsChartMonths();
      const categories = byCategory.slice(0, 6).map(row => row.label);
      if (!categories.length) return empty('Sem categorias para montar o mapa de calor.');
      const map = {};
      let max = 0;
      categories.forEach(category => months.forEach(month => { map[`${category}|${month.key}`] = 0; }));
      items.forEach(item => {
        const category = item.Categoria || 'Sem categoria';
        const key = String(item.Data || '').slice(0, 7);
        const mapKey = `${category}|${key}`;
        if (!(mapKey in map)) return;
        map[mapKey] += Number(item.Valor || 0);
        max = Math.max(max, map[mapKey]);
      });
      return `
        <div class="heatmap">
          <div class="heatmap-grid">
            <div class="heat-cell heat-head">Categoria</div>
            ${months.map(month => `<div class="heat-cell heat-head">${month.label}</div>`).join('')}
            ${categories.map(category => `
              <div class="heat-cell heat-label">${escapeHtml(category)}</div>
              ${months.map(month => {
                const value = map[`${category}|${month.key}`] || 0;
                const intensity = max ? Math.min(.9, .08 + (value / max) * .72) : .06;
                const selected = state.analyticsSelection?.kind === 'Mapa de calor' && state.analyticsSelection?.label === category && state.analyticsSelection?.key === month.key;
                return `<div class="heat-cell analytics-click ${selected ? 'analytics-selected' : ''}" data-kind="Mapa de calor" data-label="${escapeHtml(category)}" data-key="${month.key}" title="${escapeHtml(category)} · ${month.label}: ${money.format(value)} · ${percent(value, totalVolume)}" style="background:rgba(16,51,103,${intensity});color:${intensity > .45 ? '#fff' : 'var(--ink)'}">${value ? `${money.format(value)}<br><small>${percent(value, totalVolume)}</small>` : '–'}</div>`;
              }).join('')}
            `).join('')}
          </div>
        </div>`;
    }

    function analyticsWaterfall(summary) {
      const negative = summary.resultado < 0;
      return `
        <div class="bridge">
          <div class="bridge-step"><small>Começa com entradas</small><strong>${money.format(summary.entrada)}</strong><span class="muted">Tudo que entrou no período</span></div>
          <div class="bridge-step out"><small>Abate as saídas</small><strong>− ${money.format(summary.saida)}</strong><span class="muted">Tudo que saiu do caixa</span></div>
          <div class="bridge-step result ${negative ? 'negative' : ''}"><small>Resultado final</small><strong>${money.format(summary.resultado)}</strong><span class="muted">${negative ? 'Atenção: saída maior que entrada' : 'Saldo positivo no filtro'}</span></div>
        </div>`;
    }

    function analyticsInsight(icon, title, text) {
      return `<div class="insight"><span class="insight-icon">${icon}</span><div><strong>${escapeHtml(title)}</strong><div class="muted">${escapeHtml(text)}</div></div></div>`;
    }

    function analyticsPeriodLabel(customFilters) {
      const f = customFilters || state.analyticsFilters;
      const parts = ['Janeiro a dezembro de 2026'];
      if (f.quarter) parts.push(`${f.quarter}º trimestre`);
      if (f.month) parts.push(analyticsMonthOptions().find(m => m.value === f.month)?.label || f.month);
      if (f.flow) parts.push(f.flow);
      return parts.join(' · ');
    }

        <div class="database-ref-screen">

            <button class="ibc-panel-toggle" type="button" title="Recolher menu" aria-label="Recolher menu" onclick="toggleMenu()"></button>

            <div class="ibc-home-actions">

              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
