<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinguim Financeiro</title>
  <style>
:root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --soft: #f8fafd;
      --ink: #0f172a;
      --muted: #667085;
      --line: #dbe4f0;
      --navy: #103367;
      --navy-2: #0b2854;
      --red: #e5484d;
      --green: #147a55;
      --amber: #d6942d;
      --shadow: 0 14px 40px rgba(16, 51, 103, .08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Rubik, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .58; }
    [hidden] { display: none !important; }

    .app {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      min-height: 100vh;
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      background: #eaf1fb;
      border-right: 1px solid #b9cbe3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 10px;
      z-index: 5;
    }

    .brand, .rail-btn, .settings-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #8c99aa;
      font-size: 22px;
      font-weight: 900;
    }

    .brand {
      color: var(--navy);
      background: #ffffff;
      border: 1px solid #cbd8ea;
      margin-bottom: 16px;
    }

    .rail-btn.active {
      color: var(--navy);
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .settings-btn { margin-top: auto; color: var(--navy); }

    .main { min-width: 0; }

    .topbar {
      min-height: 88px;
      background: #fff;
      border-bottom: 1px solid #e7edf5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 28px;
    }

    .title small {
      display: block;
      color: var(--navy);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(24px, 2.6vw, 34px);
      letter-spacing: -.04em;
      line-height: 1;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #f8faf7;
      color: #98a2b3;
      font-size: 18px;
      font-weight: 900;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #f06445;
      color: #fff;
      font-weight: 900;
    }

    .content {
      padding: 26px 30px 48px;
      max-width: 1680px;
      margin: 0 auto;
    }

    .content.launch-page {
      max-width: none;
      width: 100%;
      padding-top: 22px;
    }

    .content.dashboard-page {
      max-width: none;
      width: 100%;
      padding-top: 16px;
      padding-bottom: 12px;
    }

    .content.cash-page {
      max-width: none;
      width: 100%;
      padding-top: 22px;
    }

    .content.analytics-page {
      max-width: none;
      width: 100%;
      padding-top: 22px;
    }

    .content.database-page {
      max-width: none;
      width: 100%;
      padding-top: 22px;
    }

    body.database-shell .content.database-page {
      max-width: none;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      margin: 0;
      padding: 0 40px 24px;
      background: #fff;
      overflow: hidden;
    }

    body.database-shell .database-ref-screen {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    body.database-shell .database-filter-row {
      grid-template-columns: 270px 180px minmax(180px, 1fr);
    }

    body.database-shell .database-ref-table {
      flex: 1 1 auto;
      min-height: 0;
      box-shadow: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill {
      border: 0;
      border-radius: 999px;
      background: #e6edf7;
      color: var(--navy);
      min-height: 42px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
    }
    .pill.is-filtered {
      background: var(--navy);
      color: #fff;
    }

    .btn {
      border: 1px solid #cbd8ea;
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      min-height: 42px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
    }

    .btn.primary {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .btn.danger { color: var(--red); }
    .btn.small { min-height: 34px; padding: 0 11px; font-size: 12px; }

    .grid { display: grid; gap: 16px; }
    .dashboard-top { grid-template-columns: minmax(330px, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); margin-bottom: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      min-height: 158px;
      overflow: hidden;
      padding: 24px;
      color: #fff;
      background: #172117;
      border: 0;
    }

    .hero:before {
      content: "";
      position: absolute;
      width: 155px;
      height: 155px;
      right: -42px;
      top: -55px;
      border-radius: 50%;
      background: var(--navy);
    }

    .hero small { color: #cad4c6; font-weight: 800; }
    .hero strong { display: block; margin-top: 16px; font-size: clamp(32px, 4vw, 44px); letter-spacing: -.06em; }
    .hero span { display: block; margin-top: 6px; color: #a9c7f6; font-size: 12px; font-weight: 800; }

    .metric {
      padding: 24px;
      min-height: 158px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric small { color: var(--muted); font-weight: 700; }
    .metric strong { display: block; margin: 13px 0 6px; color: var(--navy); font-size: 26px; letter-spacing: -.04em; }
    .metric.negative strong { color: var(--red); }
    .metric em { color: var(--muted); font-style: normal; font-size: 12px; }

    .section-grid { grid-template-columns: minmax(0, 1.6fr) minmax(320px, .8fr); }
    .panel { padding: 20px; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .panel h2, .panel h3 { margin: 0; letter-spacing: -.03em; }
    .panel p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .account-list { display: grid; gap: 10px; }
    .account-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 13px;
      border-radius: 12px;
      background: var(--soft);
      border: 1px solid #e8eef7;
    }
    .account-row span { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .account-row strong:last-child { color: var(--navy); white-space: nowrap; }

    .bars { display: grid; gap: 10px; margin-top: 16px; }
    .bar-row { display: grid; grid-template-columns: 90px 1fr 80px; gap: 10px; align-items: center; font-size: 12px; }
    .bar-track { height: 18px; border-radius: 999px; overflow: hidden; background: #edf2f8; display: flex; }
    .bar-in { background: var(--navy); }
    .bar-out { background: var(--red); }

    .dashboard-page .toolbar { margin-bottom: 12px; }
    .dashboard-page .dashboard-top {
      grid-template-columns: minmax(520px, 1.85fr) minmax(240px, .72fr) minmax(240px, .72fr);
      gap: 12px;
      margin-bottom: 12px;
    }
    .dashboard-page .hero {
      min-height: 118px;
      border-radius: 14px;
      padding: 18px 22px;
    }
    .dashboard-page .hero strong {
      margin-top: 12px;
      font-size: clamp(30px, 2.6vw, 40px);
    }
    .dashboard-page .metric {
      position: relative;
      min-height: 118px;
      border-radius: 14px;
      padding: 18px 22px;
    }
    .metric-icon {
      position: absolute;
      right: 20px;
      top: 24px;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #f3f6fb;
      color: var(--navy);
      font-weight: 900;
    }
    .metric.negative .metric-icon { color: var(--red); }
    .dashboard-middle,
    .dashboard-bottom {
      display: grid;
      grid-template-columns: minmax(0, 2.05fr) minmax(360px, .95fr);
      gap: 12px;
      margin-bottom: 12px;
    }
    .dashboard-page .panel {
      padding: 16px 18px;
    }
    .dashboard-page .panel-head {
      margin-bottom: 8px;
    }
    .dashboard-page .panel h2 {
      font-size: 22px;
    }
    .chart-panel,
    .category-panel {
      min-height: 282px;
    }
    .dashboard-bottom .panel {
      min-height: 178px;
    }
    .dashboard-bottom { margin-bottom: 0; }
    .period-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: #f7f8f4;
    }
    .period-toggle span {
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .period-toggle .active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 5px 14px rgba(15, 23, 42, .08);
    }
    .vchart {
      height: 218px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 8px;
    }
    .vchart-scale {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      padding-right: 4px;
      padding-bottom: 25px;
    }
    .vchart-scale span {
      white-space: nowrap;
    }
    .vchart-plot {
      position: relative;
      display: grid;
      grid-template-columns: repeat(12, minmax(28px, 1fr));
      align-items: end;
      gap: 18px;
      background: repeating-linear-gradient(to bottom, transparent, transparent 34px, #e2e7ef 35px);
      padding: 0 8px 25px;
    }
    .vchart-plot::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 25px;
      border-bottom: 1px solid #cfd7df;
    }
    .vbar-group {
      position: relative;
      height: 100%;
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 4px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
      z-index: 1;
    }
    .vbar-group:hover {
      background: rgba(16, 51, 103, .05);
    }
    .vbar-group.active {
      background: rgba(16, 51, 103, .10);
    }
    .vbar-group.active .vlabel,
    .vbar-group:hover .vlabel {
      color: var(--navy);
      font-weight: 900;
    }
    .vbar {
      width: 22px;
      min-height: 2px;
      border-radius: 8px 8px 3px 3px;
      background: var(--navy);
    }
    .vbar.out { background: var(--red); }
    .vbar.transfer { background: #9aa8bb; }
    .vbar-value {
      position: absolute;
      bottom: calc(var(--bar-height) + var(--label-gap, 2px));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateX(-50%);
      transform-origin: center;
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      color: var(--navy);
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 1px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff;
      pointer-events: none;
    }
    .vbar-value.in { left: calc(50% - 13px); }
    .vbar-value.out {
      left: calc(50% + 13px);
      bottom: calc(var(--bar-height) + var(--label-gap, 2px));
      color: var(--red);
    }
    .vlabel {
      position: absolute;
      left: 50%;
      bottom: -22px;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }
    .legend-dot {
      width: 14px;
      height: 14px;
      display: inline-block;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: -2px;
      background: var(--navy);
    }
    .legend-dot.out { background: var(--red); }
    .legend-dot.transfer { background: #9aa8bb; }
    .donut-wrap {
      min-height: 235px;
      display: grid;
      place-items: center;
      color: var(--muted);
    }
    .donut {
      width: 185px;
      height: 185px;
      border-radius: 50%;
      background: conic-gradient(var(--red) var(--pct), #eef2f7 0);
      display: grid;
      place-items: center;
    }
    .donut:after {
      content: "";
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: #fff;
    }
    .recent-list { display: grid; gap: 0; }
    .recent-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 14px;
      padding: 9px 14px;
      border-bottom: 1px solid #eef2f6;
    }
    .recent-row:last-child { border-bottom: 0; }
    .recent-row h4 { margin: 0 0 4px; font-size: 14px; }
    .recent-row .amount { font-weight: 900; color: var(--navy); white-space: nowrap; }
    .recent-row.out .amount { color: var(--red); }
    .dashboard-account-list { display: grid; gap: 7px; margin-top: 8px; }
    .dashboard-account {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 0;
    }
    .account-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #eef3ff;
      color: var(--navy);
      font-weight: 900;
      font-size: 15px;
    }
    .dashboard-account h4 { margin: 0 0 2px; font-size: 14px; }
    .dashboard-account span { color: var(--muted); font-size: 12px; }
    .dashboard-account strong { color: var(--ink); font-size: 14px; white-space: nowrap; }
    .date-badge {
      color: var(--muted);
      background: #f6f8fb;
    }

    .analytics-filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr)) auto;
      gap: 12px;
      align-items: end;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 14px;
    }
    .analytics-filters .field label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .analytics-kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .analytics-kpi {
      padding: 18px;
      min-height: 118px;
      display: grid;
      align-content: center;
      gap: 8px;
      border-radius: 14px;
    }
    .analytics-kpi small {
      color: var(--muted);
      font-weight: 800;
    }
    .analytics-kpi strong {
      color: var(--navy);
      font-size: 25px;
      letter-spacing: -.04em;
    }
    .analytics-kpi.negative strong { color: var(--red); }
    .analytics-selection {
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(4, auto);
      align-items: center;
      gap: 14px;
    }
    .analytics-selection h3 { margin: 0 0 4px; font-size: 16px; }
    .selection-metric {
      min-width: 120px;
      padding: 10px 12px;
      border: 1px solid #e1e9f5;
      border-radius: 12px;
      background: #f8fafc;
    }
    .selection-metric small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .selection-metric strong {
      color: var(--navy);
      white-space: nowrap;
    }
    .selection-metric.negative strong { color: var(--red); }
    .analytics-click {
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, outline-color .15s ease;
    }
    .analytics-click:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(16, 51, 103, .11);
    }
    .analytics-selected {
      outline: 2px solid var(--navy);
      outline-offset: 2px;
    }
    .pct-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 46px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e8eef7;
      color: var(--navy);
      font-size: 11px;
      font-weight: 900;
    }
    .pct-pill.negative {
      background: #fff1f2;
      color: var(--red);
    }
    .analytics-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(360px, .8fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    .analytics-wide {
      grid-column: 1 / -1;
    }
    .analytics-chart {
      min-height: 340px;
    }
    .analytics-chart,
    .category-panel {
      container-type: inline-size;
    }
    .analytics-panel-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .analytics-bars {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }
    .analytics-bar-row {
      display: grid;
      grid-template-columns: minmax(170px, 240px) 1fr 110px 64px;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      padding: 6px;
      border-radius: 12px;
    }
    .analytics-bar-row b {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .analytics-bar-track {
      height: 24px;
      border-radius: 999px;
      overflow: hidden;
      background: #edf2f8;
      display: flex;
    }
    .analytics-bar-in {
      min-width: 2px;
      background: linear-gradient(90deg, var(--navy), #315f9f);
    }
    .analytics-bar-out {
      min-width: 2px;
      background: linear-gradient(90deg, var(--red), #f07a7d);
    }
    .analytics-bar-value {
      text-align: right;
      color: var(--navy);
      font-weight: 900;
      white-space: nowrap;
    }
    .analytics-bar-value.negative { color: var(--red); }
    .analytics-monthly {
      height: 280px;
      margin-top: 22px;
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 8px;
    }
    .analytics-monthly-scale {
      display: grid;
      grid-template-rows: repeat(5, 1fr);
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      padding-right: 4px;
    }
    .analytics-monthly-scale span {
      white-space: nowrap;
    }
    .analytics-monthly-plot {
      position: relative;
      display: grid;
      grid-template-columns: repeat(12, minmax(36px, 1fr));
      gap: 12px;
      align-items: end;
      border-bottom: 1px solid #cad4df;
      background: repeating-linear-gradient(to bottom, transparent, transparent 54px, #e3e8f0 55px);
      padding: 0 8px;
    }
    .analytics-month-stack {
      position: relative;
      height: 100%;
      display: flex;
      align-items: end;
      justify-content: center;
    }
    .analytics-month-bar {
      width: 34px;
      border-radius: 9px 9px 3px 3px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      background: #e8edf4;
    }
    .analytics-month-bar span { display: block; }
    .analytics-month-bar .in { background: var(--navy); }
    .analytics-month-bar .out { background: var(--red); }
    .analytics-month-label {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .analytics-month-pct {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 900;
      color: var(--navy);
      background: #eef4ff;
      border-radius: 999px;
      padding: 3px 7px;
      white-space: nowrap;
      opacity: .9;
    }
    .analytics-treemap {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
    }
    .tree-card {

    function buildFoodCommerceMockTransactions() {
      const transactions = [];
      const seasonality = [0.92, 0.9, 1.02, 1.04, 1.0, 0.98, 1.04, 1.08, 1.05, 1.09, 1.18, 1.34];
      const pad = value => String(value).padStart(2, '0');
      const round50 = value => Math.round(Number(value || 0) / 50) * 50;
      const add = (id, date, flow, origin, destination, value, history, category, subcategory) => {
        transactions.push({
          ID: id,
          Data: date,
          Fluxo: flow,
          Origem: origin,
          Destino: destination,
          Valor: round50(value),
          Historico: history,
          Categoria: category,
          Subcategoria: subcategory,
          Status: 'Realizado',
          CriadoPor: 'demo@pinguim.local',
          CriadoEm: `${date}T09:00:00`,
          AtualizadoPor: 'demo@pinguim.local',
          AtualizadoEm: `${date}T09:00:00`,
          Excluido: false
        });
      };

      for (let year = IBC_YEAR_START; year <= IBC_YEAR_END; year += 1) {
        const yearIndex = year - IBC_YEAR_START;
        const maturity = yearIndex / (IBC_YEAR_END - IBC_YEAR_START);
        const baseRevenue = 17800 * Math.pow(1.17, yearIndex);
        for (let month = 1; month <= 12; month += 1) {
          const monthKey = `${year}-${pad(month)}`;
          const localOscillation = 1 + ((((yearIndex + 1) * 7 + month * 5) % 9) - 4) / 100;
          const revenue = round50(baseRevenue * seasonality[month - 1] * localOscillation + yearIndex * 850);
          const counterShare = 0.55 - Math.min(yearIndex, 7) * 0.012;
          const deliveryShare = 0.27 + Math.min(yearIndex, 8) * 0.008;
          const counterSales = round50(revenue * counterShare);
          const deliverySales = round50(revenue * deliveryShare);
          const wholesaleSales = round50(revenue - counterSales - deliverySales);
          const goodsCost = round50(revenue * (0.47 - Math.min(yearIndex, 8) * 0.006 + ((month % 4) - 1.5) * 0.006));
          const packagingCost = round50(revenue * (0.052 + maturity * 0.012));
          const rentCost = round50(2600 + yearIndex * 430 + (year >= 2032 ? 1200 : 0));
          const utilitiesCost = round50(820 + yearIndex * 120 + seasonality[month - 1] * 180);
          const payrollCost = round50(3800 + yearIndex * 920 + (year >= 2030 ? 1800 : 0) + (year >= 2034 ? 2700 : 0));
          const marketingCost = round50(360 + yearIndex * 150 + (month >= 11 ? 350 : 0));

          add(`LAN-${year}${pad(month)}-REC-01`, `${monthKey}-03`, 'Entrada', 'Vendas / Balcão e loja', 'Caixa físico', counterSales, 'vendas de balcão de alimentos, bebidas e itens de conveniência', 'Vendas', 'Balcão e loja');
          add(`LAN-${year}${pad(month)}-REC-02`, `${monthKey}-12`, 'Entrada', 'Vendas / Delivery e encomendas', 'Nubank', deliverySales, 'delivery, encomendas e pedidos para retirada', 'Vendas', 'Delivery e encomendas');
          add(`LAN-${year}${pad(month)}-REC-03`, `${monthKey}-24`, 'Entrada', 'Vendas / Atacado local', 'Banco do Brasil', wholesaleSales, 'fornecimento para mercadinhos, escritórios e eventos locais', 'Vendas', 'Atacado local');

          add(`LAN-${year}${pad(month)}-DES-01`, `${monthKey}-06`, 'Saída', 'Banco do Brasil', 'Compras / Mercadorias para revenda', goodsCost, 'compra de alimentos, bebidas e produtos para revenda', 'Compras', 'Mercadorias para revenda');
          add(`LAN-${year}${pad(month)}-DES-02`, `${monthKey}-09`, 'Saída', 'Nubank', 'Compras / Insumos e embalagens', packagingCost, 'embalagens, descartáveis e insumos de preparo', 'Compras', 'Insumos e embalagens');
          add(`LAN-${year}${pad(month)}-DES-03`, `${monthKey}-10`, 'Saída', 'Itaú', 'Despesas administrativas / Aluguel do ponto', rentCost, 'aluguel do ponto comercial', 'Despesas administrativas', 'Aluguel do ponto');
          add(`LAN-${year}${pad(month)}-DES-04`, `${monthKey}-18`, 'Saída', 'Nubank', 'Despesas administrativas / Energia, água e internet', utilitiesCost, 'energia, água, internet e operação da loja', 'Despesas administrativas', 'Energia, água e internet');
          add(`LAN-${year}${pad(month)}-DES-05`, `${monthKey}-20`, 'Saída', 'Banco do Brasil', 'Pessoal / Folha de pagamento', payrollCost, 'salários, ajudantes e diaristas da operação', 'Pessoal', 'Folha de pagamento');
          add(`LAN-${year}${pad(month)}-DES-06`, `${monthKey}-25`, 'Saída', 'Nubank', 'Marketing / Divulgação local', marketingCost, 'panfletos, redes sociais, promoções e aplicativos locais', 'Marketing', 'Divulgação local');
        }
      }
      return transactions;
    }

    function handleStartupFailure(error) {
      console.error(error);

        setLoading(false);

      applyFallbackData();
      setLoading(false);

        document.body.classList.remove('mobile-menu-open');

        render();

    function toggleMenu() {
      const isReferenceMobile = document.body.classList.contains('dashboard-shell')
        && window.matchMedia
        && window.matchMedia('(max-width: 700px)').matches;
      if (isReferenceMobile) {
        document.body.classList.remove('nav-collapsed');
        const open = document.body.classList.toggle('mobile-menu-open');
        $$('.rail-panel-icon, .ibc-panel-toggle').forEach(toggle => {
          toggle.title = open ? 'Fechar menu' : 'Abrir menu';
          toggle.setAttribute('aria-label', toggle.title);
        });
        return;
      }
      document.body.classList.toggle('nav-collapsed');
      const toggle = $('.rail-panel-icon');
      const collapsed = document.body.classList.contains('nav-collapsed');
      storageSet('pinguim-menu-collapsed', collapsed ? '1' : '0');
      if (toggle) {
        toggle.title = collapsed ? 'Abrir menu' : 'Recolher menu';
        toggle.setAttribute('aria-label', toggle.title);

      if (state.route === 'dashboard') renderDashboard();

      const params = new URLSearchParams(location.search);

      document.body.classList.toggle('nav-collapsed', collapsed);

    async function loadApp(options = {}) {
      const showLoader = options.showLoader !== false;
      if (showLoader) setLoading(true);
      try {
        const data = await serverCall('appBootstrap');
        state.user = data.user;
        state.catalogs = data.catalogs;
        state.dashboard = data.dashboard;
        state.allTransactions = data.transactions || data.recent || [];
        state.transactions = data.transactions || data.recent || [];
        $('#companyLabel').textContent = 'AURORA STUDIO · GESTÃO FINANCEIRA EMPRESARIAL';
        $('#avatar').textContent = initials(state.user.Nome || state.user.Email || 'P');
        render();
      } catch (error) {
        console.error(error);
        toast(error.message, 'error');
        applyFallbackData();
      } finally {
        if (showLoader) setLoading(false);
        else setLoading(false);
      }
    }
