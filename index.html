    function cashbookReferenceCards() {
      const sections = cashbookReferenceSections();
      if (!sections.length) return '<div class="cash-ref-empty">Nenhum lançamento encontrado.</div>';
      if (state.cashbookExpandedSection) {
        const sectionIndex = sections.findIndex(section => (section.key || section.title) === state.cashbookExpandedSection);
        if (sectionIndex >= 0) return cashbookReferenceExpandedCard(sections[sectionIndex], sectionIndex);
        state.cashbookExpandedSection = null;
      }
      return sections.map((section, index) => `
        <article class="cash-ref-card ${section.rows.some(item => item._cashDetail) ? 'has-detail-card' : ''}">
          <div class="cash-ref-head">
            <span class="cash-ref-icon" aria-hidden="true">${cashbookCardIcon(index)}</span>
            <strong class="cash-ref-title">${escapeHtml(section.title)}</strong>
            <strong class="cash-ref-total">${money.format(section.total)}</strong>
          </div>
          <div class="cash-ref-body">
            <div class="cash-ref-subtitle">${escapeHtml(section.subtitle)}</div>
            <div class="cash-ref-columns" aria-hidden="true">
              <span>Data</span>
              <span>Nº de lançamento</span>
              <span>Histórico</span>
              <span>Entrada</span>
              <span>Saída</span>
              <span>Saldo</span>
            </div>
            ${section.rows.slice(0, 3).map(item => cashbookReferenceRow(item)).join('')}
            ${cashbookReferenceActions(section, true)}
          </div>
        </article>
      `).join('');
    }

    function cashbookReferenceExpandedCard(section, index) {
      const page = cashbookExpandedPageInfo(section.rows.length);
      const rows = section.rows.slice(page.startIndex, page.endIndex);
      const showOpening = page.page === page.pages;
      return `
        <article class="cash-ref-card is-expanded">
          <div class="cash-ref-detail-bar">
            <button class="cash-ref-back" type="button" onclick="closeCashbookReferenceSection()">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path><path d="M21 12H9"></path></svg>
              <span>Voltar</span>
            </button>
          </div>
          <div class="cash-ref-head">
            <span class="cash-ref-icon" aria-hidden="true">${cashbookCardIcon(index)}</span>
            <strong class="cash-ref-title">${escapeHtml(section.title)}</strong>
            <strong class="cash-ref-total">${money.format(section.total)}</strong>
          </div>
          <div class="cash-ref-body">
            <div class="cash-ref-subtitle">${escapeHtml(section.subtitle)}</div>
            <div class="cash-ref-columns" aria-hidden="true">
              <span>Data</span>
              <span>Nº de lançamento</span>
              <span>Histórico</span>
              <span>Entrada</span>
              <span>Saída</span>
              <span>Saldo</span>
            </div>
            ${rows.map(item => cashbookReferenceRow(item)).join('')}
            ${showOpening ? cashbookReferenceOpeningRow() : ''}
          </div>
          ${cashbookReferenceActions(section, false)}
          ${cashbookExpandedPagination(section.rows.length, page)}
        </article>`;
    }

    function cashbookReferenceActions(section, showMore = true) {
      return `
        <div class="cash-ref-actions">
          <button class="cash-ref-action" type="button" title="Baixar Excel" aria-label="Baixar Excel" onclick="exportCashbookExcel()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
          </button>
          <button class="cash-ref-action" type="button" title="Baixar PDF" aria-label="Baixar PDF" onclick="downloadLivroCaixaAtual()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h11"></path><path d="M8 12h11"></path><path d="M8 18h11"></path><path d="M4 6h.01"></path><path d="M4 12h.01"></path><path d="M4 18h.01"></path></svg>
          </button>
          <button class="cash-ref-action" type="button" title="Favoritar" aria-label="Favoritar" onclick="toast('Livro caixa marcado como favorito.')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"></path></svg>
          </button>
          ${showMore ? `<button class="cash-ref-more" type="button" data-section="${escapeHtml(section.key || section.title)}" onclick="openCashbookReferenceSection(event)">Ver mais</button>` : ''}
        </div>`;
    }

    function cashbookReferenceRow(item) {
      const detail = item._cashDetail ? `<small>${escapeHtml(item._cashDetail)}</small>` : '';
      return `
        <div class="cash-ref-row ${detail ? 'has-detail' : ''}">
          <span>${formatDate(item.Data)}</span>
          <span>${escapeHtml(item._cashNumber || numberFor(item))}</span>
          <span title="${escapeHtml(item.Historico || '')}"><strong>${escapeHtml(item.Historico || '')}</strong>${detail}</span>
          <span>${launchAmountCell(item, 'Entrada')}</span>
          <span>${launchAmountCell(item, 'Saída')}</span>
          <span class="launch-balance">${money.format(Number(item._cashSaldo || 0))}</span>
        </div>`;
    }

    function cashbookReferenceOpeningRow() {
      return `
        <div class="cash-ref-row cash-ref-opening">
          <span>–</span>
          <span>–</span>
          <span>Saldo inicial</span>
          <span>–</span>
          <span>–</span>
          <span class="launch-balance">${money.format(0)}</span>
        </div>`;
    }

    function openCashbookReferenceSection(event) {
      const button = event?.currentTarget || event?.target?.closest?.('[data-section]');
      const section = button?.dataset?.section || '';
      if (!section) return;
      const target = $('#cashRefCards');
      state.cashbookReturnScroll = target ? target.scrollTop : 0;
      state.cashbookExpandedSection = section;
      state.cashbookExpandedPage = 1;
      renderCashbookCards();
      requestAnimationFrame(() => {
        const list = $('#cashRefCards');
        if (list) list.scrollTop = 0;
      });
    }

    function closeCashbookReferenceSection() {
      state.cashbookExpandedSection = null;
      state.cashbookExpandedPage = 1;
      const scroll = Number(state.cashbookReturnScroll || 0);
      renderCashbookCards();
      requestAnimationFrame(() => {
        const list = $('#cashRefCards');
        if (list) list.scrollTop = scroll;
      });
    }

    function cashbookExpandedPageInfo(total) {
      const size = cashbookExpandedRowsPerPage();
      const pages = Math.max(1, Math.ceil(Number(total || 0) / size));
      const page = Math.min(Math.max(1, Number(state.cashbookExpandedPage || 1)), pages);
      state.cashbookExpandedPage = page;
      const startIndex = total ? (page - 1) * size : 0;
      const endIndex = Math.min(page * size, total);
      return {
        total,
        size,
        pages,
        page,
        startIndex,
        endIndex,
        start: total ? startIndex + 1 : 0,
        end: endIndex
      };
    }

    function cashbookExpandedRowsPerPage() {
      if (Number(state.cashbookExpandedPageSize || 0) > 0) {
        return Math.max(1, Number(state.cashbookExpandedPageSize));
      }
      const viewport = Math.max(620, Number(window.innerHeight || 900));
      const reservedSpace = 540;
      const rowHeight = 44;
      const available = Math.max(rowHeight * 4, viewport - reservedSpace);
      return Math.max(4, Math.min(15, Math.floor(available / rowHeight)));
    }

    function cashbookExpandedPagination(total, info) {
      return `
        <nav class="launch-pagination cash-ref-pagination" aria-label="Paginação do livro caixa expandido">
          <span class="launch-pagination-info">Mostrando ${info.start} a ${info.end} de ${total} lançamentos</span>
          <div class="launch-pagination-controls">
            <button class="page-btn" type="button" aria-label="Página anterior" ${info.page <= 1 ? 'disabled' : ''} onclick="setCashbookExpandedPage(${info.page - 1})">‹</button>
            ${cashbookExpandedPageButtons(info.page, info.pages)}
            <button class="page-btn" type="button" aria-label="Próxima página" ${info.page >= info.pages ? 'disabled' : ''} onclick="setCashbookExpandedPage(${info.page + 1})">›</button>
          </div>
        </nav>`;
    }

    function cashbookExpandedPageButtons(page, pages) {
      const nums = pages <= 3
        ? Array.from({ length: pages }, (_, index) => index + 1)
        : unique([1, page, pages].filter(item => item >= 1 && item <= pages)).sort((a, b) => a - b);
      return nums.map((num, index) => `
        ${index && num - nums[index - 1] > 1 ? '<span class="launch-pagination-gap" aria-hidden="true">...</span>' : ''}
        <button class="page-btn ${num === page ? 'active' : ''}" type="button" aria-label="Página ${num}" onclick="setCashbookExpandedPage(${num})">${num}</button>
      `).join('');
    }

    function setCashbookExpandedPage(page) {
      state.cashbookExpandedPage = page;
      renderCashbookCards();
      requestAnimationFrame(() => {
        const list = $('#cashRefCards');
        if (list) list.scrollTop = 0;
      });
    }

    function cashbookReferenceSections() {
      const range = {
        start: $('#cashStart') ? $('#cashStart').value : `${IBC_YEAR_START}-01-01`,
        end: $('#cashEnd') ? $('#cashEnd').value : `${IBC_YEAR_END}-12-31`
      };
      const selectedCategory = $('#cashCategorySelect') ? $('#cashCategorySelect').value : '';
      const query = ($('#cashRefSearch') ? $('#cashRefSearch').value : '').trim().toLowerCase();
      const all = Array.isArray(state.allTransactions) && state.allTransactions.length
        ? state.allTransactions
        : Array.isArray(state.transactions) ? state.transactions : [];
      const filtered = all
        .filter(item => String(item.Data || '') >= range.start && String(item.Data || '') <= range.end)
        .sort((a, b) => String(a.Data || '').localeCompare(String(b.Data || '')) || String(a.CriadoEm || '').localeCompare(String(b.CriadoEm || '')));
      const groups = {};
      filtered
        .map(item => cashbookCategoryEntry(item))
        .filter(Boolean)
        .filter(item => !selectedCategory || (item.Categoria || 'Sem categoria') === selectedCategory)
        .filter(item => transactionSearchMatches(item, query))
        .forEach(item => {
          const title = item.Categoria || 'Sem categoria';
          groups[title] ||= { title, rows: [], total: 0, subtitles: {} };
          groups[title].rows.push({
            ...item,
            _cashDetail: cashbookCategoryTargetDetail(item)
          });
          groups[title].total += ledgerDelta(item);
          const subtitle = item.Subcategoria || 'Movimentações realizadas';
          groups[title].subtitles[subtitle] = (groups[title].subtitles[subtitle] || 0) + Number(item.Valor || 0);
        });
      const availableSections = cashbookAvailableSections(range, query);
      const categorySections = Object.values(groups)
        .map(group => ({
          ...group,
          subtitle: Object.entries(group.subtitles).sort((a, b) => b[1] - a[1])[0]?.[0] || 'Movimentações realizadas',
          rows: cashbookReverseBalanceRows(group.rows)
        }))
        .sort((a, b) => Math.abs(b.total) - Math.abs(a.total));
      if (selectedCategory === 'Disponível') return availableSections;
      if (selectedCategory) return categorySections;
      return [...availableSections, ...categorySections];
    }

    function cashbookCategoryEntry(item) {
      if (item.Fluxo === 'Entrada') {
        return { ...item, Fluxo: 'Saída', _originalFluxo: item.Fluxo };
      }
      if (item.Fluxo === 'Saída') {
        return { ...item, Fluxo: 'Entrada', _originalFluxo: item.Fluxo };
      }
      return null;
    }

    function cashbookAvailableSections(range, query = '') {
      const all = Array.isArray(state.allTransactions) && state.allTransactions.length
        ? state.allTransactions
        : Array.isArray(state.transactions) ? state.transactions : [];
      const accountSource = (state.catalogs?.accounts && state.catalogs.accounts.length)
        ? state.catalogs.accounts
        : (state.dashboard?.accounts || []);
      const rangeItems = all
        .filter(item => String(item.Data || '') >= range.start && String(item.Data || '') <= range.end)
        .sort((a, b) => String(a.Data || '').localeCompare(String(b.Data || '')) || String(a.CriadoEm || '').localeCompare(String(b.CriadoEm || '')));
      const previousItems = all
        .filter(item => String(item.Data || '') < range.start)
        .sort((a, b) => String(a.Data || '').localeCompare(String(b.Data || '')) || String(a.CriadoEm || '').localeCompare(String(b.CriadoEm || '')));

      return accountSource.map((account, index) => {
        const name = account.Nome || account.name || 'Conta';
        let saldo = Number(account.SaldoInicial ?? account.Saldo ?? account.balance ?? 0);
        previousItems.forEach(item => {
          const leg = accountLeg(name, item);
          if (leg) saldo += Number(leg.entrada || 0) - Number(leg.saida || 0);
        });
        const rows = rangeItems.map(item => {
          const leg = accountLeg(name, item);
          if (!leg) return null;
          saldo += Number(leg.entrada || 0) - Number(leg.saida || 0);
          const entrada = Number(leg.entrada || 0);
          const saida = Number(leg.saida || 0);
          const targetDetail = cashbookAvailableTargetDetail(name, item, leg);
          return {
            ...item,
            Fluxo: entrada ? 'Entrada' : 'Saída',
            Valor: entrada || saida,
            Categoria: 'Disponível',
            Subcategoria: name,
            _cashSaldo: saldo,
            _cashDetail: targetDetail
          };
        }).filter(Boolean);
        const visibleRows = rows
          .filter(item => transactionSearchMatches(item, query))
          .sort(sortTransactionsDesc);
        if (!visibleRows.length) return null;
        return {
          key: `Disponível|${name}`,
          title: 'Disponível',
          subtitle: name,
          total: rows.length ? Number(rows[rows.length - 1]._cashSaldo || 0) : saldo,
          rows: visibleRows,
          iconIndex: index
        };
      }).filter(Boolean);
    }

    function transactionSearchMatches(item, query) {
      if (!query) return true;
      const date = String(item.Data || '');
      return [date, date ? formatDate(date) : '', numberFor(item), item.Historico]
        .some(value => String(value || '').toLowerCase().includes(query));
    }

    function cashbookAvailableTargetDetail(accountName, item, leg) {
      if (Number(leg?.entrada || 0) > 0) {
        return cashbookDetailText('Disponível', accountName);
      }
      if (item.Fluxo === 'Transferência') {
        return cashbookDetailText('Disponível', item.Destino || accountName);
      }
      const destinationPlan = cashbookPlanParts(item.Destino);
      if (destinationPlan) return cashbookDetailText(destinationPlan.category, destinationPlan.subcategory);
      return cashbookDetailText(item.Categoria, item.Subcategoria);
    }

    function cashbookCategoryTargetDetail(item) {
      const originalFlow = item._originalFluxo || item.Fluxo;
      if (originalFlow === 'Entrada') return cashbookDetailText('Disponível', item.Destino);
      if (originalFlow === 'Saída') return cashbookDetailText('Disponível', item.Origem);
      if (originalFlow === 'Transferência') {
        return `${cashbookDetailText('Disponível', item.Origem)} para ${cashbookDetailText('Disponível', item.Destino)}`;
      }
      return cashbookDetailText(item.Categoria, item.Subcategoria);
    }

    function cashbookPlanParts(value) {
      const text = String(value || '').trim();
      if (!text) return null;
      const separator = text.includes(' / ') ? ' / ' : text.includes('|') ? '|' : '';
      if (!separator) return null;
      const [category, subcategory] = text.split(separator).map(part => part.trim());
      if (!category || !subcategory) return null;
      return { category, subcategory };
    }

    function cashbookDetailText(category, subcategory) {
      return [category, subcategory].filter(Boolean).join(' · ');
    }

    function cashbookReverseBalanceRows(rows) {
      const ordered = (rows || []).slice().sort(sortTransactionsDesc);
      let balance = ordered.reduce((sum, item) => sum + ledgerDelta(item), 0);
      return ordered.map(item => {
        const row = { ...item, _cashSaldo: balance };
        balance -= ledgerDelta(item);
        return row;
      });
    }

    function cashbookFlowText(item) {
      if (item.Fluxo === 'Transferência') return 'Transferência';
      return item.Fluxo === 'Entrada' ? 'Entrada - Receita' : 'Saída - Despesa';
    }

    function cashbookCardIcon(index) {
      const icons = [
        '<svg viewBox="0 0 24 24"><path d="M8 3v18"></path><path d="M4 9h8"></path><path d="M16 3v18"></path><path d="M12 7h8"></path></svg>',
        '<svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 0 0-5 5c0 4 5 8 5 8s5-4 5-8a5 5 0 0 0-5-5z"></path><path d="M9 21h6"></path><path d="M12 8v3"></path></svg>',
        '<svg viewBox="0 0 24 24"><path d="M4 19h16"></path><path d="M6 19V9"></path><path d="M12 19V5"></path><path d="M18 19v-7"></path></svg>'
      ];
      return icons[index % icons.length];
    }

    function cashbookHtml(book) {
      const accounts = book.accounts.map(section => cashSection(section)).join('');
      const categories = cashCategoryGroups(book.categories || []);
      return `
        <div class="cash-major">1. DISPONÍVEL</div>
        ${accounts || '<div class="cash-sub">Nenhuma conta cadastrada</div>'}
        <div class="cash-grand"><b>TOTAL - DISPONÍVEL</b><span>${money.format(book.totals.entrada)}</span><span>${money.format(book.totals.saida)}</span><span>${money.format(book.totals.saldo)}</span></div>
        ${categories}
      `;
    }

    function cashSection(section, category = false) {
      const title = category ? `${section.subcodigo} ${section.subtitulo || 'SEM SUBCATEGORIA'}` : `${section.codigo} ${section.titulo}`;
      const totalLabel = section.subtitulo || section.titulo;
      const totalClass = category && Number(section.totalSaida || 0) > Number(section.totalEntrada || 0) ? ' cash-total-red' : '';
      const rows = [
        `<tr><td>${formatDate(section.openingDate)}</td><td>-</td><td><strong>${escapeHtml(section.openingLabel)}</strong></td><td>-</td><td>-</td><td>${money.format(section.opening || 0)}</td></tr>`,
        ...section.rows.map(row => `<tr><td>${formatDate(row.data)}</td><td>${escapeHtml(row.numero)}</td><td>${escapeHtml(String(row.historico || '').toLowerCase())}</td><td>${row.entrada ? money.format(row.entrada) : '-'}</td><td>${row.saida ? money.format(row.saida) : '-'}</td><td>${money.format(row.saldo)}</td></tr>`),
        `<tr class="cash-total${totalClass}"><td colspan="3">TOTAL - ${escapeHtml(totalLabel)}</td><td>${money.format(section.totalEntrada || 0)}</td><td>${money.format(section.totalSaida || 0)}</td><td>${money.format(section.saldoFinal || 0)}</td></tr>`
      ].join('');
      return `
        <div class="cash-sub">${title}</div>
        <table class="cash-table">
          <thead><tr><th>Data</th><th>Nº lançamento</th><th>Histórico</th><th>Entrada</th><th>Saída</th><th>Saldo</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function cashCategoryGroups(sections) {
      const groups = {};
      sections.forEach(section => {
        const key = `${section.codigo}|${section.titulo}`;
        if (!groups[key]) groups[key] = { codigo: section.codigo, titulo: section.titulo, sections: [] };
        groups[key].sections.push(section);
      });
      return Object.values(groups).map(group => {
        const totalEntrada = group.sections.reduce((sum, section) => sum + Number(section.totalEntrada || 0), 0);
        const totalSaida = group.sections.reduce((sum, section) => sum + Number(section.totalSaida || 0), 0);
        const saldo = group.sections.reduce((sum, section) => sum + Number(section.saldoFinal || 0), 0);
        const negative = totalSaida > totalEntrada;
        return `
          <div class="cash-major">${escapeHtml(group.codigo)}. ${escapeHtml(group.titulo)}</div>
          ${group.sections.map(section => cashSection(section, true)).join('')}
          <div class="cash-grand ${negative ? 'negative' : ''}"><b>TOTAL - ${escapeHtml(group.titulo)}</b><span>${money.format(totalEntrada)}</span><span>${money.format(totalSaida)}</span><span>${money.format(saldo)}</span></div>
        `;
      }).join('');
    }

    async function downloadLivroCaixaAtual() {
      const start = $('#cashStart') ? $('#cashStart').value : '2026-01-01';
      const end = $('#cashEnd') ? $('#cashEnd').value : '2026-12-31';
      const account = $('#cashAccount') ? $('#cashAccount').value : '';
      await abrirLivroCaixaPdf({ start, end, account }, false);
    }

    async function printLivroCaixaAtual() {
      const start = $('#cashStart') ? $('#cashStart').value : '2026-01-01';
      const end = $('#cashEnd') ? $('#cashEnd').value : '2026-12-31';
      const account = $('#cashAccount') ? $('#cashAccount').value : '';
      await abrirLivroCaixaPdf({ start, end, account }, true);
    }

    async function downloadLivroCaixaAno(year) {
      await abrirLivroCaixaPdf({ start: `${year}-01-01`, end: `${year}-12-31`, account: '' }, false);
    }

    async function printLivroCaixaAno(year) {
      await abrirLivroCaixaPdf({ start: `${year}-01-01`, end: `${year}-12-31`, account: '' }, true);
    }

    async function abrirLivroCaixaPdf(filters, imprimir = false) {
      const popup = imprimir ? abrirPopupLivroCaixa('Preparando impressão...') : null;
      try {
        toast(imprimir ? 'Abrindo impressão no modelo Fuji Finance...' : 'Baixando PDF no modelo Fuji Finance...', 'success');
        const rawBook = await serverCall('obterLivroCaixa', filters || {});
        const year = String((filters && filters.start) || (rawBook.periodo && rawBook.periodo.start) || '2026-01-01').slice(0, 4);
        const blob = fujiBookPdfBlob(fujiAdaptCashBook(rawBook), year);
        const filename = `LIVRO CAIXA - RELATÓRIO DETALHADO ${year}.pdf`;
        if (imprimir) {
          const url = URL.createObjectURL(blob);
          const win = popup || window.open(url, '_blank');
          if (win && win.location) win.location.href = url;
          setTimeout(() => {
            try { win && win.print && win.print(); } catch (error) {}
          }, 1200);
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } else {
          fujiDownloadBlob(blob, filename);
        }
        toast(imprimir ? 'PDF aberto para impressão.' : 'PDF baixado no modelo Fuji Finance.', 'success');
      } catch (error) {
        if (popup) {
          popup.document.body.innerHTML = `<div class="box"><strong>Não foi possível gerar o PDF.</strong><p>${escapeHtml(error.message)}</p></div>`;
        }
        toast(error.message, 'error');
      }
    }

    function abrirPopupLivroCaixa(message) {
      const popup = window.open('', '_blank');
      if (!popup) return null;
      popup.document.open();
      popup.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Livro caixa</title><style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Rubik,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f6fb;color:#103367}
        .box{background:#fff;border:1px solid #dbe4f0;border-radius:16px;padding:28px 34px;box-shadow:0 14px 40px rgba(16,51,103,.08);text-align:center}
        .spin{width:34px;height:34px;border:4px solid #dbe4f0;border-top-color:#103367;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
        @keyframes s{to{transform:rotate(360deg)}}
      </style></head><body><div class="box"><div class="spin"></div><strong>${escapeHtml(message || 'Gerando Livro Caixa...')}</strong><p>Aguarde, o PDF será aberto aqui.</p></div></body></html>`);
      popup.document.close();
      return popup;
    }

    function fmtDate(value) {
      return formatDate(value);
    }

    function cashBookFlowValues(x) {
      const signed = (Number(x.entry) || 0) - (Number(x.exit) || 0);
      return { entrada: signed > 0 ? signed : 0, saida: signed < 0 ? Math.abs(signed) : 0, signedValue: signed };
    }

    function fujiAdaptCashBook(book) {
      const adapted = { accounts: [], items: [], categoryItems: [] };
      (book.accounts || []).forEach((section, accountIndex) => {
        const name = section.titulo || section.name || `Conta ${accountIndex + 1}`;
        adapted.accounts.push({ name, opening: Number(section.opening || 0) });
        (section.rows || []).forEach((row, rowIndex) => {
          adapted.items.push({

      });
      objects[pagesId - 1] = `<< /Type /Pages /Kids [${pageIds.map(id => `${id} 0 R`).join(' ')}] /Count ${pageIds.length} >>`;
      const catalogId = addObject(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
      const chunks = [fujiPdfBytesFromString('%PDF-1.4\n')];
      const offsets = [0];
      let length = chunks[0].length;
      objects.forEach((body, index) => {
        offsets.push(length);
        const chunk = fujiPdfBytesFromString(`${index + 1} 0 obj\n${body}\nendobj\n`);
        chunks.push(chunk);
        length += chunk.length;
      });
      const xrefOffset = length;
      let xref = `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
      offsets.slice(1).forEach(offset => xref += `${String(offset).padStart(10, '0')} 00000 n \n`);
      xref += `trailer\n<< /Size ${objects.length + 1} /Root ${catalogId} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
      chunks.push(fujiPdfBytesFromString(xref));
      return new Blob(chunks, { type: 'application/pdf' });
    }

    function base64ToBlob(base64, mimeType) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mimeType || 'application/pdf' });
    }

    function livroCaixaSectionHtml(section, category = false) {
      const title = category ? `${section.subcodigo} ${section.subtitulo || 'SEM SUBCATEGORIA'}` : `${section.codigo} ${section.titulo}`;
      const totalLabel = section.subtitulo || section.titulo;
      const negative = category && Number(section.totalSaida || 0) > Number(section.totalEntrada || 0);
      const opening = Number(section.opening || 0);
      const rows = [
        `<tr><td>${formatDate(section.openingDate)}</td><td>-</td><td><strong>${escapeHtml(section.openingLabel)}</strong></td><td>-</td><td>-</td><td>${money.format(opening)}</td></tr>`,
        ...(section.rows || []).map(row => `
          <tr>
            <td>${formatDate(row.data)}</td>
            <td>${escapeHtml(row.numero || '-')}</td>
            <td>${escapeHtml(String(row.historico || '').toLowerCase())}</td>
            <td>${row.entrada ? money.format(row.entrada) : '-'}</td>
            <td>${row.saida ? money.format(row.saida) : '-'}</td>
            <td>${money.format(row.saldo || 0)}</td>
          </tr>`),
        `<tr class="book-total ${negative ? 'negative' : ''}"><td colspan="3">TOTAL - ${escapeHtml(totalLabel)}</td><td>${section.totalEntrada ? money.format(section.totalEntrada) : '-'}</td><td>${section.totalSaida ? money.format(section.totalSaida) : '-'}</td><td>${money.format(section.saldoFinal || 0)}</td></tr>`
      ].join('');

          <tbody>${rows}</tbody>

    }

    function livroCaixaCategoryGroupsHtml(sections) {
      const groups = {};
      sections.forEach(section => {
        const key = `${section.codigo}|${section.titulo}`;
        if (!groups[key]) groups[key] = { codigo: section.codigo, titulo: section.titulo, sections: [] };
        groups[key].sections.push(section);
      });
      return Object.values(groups).map(group => {
        const totalEntrada = group.sections.reduce((sum, section) => sum + Number(section.totalEntrada || 0), 0);
        const totalSaida = group.sections.reduce((sum, section) => sum + Number(section.totalSaida || 0), 0);
        const saldo = group.sections.reduce((sum, section) => sum + Number(section.saldoFinal || 0), 0);
        return `
          <div class="book-major-title">${escapeHtml(group.codigo)}. ${escapeHtml(group.titulo)}</div>
          ${group.sections.map(section => livroCaixaSectionHtml(section, true)).join('')}
          ${livroCaixaGrandTotalHtml(`TOTAL - ${group.titulo}`, totalEntrada, totalSaida, saldo, totalSaida > totalEntrada)}
        `;
      }).join('');
    }

    function analyticsSetFilter(key, value) {
      state.analyticsFilters[key] = value;
      if (key === 'category') {
        state.analyticsFilters.subcategory = '';
        state.analyticsChartSelectedYear = null;
        state.analyticsChartSelectedMonth = null;
        analyticsRenderSubcategoryFilter();
      }
      if (key === 'subcategory') {
        state.analyticsChartSelectedYear = null;
        state.analyticsChartSelectedMonth = null;
      }
      renderAnalyticsBody();
    }

    function analyticsResetFilters() {
      state.analyticsFilters = { year: '', quarter: '', month: '', flow: '', category: '', subcategory: '', chartType: 'line' };
      state.analyticsChartSelectedYear = null;
      state.analyticsChartSelectedMonth = null;
      renderAnalytics();
    }

    function renderAnalyticsBody() {
      const items = analyticsReferenceItems();
      const summary = analyticsSummary(analyticsReferenceVisibleItems(items));
      const selectedCategory = analyticsReferenceSelectedCategoryLabel();
      $('#analyticsBody').innerHTML = analyticsReferenceSelectedChart(items, summary, selectedCategory);
      requestAnimationFrame(syncAnalyticsReferenceLineChartSize);
      observeAnalyticsReferenceLineChart();
    }

    function observeAnalyticsReferenceLineChart() {
      if (state.analyticsChartResizeObserver) {
        state.analyticsChartResizeObserver.disconnect();
        state.analyticsChartResizeObserver = null;
      }
      const chart = $('.analytics-ref-chart');
      if (!chart || typeof ResizeObserver === 'undefined') return;
      state.analyticsChartResizeObserver = new ResizeObserver(() => {
        clearTimeout(state.analyticsResizeTimer);
        state.analyticsResizeTimer = setTimeout(syncAnalyticsReferenceLineChartSize, 40);
      });
      state.analyticsChartResizeObserver.observe(chart);
    }

    function syncAnalyticsReferenceLineChartSize() {
      if (state.route !== 'analytics' || analyticsReferenceNormalizedChartType(state.analyticsFilters.chartType) !== 'line') return;
      const chart = $('.analytics-ref-chart');
      if (!chart) return;
      const rect = chart.getBoundingClientRect();
      const width = Math.max(320, Math.round(rect.width));
      const height = Math.max(300, Math.round(rect.height));
      const svg = chart.querySelector('svg');
      const sameWidth = Number(svg?.dataset.chartWidth || 0) === width;
      const sameHeight = Number(svg?.dataset.chartHeight || 0) === height;
      if (sameWidth && sameHeight) return;
      chart.innerHTML = analyticsReferenceLineChart(analyticsReferenceItems(), { width, height });
    }

    function analyticsRenderSubcategoryFilter() {
      const slot = $('#analyticsSubcategorySlot');
      if (slot) slot.innerHTML = analyticsReferenceSubcategoryFilter();
    }

    function analyticsReferenceSelectedCategoryLabel() {
      const category = state.analyticsFilters.category || 'Todas as categorias';
      const subcategory = state.analyticsFilters.subcategory || '';
      return subcategory ? `${category} · ${subcategory}` : category;
    }

    function analyticsReferenceChartTypeOptions() {
      const selected = analyticsReferenceNormalizedChartType(state.analyticsFilters.chartType);
      const options = [
        ['line', 'Gráficos de linhas'],
        ['category-pie', 'Pizza por categoria'],
        ['subcategory-pie', 'Pizza por subcategoria']
      ];
      return options.map(([value, label]) => `<option value="${value}" ${selected === value ? 'selected' : ''}>${label}</option>`).join('');
    }

    function analyticsReferenceSelectedChart(items, summary, selectedCategory) {
      const chartType = analyticsReferenceNormalizedChartType(state.analyticsFilters.chartType);
      if (chartType === 'line') return analyticsReferenceCard(items, summary, selectedCategory);
      return analyticsReferencePieSection(items, chartType);
    }

    function analyticsReferenceNormalizedChartType(type) {
      if (type === 'entrada-category' || type === 'saida-category') return 'category-pie';
      if (type === 'entrada-subcategory' || type === 'saida-subcategory') return 'subcategory-pie';
      return type || 'line';
    }

    function analyticsReferenceItems() {
      const source = (state.analyticsTransactions && state.analyticsTransactions.length)
        ? state.analyticsTransactions
        : (state.allTransactions && state.allTransactions.length)
          ? state.allTransactions
          : (state.transactions || []);
      const category = state.analyticsFilters.category || '';
      const subcategory = state.analyticsFilters.subcategory || '';
      return source
        .filter(item => !category || (item.Categoria || 'Sem categoria') === category)
        .filter(item => !subcategory || (item.Subcategoria || 'Sem subcategoria') === subcategory)
        .filter(item => {
          const year = Number(String(item.Data || '').slice(0, 4));
          return year >= IBC_YEAR_START && year <= IBC_YEAR_END;
        })
        .sort((a, b) => String(a.Data || '').localeCompare(String(b.Data || '')) || String(a.CriadoEm || '').localeCompare(String(b.CriadoEm || '')));
    }

    function analyticsReferenceVisibleItems(items) {
      const year = Number(state.analyticsChartSelectedYear || 0);
      const month = Number(state.analyticsChartSelectedMonth || 0);
      return (items || []).filter(item => {
        const date = String(item.Data || '');
        if (year && date.slice(0, 4) !== String(year)) return false;
        if (month && date.slice(5, 7) !== String(month).padStart(2, '0')) return false;
        return true;
      });
    }

    function analyticsReferenceCategoryOptions() {
      const source = (state.analyticsTransactions && state.analyticsTransactions.length)
        ? state.analyticsTransactions
        : (state.allTransactions || []);
      const categories = unique(source.map(item => item.Categoria || 'Sem categoria')).sort();
      return categories.map(category => `<option value="${escapeHtml(category)}" ${state.analyticsFilters.category === category ? 'selected' : ''}>${escapeHtml(category)}</option>`).join('');
    }

    function analyticsReferenceSubcategoryFilter() {
      const category = state.analyticsFilters.category || '';
      if (!category) return '';
      const options = analyticsReferenceSubcategoryOptions(category);
      if (!options) return '';
      return `
        <label class="ibc-filter-pill cash-category-pill analytics-subcategory-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h11"></path><path d="M8 12h11"></path><path d="M8 18h11"></path><path d="M4 6h.01"></path><path d="M4 12h.01"></path><path d="M4 18h.01"></path></svg>
          <select class="analytics-ref-select" id="analyticsSubcategory" aria-label="Subcategorias dos gráficos" onchange="analyticsSetFilter('subcategory', this.value)">
            <option value="">Subcategorias</option>
            ${options}

          <svg class="ibc-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </label>`;
    }

    function analyticsReferenceSubcategoryOptions(category) {
      const transactionSource = ((state.analyticsTransactions && state.analyticsTransactions.length) ? state.analyticsTransactions : (state.allTransactions || []))
        .filter(item => (item.Categoria || 'Sem categoria') === category);
      const subcategories = unique(transactionSource.map(item => item.Subcategoria || 'Sem subcategoria')).sort();
      return subcategories.map(subcategory => `<option value="${escapeHtml(subcategory)}" ${state.analyticsFilters.subcategory === subcategory ? 'selected' : ''}>${escapeHtml(subcategory)}</option>`).join('');

    function analyticsReferencePeriodLabel(items) {
      const dates = (Array.isArray(items) ? items : [])
        .map(item => String(item.Data || ''))
        .filter(Boolean)
        .sort();
      if (!dates.length) return `${IBC_YEAR_START} - ${IBC_YEAR_END}`;
      return `${launchShortDate(dates[0])} - ${launchShortDate(dates[dates.length - 1])}`;

      const meta = analyticsReferenceViewMeta();

        <button type="button" class="ibc-back-button" aria-label="Voltar no gráfico" onclick="backAnalyticsReferenceChart()">
